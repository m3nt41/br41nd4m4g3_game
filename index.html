<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>BR41N D4M4G3</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    body { display: grid; place-items: center; }
    /* Proporción 16:9 que se adapta al contenedor (iframe o ventana) */
    canvas {
      display: block;
      width: min(100vw, calc(100vh * 16 / 9));
      aspect-ratio: 16 / 9;
      background: #000;
      outline: none;
      touch-action: none;
    }
    #fps {
      display: none;
      position: fixed;
      left: 8px;
      top: 6px;
      font: 11px/1.3 ui-monospace, Consolas, monospace;
      color: #6a6a6a;
      pointer-events: none;
      white-space: pre;
    }
    /* Joystick virtual: solo aparece mientras se toca la pantalla (dispositivos táctiles) */
    #joy {
      display: none;
      position: fixed;
      width: 112px;
      height: 112px;
      margin: -56px 0 0 -56px;
      border: 1px solid #5a5a5a;
      border-radius: 50%;
      pointer-events: none;
    }
    #joy i {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 34px;
      height: 34px;
      margin: -17px 0 0 -17px;
      border: 1px solid #a0a0a0;
      border-radius: 50%;
    }
    /* Botón de interactuar para pantallas táctiles: solo aparece cerca de algo con lo que se puede interactuar */
    #btnE {
      display: none;
      position: fixed;
      right: 28px;
      bottom: 28px;
      width: 64px;
      height: 64px;
      border: 1px solid #b0b0b0;
      border-radius: 50%;
      color: #d0d0d0;
      font: 22px/62px ui-monospace, Consolas, monospace;
      text-align: center;
      user-select: none;
      touch-action: none;
    }
    /* Teclado numérico del panel del código (también sirve con el mouse; con teclado se escribe directo) */
    #teclado {
      display: none;
      position: fixed;
      right: 22px;
      top: 50%;
      transform: translateY(-50%);
      grid-template-columns: repeat(3, 54px);
      gap: 8px;
    }
    #teclado button {
      width: 54px;
      height: 54px;
      padding: 0;
      background: rgba(0, 0, 0, 0.65);
      border: 1px solid #9a9a9a;
      border-radius: 50%;
      color: #d8d8d8;
      font: 20px ui-monospace, Consolas, monospace;
      cursor: pointer;
      touch-action: none;
    }
    #teclado button:active { border-color: #e2b84a; color: #e2b84a; }
    #teclado .cerrar { grid-column: 1 / 4; justify-self: center; width: 54px; margin-top: 4px; }
    /* Cruz de flechas para la prueba de ESPERANZA en pantallas táctiles (con teclado se usan las flechas o W A S D) */
    #flechas {
      display: none;
      position: fixed;
      right: 24px;
      bottom: 24px;
      grid-template-columns: repeat(3, 62px);
      grid-template-rows: repeat(2, 62px);
      gap: 8px;
    }
    #flechas button {
      padding: 0;
      background: rgba(0, 0, 0, 0.65);
      border: 1px solid #b0b0b0;
      border-radius: 50%;
      color: #e0e0e0;
      font: 24px ui-monospace, Consolas, monospace;
      touch-action: none;
    }
    #flechas button:active { border-color: #e2b84a; color: #e2b84a; }
    /* Botón de los finales: "Intentar de nuevo" / "Jugar de nuevo" */
    #btnFin {
      display: none;
      position: fixed;
      left: 50%;
      bottom: 16vh;
      transform: translateX(-50%);
      padding: 12px 28px;
      background: transparent;
      border: 1px solid #b0b0b0;
      color: #e6e6e6;
      font: 18px ui-monospace, Consolas, monospace;
      letter-spacing: 0.08em;
      white-space: nowrap;
      cursor: pointer;
    }
    #btnFin:hover, #btnFin:focus-visible { border-color: #e2b84a; color: #e2b84a; outline: none; }
    /* "Volver al sitio" de la pantalla de victoria: debajo de "Jugar de nuevo", con el mismo aspecto */
    #btnFinSitio {
      display: none;
      position: fixed;
      left: 50%;
      bottom: max(10px, calc(16vh - 66px));
      transform: translateX(-50%);
      box-sizing: border-box;
      padding: 12px 28px;
      border: 1px solid #6a6a6a;
      color: #a8a8a8;
      font: 16px ui-monospace, Consolas, monospace;
      letter-spacing: 0.08em;
      text-decoration: none;
      text-align: center;
      white-space: nowrap;
      cursor: pointer;
    }
    #btnFinSitio:hover, #btnFinSitio:focus-visible { border-color: #e2b84a; color: #e2b84a; outline: none; }
    /* Botón de silencio: siempre visible arriba a la derecha (también se silencia con la tecla M) */
    #mudo {
      position: fixed;
      right: 12px;
      top: 10px;
      width: 40px;
      height: 40px;
      padding: 0;
      display: grid;
      place-items: center;
      background: rgba(0, 0, 0, 0.55);
      border: 1px solid #6a6a6a;
      border-radius: 50%;
      color: #c8c8c8;
      cursor: pointer;
      touch-action: manipulation;
    }
    #mudo:hover, #mudo:focus-visible { border-color: #e2b84a; color: #e2b84a; outline: none; }
    #mudo svg { width: 22px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    #mudo { z-index: 20; }
    /* Botón de pausa (para pantallas táctiles, donde no hay tecla P): a la izquierda del de silencio; aparece al empezar el juego */
    #btnPausa {
      display: none;
      position: fixed;
      right: 60px;
      top: 10px;
      z-index: 20;
      width: 40px;
      height: 40px;
      padding: 0;
      place-items: center;
      background: rgba(0, 0, 0, 0.55);
      border: 1px solid #6a6a6a;
      border-radius: 50%;
      color: #c8c8c8;
      cursor: pointer;
      touch-action: manipulation;
    }
    #btnPausa:hover, #btnPausa:focus-visible { border-color: #e2b84a; color: #e2b84a; outline: none; }
    #btnPausa i { display: block; width: 4px; height: 16px; margin: 0 2px; background: currentColor; }
    #btnPausa span { display: flex; }
    /* Pantalla de pausa (tecla P): velo oscuro con dos botones */
    #pausa {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 10;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: rgba(0, 0, 0, 0.86);
    }
    #pausa .titulo {
      margin-bottom: 14px;
      color: #8a8a8a;
      font: 15px ui-monospace, Consolas, monospace;
      letter-spacing: 0.5em;
    }
    #pausa button, #pausa a {
      box-sizing: border-box;
      width: 260px;
      padding: 14px 0;
      background: transparent;
      border: 1px solid #b0b0b0;
      color: #e6e6e6;
      font: 18px ui-monospace, Consolas, monospace;
      letter-spacing: 0.08em;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
    }
    #pausa button:hover, #pausa button:focus-visible, #pausa a:hover, #pausa a:focus-visible { border-color: #e2b84a; color: #e2b84a; outline: none; }
  </style>
</head>
<body>
  <canvas id="juego" tabindex="0" aria-label="Juego de cerebritos"></canvas>
  <div id="fps"></div>
  <div id="joy"><i></i></div>
  <div id="btnE">E</div>
  <div id="teclado"></div>
  <div id="flechas"></div>
  <button id="btnFin" type="button"></button>
  <a id="btnFinSitio" target="_top" rel="noopener">Volver al sitio</a>
  <button id="mudo" type="button" aria-label="Silenciar sonido"></button>
  <button id="btnPausa" type="button" aria-label="Pausa"><span><i></i><i></i></span></button>
  <div id="pausa" role="dialog" aria-label="Pausa">
    <div class="titulo">PAUSA</div>
    <button id="btnReanudar" type="button">Reanudar</button>
    <button id="btnInicio" type="button">Volver al inicio</button>
    <a id="btnSitio" target="_top" rel="noopener">Volver al sitio</a>
  </div>

  <script>
    // ===== Configuración (editable) =====
    const CONFIG = {
      logico: { w: 1280, h: 720 },   // resolución lógica fija (se escala al contenedor)
      dprMax: 2,                     // tope de devicePixelRatio
      semilla: 1337,                 // semilla fija: nada parpadea entre cargas
      colorTrazo: '#d0d0d0',
      personaje: 'encapuchado',      // quién aparece elegido al abrir la página (id de PERSONAJES): 'encapuchado' o 'humano'
      colorMal: '#c8352d',           // acento: rojo oscuro del cerebro malvado
      colorOro: '#e2b84a',           // acento: dorado de la cerradura de la puerta que hay que abrir
      coloresSlot: ['#a06bff', '#43b6ff', '#ff5fb4'],   // color de cada casillero del código: morado, celeste y rosa (los números llevan el suyo)
      colorPasto: '#7fa17f',         // el pasto de las salas de los números

      // Cerebrito mini (tamaño decidido en la Fase 0)
      tamCerebrito: 6,               // ancho en px lógicos
      variaciones: 4,                // formas distintas
      bultos: 4,                     // bultos del contorno por lado
      grosorMin: 0.6,                // grosor mínimo del trazo (px lógicos)
      grosorRel: 0.13,               // grosor relativo al tamaño
      grosorMinPantalla: 0.8,        // grosor mínimo en píxeles reales de pantalla
      rotacionMax: 0.7,              // rotación base aleatoria (± radianes)

      // Personaje
      alturaPersonaje: 180,          // alto de la figura (px lógicos)
      velMax: 240,                   // velocidad máxima (px lógicos / s)
      acel: 9,                       // suavizado de la velocidad (1/s): más alto = más brusco
      colision: { mitadAncho: 17, mitadFondo: 8 },   // caja de los pies contra las paredes

      // Enjambre: cada cerebrito persigue su objetivo
      seguirMin: 26,                 // rapidez de seguimiento mínima (1/s)
      seguirMax: 40,                 // rapidez de seguimiento máxima (1/s)
      anticipo: 0.7,                 // 0 = se queda atrás del todo, 1 = pegado sin retraso
      vibAmp: 0.5,                   // vibración al estar quieto (px lógicos)
      vibVel: 2.2,                   // velocidad de la vibración
      rotOnda: 0.12,                 // vaivén de rotación (radianes)

      // Caminata (medidas en alturas del personaje, salvo cadencia)
      cadencia: 0.05,                // radianes de ciclo por px recorrido
      zancada: 0.09,                 // cuánto avanzan/retroceden los pies
      levante: 0.05,                 // cuánto levanta el pie al avanzar
      brazos: 0.075,                 // vaivén de las manos
      rebote: 0.012,                 // rebote vertical del cuerpo
      inclinacion: 0.02,             // cuánto se inclina hacia donde camina
      mezcla: 10,                    // rapidez con que entra/sale de la caminata (1/s)

      // Giro del cuerpo (hacia dónde mira): de frente, de espaldas o de perfil
      giro: {
        rapidez: 12,                 // qué tan rápido se da vuelta (1/s)
        perfilTorso: 0.42,           // ancho del torso de perfil respecto al de frente
        profundidad: 0.3             // cuánto baja en pantalla lo que está adelante (vista 3/4)
      },

      // El encapuchado (alturas en alturas del personaje)
      capa: {
        arriba: -0.90,               // altura de la punta de la capucha
        dobladillo: -0.12,           // altura del borde de la túnica: debajo flota, sin pies
        inclina: 0.06,               // cuánto se inclina hacia donde va
        arrastre: 0.065,             // segundos de retraso de la tela en el borde (a mayor velocidad, más arrastra)
        giro: 8,                     // rapidez del giro (resorte amortiguado): más bajo = se da vuelta más lento y suave
        elipse: 0.62,                // profundidad del cuerpo / ancho: 1 = redondo; menos = más delgado de lado que de frente
        profundidad: 0.25,           // cuánto baja en pantalla lo que está adelante (vista 3/4)
        alcance: 0.21,               // cuánto adelanta el brazo del farol (en alturas del personaje)
        bruma: 6                     // cerebritos de neblina bajo la túnica
      },

      // El cerebro con patas (en alturas del personaje)
      cerebro: {
        ancho: 0.30, alto: 0.21, fondo: 0.22,    // radios del cerebro: ancho, alto y fondo
        altura: 0.35,                            // altura del centro del cerebro sobre el suelo
        rebote: 0.02,                            // cuánto sube y baja al caminar
        inclina: 0.05,                           // cuánto se inclina hacia donde va
        profundidad: 0.25,                       // cuánto baja en pantalla lo que está adelante (vista 3/4)
        patas: { x: 0.15, z: 0.11, paso: 0.08, levante: 0.05 },   // dónde pisa cada pata y cuánto avanza / levanta
        medula: { n: 9, largo: 0.026, arrastre: 0.05 }
      },

      // El ojo (en alturas del personaje)
      ojo: {
        radio: 0.22,                             // radio del globo ocular
        altura: 0.30,                            // altura del centro del ojo sobre el suelo (bajo, para que el globo coincida con donde choca: los pies)
        rebote: 0.03,                            // cuánto sube y baja al caminar
        inclina: 0.05,                           // cuánto se inclina hacia donde va
        profundidad: 0.25,                       // cuánto baja en pantalla lo que está adelante (vista 3/4)
        nervio: { n: 10, largo: 0.012, arrastre: 0.05 }
      },

      // El gusano (en alturas del personaje)
      gusano: {
        n: 30,                                   // segmentos del cuerpo
        alto: 0.58,                              // altura de la cabeza al estar parado
        largo: 0.30,                             // cuánto se estira hacia atrás la cola al estar parado
        cabeza: 0.075,                           // radio de la cabeza
        ancho: 0.060,                            // medio ancho del cuerpo junto a la cabeza (se afina hasta la cola)
        rastro: 0.018,                           // segundos de retraso entre un segmento y el siguiente al reptar (a toda velocidad el cuerpo mide ~0.7 alturas)
        profundidad: 0.25                        // cuánto baja en pantalla lo que está adelante (vista 3/4)
      },

      // La araña (la mano) (en alturas del personaje)
      arana: {
        ancho: 0.14, alto: 0.11, fondo: 0.12,    // radios de la palma: ancho, alto y fondo
        altura: 0.31,                            // altura del centro de la palma sobre el suelo
        rebote: 0.012,                           // cuánto sube y baja al caminar
        inclina: 0.04,                           // cuánto se inclina hacia donde va
        profundidad: 0.25,                       // cuánto baja en pantalla lo que está adelante (vista 3/4)
        patas: { x: 0.20, z: 0.11, paso: 0.05, levante: 0.05 }   // dónde pisa cada dedo y cuánto avanza / levanta
      },

      // Mundo
      celda: 90,                    // lado de una celda (px lógicos)
      cacheMaxPx: 24e6,              // tope de píxeles por canvas de caché (memoria)
      // Cerebritos del escenario: tamaño (px lógicos), trazo y color opcional
      escenario: {
        muro:     { tam: 7,  grosorMin: 0.55 },    // ladrillos de las fachadas
        techo:    { tam: 8,  grosorMin: 0.55 },    // superficie plana de los muros
        suelo:    { tam: 4,  grosorMin: 0.45 },    // vértices y grietas del piso
        relieve:  { tam: 30, grosorMin: 1.0 },     // cerebros grandes tallados
        polvo:    { tam: 4,  grosorMin: 0.45 },    // polvo flotante
        rasgo:    { tam: 3.6, grosorMin: 0.45 },   // rasgos de la cara y el cuerpo del personaje
        llave:    { tam: 5,  grosorMin: 0.5 },     // la llave y el portal
        mal:      { tam: 5,  grosorMin: 0.5, color: 'mal' },  // el cerebro malvado (rojo)
        oro:      { tam: 5,  grosorMin: 0.5, color: 'oro' },  // la cerradura de la puerta final (dorada)
        pasto:    { tam: 4,  grosorMin: 0.45, color: 'pasto' },   // las matas de pasto
        slot0:    { tam: 5,  grosorMin: 0.5, color: 'slot0' },    // casillero 1 / número 1 (morado)
        slot1:    { tam: 5,  grosorMin: 0.5, color: 'slot1' },    // casillero 2 / número 2 (celeste)
        slot2:    { tam: 5,  grosorMin: 0.5, color: 'slot2' },    // casillero 3 / número 3 (rosa)
        // el encapuchado: cerebritos tenues y brillantes de tres tamaños (el normal de 6 px es el de "pers")
        capaXsTenue:  { tam: 3.6, grosorMin: 0.45, color: '#7a7a7a' },
        capaXsBrillo: { tam: 3.6, grosorMin: 0.45, color: '#ffffff' },
        capaS:        { tam: 4.6, grosorMin: 0.5 },
        capaSBrillo:  { tam: 4.6, grosorMin: 0.5, color: '#ffffff' },
        capaFarol:    { tam: 14,  grosorMin: 0.8, color: '#ffffff' }   // el farol del encapuchado: un solo cerebrito grande y brillante
      },
      polvo: { cantidad: 90, alfa: 0.4 },
      camara: { suavizado: 5, adelanto: 0.28 },    // adelanto: segundos de velocidad que mira hacia adelante
      luz: {
        radio: 430, oscuridad: 0.88, parpadeo: 0.02,           // oscuridad: 0 = todo visible, 1 = negro total
        // La luz del farol del encapuchado: un charco concentrado alrededor del cerebrito luminoso, más un resplandor
        // blanco sobre él. La luz general del personaje baja a "base" para que el charco se note y se corra con el farol.
        farol: { radio: 210, intensidad: 1, base: 0.7, resplandor: 80, brillo: 0.26, parpadeo: 0.05 }
      },

      // Objetos del nivel
      interaccion: { puerta: 95, cuadro: 110, salida: 210, panel: 100 },   // distancia máxima para usar cada cosa con E (px lógicos)
      // Texto que el cerebro malvado escribe en el suelo al darle E al cuadro
      texto: {
        paso: 6.5,                   // separación entre cerebritos de las letras (px lógicos)
        maxCerebritos: 3200,         // tope: si el texto necesita más, se separan un poco más
        escribir: 2.6,               // segundos que tarda en escribirse todo
        vuelo: 0.75,                 // segundos que tarda cada cerebrito en volar del cuadro a su sitio
        tamano: 1.2                  // cuánto se agranda cada cerebrito para que las letras queden llenas
      },
      llaves: { cantidad: 6, recoger: 34 },     // llaves por nivel (una real, el resto falsas) y a qué distancia se agarran al pasar
      explosion: { cerebritos: 26, duracion: 0.8 },   // la mini explosión de una llave falsa o de una palanca equivocada
      // La trampa de ESPERANZA: el cerebro malvado aparece, corre una cuenta 3-2-1, y recién cuando termina aparece una
      // combinación de flechas que hay que repetir rápido. Un solo error, o quedarse sin tiempo, y te devora.
      final: {
        aparece: 1.3,                // segundos que tarda en aparecer el monstruo antes de empezar la cuenta
        segundosPorNumero: 1.1,      // lo que dura cada número de la cuenta (3, 2, 1): tiempo total = 3 × esto
        flechas: 7,                  // cuántas flechas tiene la combinación
        segundosCombo: 5.5,          // tiempo para hacer la combinación una vez que aparecen las flechas
        portalDisparo: 105           // a qué distancia del portal-trampa de ESPERANZA se transforma en el cerebro (px lógicos)
      },
      // Criaturas decorativas del nivel 3 (solo visuales: no hacen daño ni hay que matarlas). Una especie por sala de número.
      // Pasto de las salas de los números: se abre al caminar y deja un sendero; el número está escondido debajo
      // abierto/cierra: el sendero está abierto del todo a menos de "abierto" px del personaje y se va cerrando hasta
      // quedar cerrado del todo a "cierra" px: así hay que caminar bien por encima del número para poder verlo
      // pincelX/pincelY: medio ancho y medio alto del sendero (px lógicos); pincelDesplaza lo sube hacia el cuerpo (menos pasto abierto "delante" de los pies)
      // huella: cada cuántos px se abre un trozo de sendero; resolucionMax: calidad máxima del pasto (1 = un píxel por px lógico)
      pasto: { paso: 10, pincelX: 44, pincelY: 26, pincelDesplaza: 6, hojas: 3, abierto: 130, cierra: 320, huella: 6, resolucionMax: 1 },
      bichos: {
        activo: false,               // apagadas por ahora (el código sigue ahí): ponelo en true para volver a verlas
        susto: 320,                  // a qué distancia del personaje se asustan y salen corriendo (px lógicos)
        ojos: 16, larvas: 16, aranas: 13    // cuántos hay de cada una
      },
      palancas: { alcance: 95, velocidad: 7 },        // distancia para tirarlas con E y rapidez con que se mueve la manija
      glifos: [9, 14, 20, 27, 35],                    // tamaños (px lógicos) de los cerebros que marcan cada palanca, de menor a mayor
      puertaAbrir: 1.3,              // segundos que tarda una puerta en deshacerse
      puertaTembloroTiempo: 0.45,    // segundos que tiembla la puerta final si no tenés la llave
      transicion: { salir: 0.8, entrar: 1.0 },    // fundido a negro al cambiar de nivel (segundos)

      // Pantalla de inicio: el título "BR41N D4M4G3" hecho de cerebritos
      inicio: {
        altura: 100,                 // alto base de las letras (px lógicos de 1280x720); el título es 100/170 del tamaño original
        paso: 5.5,                   // separación entre cerebritos del título
        escala: 0.8,                 // tamaño de cada cerebrito del título
        // dónde va el título (esquina inferior izquierda de cada línea; la segunda va escalonada), la indicación EMPEZAR
        // (su centro) y las instrucciones de teclas (centro de arriba; se saltan en pantallas táctiles)
        titulo: { x1: 110, base1: 180, x2: 175, base2: 315 },
        empezar: { x: 960, y: 425 },
        teclas: { x: 640, y: 520 },
        armado: 1.0,                // segundos que tarda cada cerebrito en volar a su sitio al aparecer el título
        salida: 1.4,                 // segundos que tarda en desvanecerse el título al empezar
        // Selector de personaje (a la derecha del título): x, y = pies del personaje; separacion = de él a cada flecha
        selector: { x: 960, y: 330, separacion: 135, morf: 1.0 }   // morf: segundos que tardan los cerebritos en acomodarse al cambiar
      },

      // La piscina de SALVACIÓN: al llegar a la puerta el personaje frena, la piscina se arma fila por fila y,
      // al llegar al centro, el personaje se desintegra y empieza la pantalla final
      piscina: {
        paso: 10,                    // separación entre cerebritos de la cuadrícula (px lógicos)
        margen: 14,                  // distancia de la piscina a las paredes del cuarto
        filaCada: 0.06,              // segundos entre una fila y la siguiente al armarse
        aparece: 0.5,                // segundos que tarda cada cerebrito en aparecer
        mitad: 26,                   // a qué distancia del centro (px lógicos) el personaje se desintegra
        desintegra: 2.2,             // segundos que tarda en deshacerse antes de la pantalla final
        ola: 2.2                     // velocidad de la ola de brillo que sale del centro
      },

      // Pausa (tecla P o Esc): "Volver al sitio" lleva a esta dirección (cambiala cuando el juego tenga su casa definitiva)
      pausa: { urlSitio: 'https://m3nt41com.vercel.app/' },

      // Sonido (todo generado con Web Audio; arranca con el primer input). M o el botón de arriba a la derecha lo silencian.
      sonido: {
        volumen: 0.5,                // volumen general (0..1)
        ambiente: 0.6,               // volumen del ambiente respecto al general
        efectos: 0.9,                // volumen de los efectos respecto al general
        reverb: 0.4,                 // cuánta cola de eco tiene todo
        filtroBase: 170,             // Hz del filtro del drone sin tensión (más alto = más brillante)
        filtroTension: 380,          // cuántos Hz más se abre el filtro con la tensión al máximo
        texturas: [6, 14],           // cada cuántos segundos (mín, máx) suena un detalle suelto: gota, susurro o retumbo lejano
        // Un drone por nivel: nota grave base (Hz) y tensión inicial (0..1)
        niveles: [{ base: 55, tension: 0.1 }, { base: 49, tension: 0.3 }, { base: 46.25, tension: 0.5 }]
      }
    };

    // ===== Niveles =====
    // Mapa: '#' muro  '.' piso  ' ' vacío  '@' inicio  'P' puerta de un cuartito (se abre con E)
    //       'D' puerta final (hace falta la llave).
    // Las puertas miran al sur: el cuarto que cierran es todo el espacio de piso conectado al norte de ellas.
    // Un cuarto cerrado se disfraza de muro hasta que se abre la puerta.

    // Laberinto perfecto (siempre se puede llegar a todo) tallado con DFS sobre una cuadrícula de celdas.
    // Los puntos (c0, r0) son la primera celda; las celdas están cada 2 casillas. Devuelve los callejones sin salida.
    function tallarLaberinto(g, c0, r0, nc, nr, entrada, atajos) {
      const [ec, er] = entrada;                              // índices de la celda de entrada
      const hecho = Array.from({ length: nr }, () => Array(nc).fill(false));
      const abierto = Array.from({ length: nr }, () => Array.from({ length: nc }, () => [false, false, false, false])); // der, abajo, izq, arriba
      const DIR = [[1, 0], [0, 1], [-1, 0], [0, -1]];
      const pos = (i, j) => [c0 + 2 * i, r0 + 2 * j];
      const tallar = (i, j) => { const [c, r] = pos(i, j); g[r][c] = '.'; };
      const mezclar = (a) => { for (let n = a.length - 1; n > 0; n--) { const m = Math.floor(Math.random() * (n + 1)); [a[n], a[m]] = [a[m], a[n]]; } return a; };
      const unir = (i, j, d) => {                            // abre el paso entre la celda (i,j) y su vecina en la dirección d
        const [dc, dr] = DIR[d], [c, r] = pos(i, j);
        g[r + dr][c + dc] = '.';
        abierto[j][i][d] = true; abierto[j + dr][i + dc][(d + 2) % 4] = true;
      };
      const pila = [[ec, er]]; hecho[er][ec] = true; tallar(ec, er);
      while (pila.length) {
        const [i, j] = pila[pila.length - 1];
        const libres = mezclar([0, 1, 2, 3]).filter((d) => {
          const ni = i + DIR[d][0], nj = j + DIR[d][1];
          return ni >= 0 && nj >= 0 && ni < nc && nj < nr && !hecho[nj][ni];
        });
        if (!libres.length) { pila.pop(); continue; }
        const d = libres[0], ni = i + DIR[d][0], nj = j + DIR[d][1];
        hecho[nj][ni] = true; tallar(ni, nj); unir(i, j, d); pila.push([ni, nj]);
      }
      // algunos atajos extra: quitan callejones y dan vueltas (si no, hay un solo camino a cada sitio)
      for (let n = 0; n < atajos; n++) {
        const i = Math.floor(Math.random() * nc), j = Math.floor(Math.random() * nr), d = Math.floor(Math.random() * 4);
        const ni = i + DIR[d][0], nj = j + DIR[d][1];
        if (ni >= 0 && nj >= 0 && ni < nc && nj < nr && !abierto[j][i][d]) unir(i, j, d);
      }
      const sinSalida = [];
      for (let j = 0; j < nr; j++) for (let i = 0; i < nc; i++) {
        if (abierto[j][i].filter(Boolean).length === 1 && !(i === ec && j === er)) sinSalida.push(pos(i, j));
      }
      return sinSalida;
    }

    // Nivel 1: una sala central con la puerta final y dos cuartitos, y a cada lado un laberinto distinto en cada partida.
    // Devuelve el mapa y los sitios donde puede haber una llave (callejones sin salida y cuartitos).
    function generarNivel1() {
      const W = 25, H = 12;
      const g = Array.from({ length: H }, () => Array(W).fill('#'));
      const cavar = (c0, r0, c1, r1) => { for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) g[r][c] = '.'; };
      cavar(9, 5, 15, 10);                                   // sala central
      g[8][12] = '@';
      cavar(11, 1, 13, 3); g[4][12] = 'D';                   // cámara de la salida, tras la puerta final
      g[3][9] = '.'; g[4][9] = 'P';                          // cuartito a la izquierda de la puerta final
      g[3][15] = '.'; g[4][15] = 'P';                        // y otro a la derecha
      g[9][8] = '.'; g[9][16] = '.';                         // pasos de la sala a cada laberinto
      const sitios = [];
      for (const p of tallarLaberinto(g, 1, 3, 4, 4, [3, 3], 2)) sitios.push({ c: p[0], r: p[1] });     // ala izquierda (entra por abajo a la derecha)
      for (const p of tallarLaberinto(g, 17, 3, 4, 4, [0, 3], 2)) sitios.push({ c: p[0], r: p[1] });    // ala derecha (entra por abajo a la izquierda)
      sitios.push({ c: 9, r: 3 }, { c: 15, r: 3 });          // dentro de los dos cuartitos
      // de relleno, por si hay pocos callejones: cualquier otra celda de los laberintos (menos la de entrada)
      const relleno = [];
      for (let j = 0; j < 4; j++) for (let i = 0; i < 4; i++) {
        for (const [c0, entrada] of [[1, [3, 3]], [17, [0, 3]]]) {
          const c = c0 + 2 * i, r = 3 + 2 * j;
          if (!(i === entrada[0] && j === entrada[1]) && !sitios.some((s) => s.c === c && s.r === r)) relleno.push({ c, r });
        }
      }
      return { mapa: g.map((f) => f.join('')), puntosLlave: sitios, puntosRelleno: relleno };
    }

    // Nivel 3: sala central con la puerta final (D), el panel (N) y el cuadro; tres salas con un número cada una
    // ('1' '2' '3' = qué posición del código es), y al otro lado de la puerta final, las dos puertas finales:
    // 'S' SALVACIÓN y 'X' ESPERANZA (cada una cierra un cuartito de una celda).
    function generarNivel3() {
      const W = 35, H = 17;
      const g = Array.from({ length: H }, () => Array(W).fill('#'));
      const cavar = (c0, r0, c1, r1) => { for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) g[r][c] = '.'; };
      cavar(12, 9, 22, 14);                                  // sala central
      g[13][17] = '@';
      g[8][17] = 'D';                                        // puerta final: se abre con el código
      cavar(14, 5, 20, 7);                                   // cámara de las dos puertas, detrás de ella
      // SALVACIÓN y ESPERANZA, cada una con un cuarto de 3 x 3 celdas (iguales: así uno no delata al otro)
      g[4][15] = 'S'; cavar(14, 1, 16, 3);
      g[4][19] = 'X'; cavar(18, 1, 20, 3);
      g[8][14] = 'N'; g[8][15] = 'N';                        // el panel del código (dos celdas de ancho), en la pared de la sala central
      // sala de la izquierda (pista 1), y desde ella, un pasillo hacia una sala más arriba (pista 3)
      cavar(2, 10, 10, 14); g[12][11] = '.'; g[12][5] = '1';
      cavar(6, 8, 6, 9); cavar(2, 3, 8, 7); g[5][4] = '3';
      // sala de la derecha (pista 2)
      cavar(24, 10, 32, 14); g[12][23] = '.'; g[12][29] = '2';
      // las tres salas de los números, en el orden de las pistas (1.ª, 2.ª, 3.ª): sirven para confinar a sus criaturas
      // (con el punto por donde se entra a cada una, para esconder el número lejos de ahí)
      const salas = [
        { c0: 2, r0: 10, c1: 10, r1: 14, entrada: { x: 11 * T, y: 12.5 * T } },
        { c0: 24, r0: 10, c1: 32, r1: 14, entrada: { x: 24 * T, y: 12.5 * T } },
        { c0: 2, r0: 3, c1: 8, r1: 7, entrada: { x: 6.5 * T, y: 8 * T } }
      ];
      return { mapa: g.map((f) => f.join('')), puntosLlave: [], salas };
    }

    const NIVELES = [
      {
        // Nivel 1: dos laberintos con llaves (una sola es la verdadera) y la puerta final en la sala del inicio.
        generar: generarNivel1,
        cuadros: [{ c: 10, r: 4, w: 2, progreso: 0.35 }],  // celda, ancho en celdas, cuánto está dibujado (0..1)
        // Lo que escribe el cerebro en el suelo: la frase llena toda la región (celdas c0..c1, r0..r1) con la letra más grande que quepa
        texto: {
          frase: 'Hay llaves reales y llaves falsas. Las falsas estallan. Encuentra la real.',
          region: { c0: 9, r0: 5, c1: 15, r1: 10 }         // la sala central
        },
        salida: { c: 12, r: 1, destino: 1 }                // portal al fondo de la cámara que cierra la puerta final
      },
      {
        // Nivel 2: cinco palancas ('L', en la fachada de un muro) que hay que tirar en orden, del cerebro más pequeño al más grande.
        // El tamaño de cada cerebro cambia de palanca en cada partida. Acertar las cinco abre la puerta final.
        mapa: [
          '########################',
          '###########...##########',
          '###########...##########',
          '###########...##########',
          '####L#######D###L###L###',
          '#......................#',
          '#......................#',
          '#......................#',
          '#......................#',
          '#.....L#.........#L....#',
          '#......................#',
          '#..@...................#',
          '#......................#',
          '########################'
        ],
        cuadros: [{ c: 8, r: 4, w: 2, progreso: 0.65 }],
        texto: {
          frase: 'Tira de las palancas del cerebro más pequeño al más grande. Si fallas, empiezas de nuevo.',
          region: { c0: 1, r0: 5, c1: 22, r1: 8 }
        },
        puzzle: 'palancas',
        salida: { c: 12, r: 1, destino: 2 }
      },
      {
        // Nivel 3: un número del código escrito en el suelo de cada una de tres salas; el panel está en la sala central.
        // Con el código correcto se abre la puerta final y aparecen las dos puertas: SALVACIÓN y ESPERANZA.
        generar: generarNivel3,
        cuadros: [{ c: 19, r: 8, w: 2, progreso: 1 }],       // el cerebro malvado, ya completo
        texto: {
          frase: 'Tres números están escondidos en el pasto. Camina para abrirlo. Cada número tiene el color de su casillero en el panel.',
          region: { c0: 12, r0: 9, c1: 22, r1: 14 }          // la sala central
        },
        puzzle: 'codigo'
      }
    ];

    // ===== Utilidades =====
    // Generador pseudoaleatorio con semilla (mulberry32)
    function crearRng(semilla) {
      let a = semilla >>> 0;
      return function () {
        a = (a + 0x6D2B79F5) >>> 0;
        let t = a;
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }
    // Generador propio de cada celda: el mismo muro se ve igual aunque se reconstruya
    function rngCelda(c, r, sal) {
      const g = crearRng(((CONFIG.semilla + sal) ^ Math.imul(c + 1, 73856093) ^ Math.imul(r + 1, 19349663)) >>> 0);
      g(); g();
      return g;
    }
    // Factor de suavizado independiente del framerate: igual a 60 que a 144 fps
    const suavizado = (rapidez, dt) => 1 - Math.exp(-rapidez * dt);
    const limitar = (v, a, b) => Math.min(b, Math.max(a, v));
    const suavizar = (a, b, x) => { const u = limitar((x - a) / (b - a), 0, 1); return u * u * (3 - 2 * u); };

    // ===== Sonido =====
    // Todo se genera con Web Audio (sin archivos). El contexto nace con el primer input del usuario.
    // Si algo falla o no hay Web Audio, todas las funciones quedan como no-op.
    const SND = (() => {
      const C = CONFIG.sonido;
      let ac = null, maestro, busFx, busAmb, revIn, bufRuido, amb = null;
      let silenciado = false, enPausa = false, nivelIdx = 0, ultExplosion = -9, timerTextura = 0;
      const btn = document.getElementById('mudo');
      const aleatorio = (a, b) => a + Math.random() * (b - a);
      const ICONO = {
        on: '<svg viewBox="0 0 24 22"><path d="M3 8h4l5-4v14l-5-4H3z"/><path d="M15.5 8Q18 11 15.5 14"/><path d="M18 5.5Q22.5 11 18 16.5"/></svg>',
        off: '<svg viewBox="0 0 24 22"><path d="M3 8h4l5-4v14l-5-4H3z"/><path d="M15.5 8.5l6 5M21.5 8.5l-6 5"/></svg>'
      };
      function pintarBoton() {
        btn.innerHTML = silenciado ? ICONO.off : ICONO.on;
        btn.setAttribute('aria-pressed', silenciado ? 'true' : 'false');
        btn.setAttribute('aria-label', silenciado ? 'Activar sonido' : 'Silenciar sonido');
      }

      // --- Piezas básicas ---
      // Manda un nodo al bus y, si rev > 0, una parte al eco
      function enviar(nodo, bus, rev) {
        nodo.connect(bus);
        if (rev) { const s = ac.createGain(); s.gain.value = rev; nodo.connect(s); s.connect(revIn); }
      }
      // Envolvente: sube a v en "at" segundos y se apaga exponencialmente hasta "dur"
      function envolvente(g, t0, v, at, dur) {
        at = Math.min(at, dur * 0.8);
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.linearRampToValueAtTime(v, t0 + at);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      }
      // Un tono: f (Hz) que puede deslizarse a f2; tipo, volumen v, duración, ataque, retraso d, lp = filtro pasa-bajos, rev = eco
      function tono(o) {
        const t0 = ac.currentTime + (o.d || 0);
        const osc = ac.createOscillator();
        osc.type = o.tipo || 'sine';
        osc.frequency.setValueAtTime(o.f, t0);
        if (o.f2) osc.frequency.exponentialRampToValueAtTime(o.f2, t0 + o.dur);
        const g = ac.createGain();
        envolvente(g, t0, o.v, o.at || 0.005, o.dur);
        osc.connect(g);
        let nodo = g;
        if (o.lp) { const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = o.lp; g.connect(f); nodo = f; }
        enviar(nodo, busFx, o.rev);
        osc.start(t0); osc.stop(t0 + o.dur + 0.05);
      }
      // Un golpe de ruido filtrado: tipo de filtro, f (Hz) que puede deslizarse a f2, q, volumen v, duración, ataque, retraso d
      function ruido(o) {
        const t0 = ac.currentTime + (o.d || 0);
        const src = ac.createBufferSource();
        src.buffer = bufRuido; src.loop = true;
        const f = ac.createBiquadFilter();
        f.type = o.tipo || 'lowpass'; f.Q.value = o.q || 0.7;
        f.frequency.setValueAtTime(o.f, t0);
        if (o.f2) f.frequency.exponentialRampToValueAtTime(o.f2, t0 + o.dur);
        const g = ac.createGain();
        envolvente(g, t0, o.v, o.at || 0.004, o.dur);
        src.connect(f); f.connect(g);
        enviar(g, busFx, o.rev);
        src.start(t0, Math.random() * 1.5); src.stop(t0 + o.dur + 0.05);
      }

      // Una voz ronca y distorsionada: sierras desafinadas con vibrato que pasan por formantes de "a" (la boca se abre: f1 sube
      // de forma[0] a forma[1] y f2 de forma[2] a forma[3]), gruñido y saturación.
      // f (Hz) se desliza a f2; v volumen, dur duración, d retraso, rev eco, vib (cents) y vibHz el temblor de la voz, gruñe: 0..1
      let curvaDist = null;
      function voz(o) {
        const t0 = ac.currentTime + (o.d || 0), t1 = t0 + o.dur;
        if (!curvaDist) {                                                      // saturación tipo tanh
          curvaDist = new Float32Array(1024);
          for (let i = 0; i < 1024; i++) curvaDist[i] = Math.tanh(((i / 1023) * 2 - 1) * 3.5);
        }
        const g = ac.createGain();
        envolvente(g, t0, o.v, o.at || 0.015, o.dur);
        const sat = ac.createWaveShaper(); sat.curve = curvaDist; sat.oversample = '2x';
        const pre = ac.createGain(); pre.gain.value = o.drive || 5;      // cuánto se satura la voz
        pre.connect(sat); sat.connect(g);
        const asp = ac.createGain(); asp.gain.value = 1 - (o.gruñe === undefined ? 0.45 : o.gruñe) * 0.5;   // gruñido: el volumen tiembla a ~40 Hz
        const lfo = ac.createOscillator(); lfo.frequency.value = 40;
        const lfoG = ac.createGain(); lfoG.gain.value = (o.gruñe === undefined ? 0.45 : o.gruñe) * 0.5;
        lfo.connect(lfoG); lfoG.connect(asp.gain); lfo.start(t0); lfo.stop(t1 + 0.05);
        const entrada = ac.createGain(); entrada.gain.value = 0.1;
        entrada.connect(asp);
        const forma = o.forma || [350, 800, 900, 1200];
        [[forma[0], forma[1], 4, 1], [forma[2], forma[3], 6, 0.6], [2600, 2600, 8, 0.2]].forEach(([a, b, q, v]) => {
          const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = q;
          bp.frequency.setValueAtTime(a, t0);
          bp.frequency.linearRampToValueAtTime(b, t0 + Math.min(0.12, o.dur * 0.6));
          const gf = ac.createGain(); gf.gain.value = v;
          asp.connect(bp); bp.connect(gf); gf.connect(pre);
        });
        const vib = ac.createOscillator(); vib.frequency.value = o.vibHz || 6;
        const vibG = ac.createGain(); vibG.gain.value = o.vib || 25;
        vib.connect(vibG); vib.start(t0); vib.stop(t1 + 0.05);
        for (const det of [-14, 0, 14]) {
          const osc = ac.createOscillator(); osc.type = 'sawtooth'; osc.detune.value = det;
          osc.frequency.setValueAtTime(o.f, t0);
          if (o.f2) osc.frequency.exponentialRampToValueAtTime(o.f2, t1);
          vibG.connect(osc.detune);
          osc.connect(entrada); osc.start(t0); osc.stop(t1 + 0.05);
        }
        enviar(g, busFx, o.rev);
      }

      // --- Ambiente: drone grave desafinado + viento + detalles sueltos ---
      function crearAmbiente() {
        const filtro = ac.createBiquadFilter();
        filtro.type = 'lowpass'; filtro.frequency.value = C.filtroBase; filtro.Q.value = 3;
        const trem = ac.createGain(); trem.gain.value = 0.8;
        const mezcla = ac.createGain(); mezcla.gain.value = 0;
        filtro.connect(trem); trem.connect(mezcla);
        enviar(mezcla, busAmb, 0.5);
        const lfo = (hz, prof, destino) => {
          const o = ac.createOscillator(); o.frequency.value = hz;
          const g = ac.createGain(); g.gain.value = prof;
          o.connect(g); g.connect(destino); o.start();
        };
        // drone: nota base, la misma casi desafinada (batido lento), un tritono, la octava y la sub-octava
        const voces = [[1, 'sawtooth', 0.3], [1.0045, 'sawtooth', 0.3], [1.4142, 'triangle', 0.1], [2, 'sine', 0.1], [0.5, 'sine', 0.3]].map(([r, tipo, vol]) => {
          const o = ac.createOscillator(); o.type = tipo; o.frequency.value = C.niveles[0].base * r;
          const g = ac.createGain(); g.gain.value = vol;
          o.connect(g); g.connect(filtro); o.start();
          return { o, r };
        });
        lfo(0.045, 90, filtro.frequency);                    // el filtro respira
        lfo(0.11, 0.2, trem.gain);                           // y el volumen también
        // viento: ruido en banda que se pasea
        const viento = ac.createBufferSource(); viento.buffer = bufRuido; viento.loop = true;
        const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 520; bp.Q.value = 2.5;
        const gv = ac.createGain(); gv.gain.value = 0.05;
        viento.connect(bp); bp.connect(gv); gv.connect(mezcla); viento.start();
        lfo(0.07, 260, bp.frequency);
        // tensión: tres senos disonantes que tiemblan (solo suenan al subir la tensión)
        const tens = ac.createGain(); tens.gain.value = 0;
        for (const f of [330, 335.5, 497]) {
          const o = ac.createOscillator(); o.frequency.value = f;
          o.connect(tens); o.start();
        }
        const tremT = ac.createGain(); tremT.gain.value = 0.5;
        lfo(4.5, 0.45, tremT.gain);
        tens.connect(tremT); tremT.connect(mezcla);
        amb = { filtro, mezcla, voces, tens };
        aplicarNivel();
        programarTextura();
      }
      // --- Coro de "ángeles" (al abrir ESPERANZA): voces sintéticas con formantes de "ah", vibrato y mucho eco ---
      let coro = null, ambPausado = false;
      function crearCoro() {
        callarCoro(0.1);
        const ahora = ac.currentTime;
        const salida = ac.createGain();
        salida.gain.setValueAtTime(0.0001, ahora);
        salida.gain.linearRampToValueAtTime(1, ahora + 2.5);          // entra despacio
        enviar(salida, busFx, 1);
        const entrada = ac.createGain(); entrada.gain.value = 0.06;
        for (const [f, q, v] of [[800, 5, 1], [1250, 7, 0.7], [2600, 8, 0.25]]) {   // formantes de una "ah"
          const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = f; bp.Q.value = q;
          const g = ac.createGain(); g.gain.value = v;
          entrada.connect(bp); bp.connect(g); g.connect(salida);
        }
        const vib = ac.createOscillator(); vib.frequency.value = 5.3;
        const vibG = ac.createGain(); vibG.gain.value = 14;           // vibrato en cents
        vib.connect(vibG); vib.start(ahora);
        const oscs = [vib];
        // acorde mayor luminoso (Re mayor con novena) y una voz grave; cada nota, dos voces apenas desafinadas
        for (const nota of [146.8, 293.7, 440, 587.3, 740, 880, 1109]) {
          for (const desafine of [-7, 7]) {
            const o = ac.createOscillator(); o.type = 'sawtooth'; o.frequency.value = nota; o.detune.value = desafine;
            vibG.connect(o.detune); o.connect(entrada); o.start(ahora); oscs.push(o);
          }
        }
        coro = { salida, oscs };
      }
      // Melodía de campanitas sobre el coro (pentatónica de Re mayor): notas sueltas con mucho eco, hasta que el coro se calle
      let timerMelodia = 0;
      function tocarMelodia(miCoro) {
        clearTimeout(timerMelodia);
        const nota = () => {
          if (!ac || coro !== miCoro) return;
          if (!silenciado && ac.state === 'running') {
            const f = [587.3, 659.3, 740, 880, 987.8, 1174.7][Math.floor(Math.random() * 6)];
            tono({ f, dur: 2.6, v: 0.07, rev: 1 });
            tono({ f: f * 2, dur: 1.4, v: 0.02, rev: 1 });
          }
          timerMelodia = setTimeout(nota, aleatorio(550, 1400));
        };
        timerMelodia = setTimeout(nota, 2500);                          // espera a que el coro entre
      }
      function callarCoro(seg) {
        if (!coro) return;
        const ahora = ac.currentTime;
        coro.salida.gain.cancelScheduledValues(ahora);
        coro.salida.gain.setTargetAtTime(0, ahora, Math.max(0.05, seg / 3));
        for (const o of coro.oscs) o.stop(ahora + seg + 0.6);
        coro = null;
      }
      function fadeAmb(v, seg) {
        if (amb) amb.mezcla.gain.setTargetAtTime(v, ac.currentTime, Math.max(0.05, seg / 3));
      }
      function tension(v, seg) {
        if (!amb) return;
        const ahora = ac.currentTime, tc = Math.max(0.05, seg / 3);
        amb.tens.gain.setTargetAtTime(v * 0.06, ahora, tc);
        amb.filtro.frequency.setTargetAtTime(C.filtroBase + v * C.filtroTension, ahora, tc);
      }
      const cfgNivel = () => C.niveles[Math.min(nivelIdx, C.niveles.length - 1)];
      function aplicarNivel() {
        if (!amb) return;
        const cfg = cfgNivel(), ahora = ac.currentTime;
        for (const v of amb.voces) v.o.frequency.setTargetAtTime(cfg.base * v.r, ahora, 1.2);
        tension(cfg.tension, 2);
        fadeAmb(1, 2);
      }
      // Detalles sueltos cada tanto: una gota, un susurro o un retumbo lejano
      function programarTextura() {
        clearTimeout(timerTextura);
        timerTextura = setTimeout(() => {
          if (ac && ac.state === 'running' && !silenciado && !ambPausado) textura();
          programarTextura();
        }, aleatorio(C.texturas[0], C.texturas[1]) * 1000);
      }
      function textura() {
        const q = Math.random();
        if (q < 0.4) { const f = aleatorio(900, 1800); tono({ f, f2: f * 0.6, dur: 0.35, v: 0.05, rev: 1, at: 0.01 }); }
        else if (q < 0.75) ruido({ tipo: 'bandpass', f: aleatorio(1200, 2600), q: 9, dur: 1.4, v: 0.05, at: 0.6, rev: 1 });
        else { const f = aleatorio(38, 52); tono({ f, f2: f * 0.8, dur: 1.6, v: 0.18, at: 0.5 }); }
      }

      // --- Arranque ---
      function iniciar() {
        if (ac) { if (ac.state === 'suspended' && !document.hidden && !enPausa) ac.resume().catch(() => {}); return; }
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        try { ac = new AC(); } catch (e) { ac = null; return; }
        maestro = ac.createGain(); maestro.gain.value = silenciado ? 0 : C.volumen;
        const comp = ac.createDynamicsCompressor();          // evita que varios efectos juntos saturen
        maestro.connect(comp); comp.connect(ac.destination);
        busFx = ac.createGain(); busFx.gain.value = C.efectos; busFx.connect(maestro);
        busAmb = ac.createGain(); busAmb.gain.value = C.ambiente; busAmb.connect(maestro);
        // ruido blanco de 2 s (sirve para viento, golpes y roces)
        bufRuido = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
        const d = bufRuido.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
        // eco: una cola de ruido que se apaga
        const largo = Math.floor(ac.sampleRate * 2.4);
        const ir = ac.createBuffer(2, largo, ac.sampleRate);
        for (let c = 0; c < 2; c++) {
          const x = ir.getChannelData(c);
          for (let i = 0; i < largo; i++) x[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / largo, 2.6);
        }
        const conv = ac.createConvolver(); conv.buffer = ir;
        revIn = ac.createGain();
        const revOut = ac.createGain(); revOut.gain.value = C.reverb;
        revIn.connect(conv); conv.connect(revOut); revOut.connect(maestro);
        crearAmbiente();
        if (document.hidden) ac.suspend();
      }
      function alternar() {
        silenciado = !silenciado;
        pintarBoton();
        if (ac) maestro.gain.setTargetAtTime(silenciado ? 0 : C.volumen, ac.currentTime, 0.03);
      }
      // Solo suenan los efectos si el contexto existe
      const efecto = (fn) => (...a) => { if (ac) fn(...a); };

      // --- Efectos ---
      const api = {
        iniciar, alternar, fadeAmb: efecto(fadeAmb), tension: efecto(tension),
        // pausa del juego: congela todo el audio (y lo retoma al reanudar)
        pausa(on) {
          enPausa = on;
          if (!ac) return;
          if (on) ac.suspend(); else if (!document.hidden) ac.resume().catch(() => {});
        },
        // Cambia el drone al del nivel y devuelve el ambiente a su volumen
        nivel(idx) { nivelIdx = idx; ambPausado = false; if (ac) callarCoro(0.5); aplicarNivel(); },
        // se abre ESPERANZA: los drones se apagan y suena un coro de voces celestiales (la trampa lo corta)
        angeles: efecto(() => { ambPausado = true; fadeAmb(0, 1.2); crearCoro(); }),
        // empieza el juego desde la pantalla de inicio: un golpe grave y un soplido que sube
        empezar: efecto(() => {
          tono({ f: 60, f2: 32, dur: 2.2, v: 0.45, tipo: 'sawtooth', lp: 220, at: 0.4, rev: 0.5 });
          tono({ f: 55, f2: 40, dur: 0.5, v: 0.5 });
          ruido({ tipo: 'bandpass', f: 150, f2: 2500, q: 1.5, dur: 1.2, v: 0.2, at: 0.7, rev: 0.6 });
        }),
        // la piscina se arma: un barrido brillante que sube y campanitas ascendentes, una por cada tanda de filas
        piscina: efecto(() => {
          ruido({ tipo: 'bandpass', f: 500, f2: 4500, q: 2, dur: 2.4, v: 0.09, at: 1.2, rev: 0.8 });
          [440, 523.3, 587.3, 659.3, 784, 880, 1046.5, 1174.7, 1318.5, 1568].forEach((f, i) => tono({ f, dur: 1.4, v: 0.07, d: i * 0.18, rev: 1 }));
        }),
        // el personaje se desintegra: ráfaga de campanitas agudas que suben y un soplido que se va
        disolver: efecto(() => {
          for (let i = 0; i < 16; i++) {
            const f = [1174.7, 1318.5, 1568, 1760, 2093, 2349][Math.floor(Math.random() * 6)];
            tono({ f, f2: f * 1.5, dur: 1.2, v: 0.05, d: Math.random() * 1.4, rev: 1 });
          }
          ruido({ tipo: 'bandpass', f: 400, f2: 6000, q: 1.5, dur: 2, v: 0.12, at: 0.8, rev: 0.7 });
        }),
        // se abre SALVACIÓN (d = segundos hasta que empieza): los drones se apagan y suena música angelical (coro y campanitas)
        salvacion: efecto((d) => {
          setTimeout(() => {
            if (!ac) return;
            ambPausado = true; fadeAmb(0, 1.5); crearCoro(); tocarMelodia(coro);
          }, d * 1000);
        }),
        calmar: efecto(() => tension(cfgNivel().tension, 2)),

        // un paso: golpe sordo, apagado
        paso: efecto((amp) => {
          const v = 0.5 + 0.5 * Math.min(1, amp), f = 1 + (Math.random() - 0.5) * 0.25;
          ruido({ tipo: 'lowpass', f: 420 * f, f2: 160, dur: 0.09, v: 0.22 * v, q: 0.8 });
          tono({ f: 95 * f, f2: 48, dur: 0.1, v: 0.2 * v });
        }),
        // la llave verdadera: campanitas con eco
        llave: efecto(() => {
          [880, 1318.5, 1760].forEach((f, i) => tono({ f, dur: 1.1 - i * 0.2, v: 0.14, rev: 0.7, d: i * 0.07 }));
          tono({ f: 2637, dur: 0.5, v: 0.05, rev: 0.9, d: 0.2 });
        }),
        // llave falsa o error: estallido (si hay varios seguidos, suena uno)
        explosion: efecto((fuerte) => {
          if (!fuerte && ac.currentTime - ultExplosion < 0.09) return;
          ultExplosion = ac.currentTime;
          ruido({ tipo: 'lowpass', f: 3000, f2: 90, dur: 0.7, v: 0.55, q: 0.9, rev: 0.3 });
          tono({ f: 150, f2: 36, dur: 0.55, v: 0.5 });
          ruido({ tipo: 'highpass', f: 2500, dur: 0.12, v: 0.18 });
        }),
        // tirar una palanca: golpe metálico
        palanca: efecto(() => {
          tono({ f: 180, f2: 60, dur: 0.16, v: 0.35, tipo: 'triangle' });
          ruido({ tipo: 'bandpass', f: 1800, q: 2, dur: 0.05, v: 0.25 });
          tono({ f: 70, f2: 40, dur: 0.3, v: 0.3, d: 0.05 });
        }),
        // palanca correcta: una nota que sube en la escala menor cada vez (n = cuántas van bien)
        palancaOk: efecto((n) => {
          const semi = [0, 3, 5, 7, 10, 12][Math.min(n - 1, 5)], f = 220 * Math.pow(2, semi / 12);
          tono({ f, dur: 0.9, v: 0.16, rev: 0.8 });
          tono({ f: f * 2, dur: 0.5, v: 0.05, tipo: 'triangle', rev: 0.8 });
        }),
        // zumbido de error (palanca equivocada, código incorrecto)
        // (dos "bzzt" descendentes, como un buzzer de respuesta incorrecta; sin golpe de explosión debajo para que se oiga claro)
        error: efecto(() => {
          for (let i = 0; i < 2; i++) {
            const d = i * 0.2;
            tono({ f: 130, f2: 98, dur: 0.18, v: 0.34, tipo: 'sawtooth', lp: 650, at: 0.01, d });
            tono({ f: 134, f2: 101, dur: 0.18, v: 0.28, tipo: 'square', lp: 650, at: 0.01, d });
          }
          tono({ f: 65, f2: 49, dur: 0.45, v: 0.22, tipo: 'sawtooth', lp: 400 });
        }),
        // una puerta de piedra que se deshace (d = segundos hasta que empieza)
        puertaAbre: efecto((d) => {
          const dur = CONFIG.puertaAbrir + 0.3;
          ruido({ tipo: 'bandpass', f: 260, f2: 120, q: 1.2, dur, v: 0.35, at: 0.25, d });
          tono({ f: 42, f2: 34, dur, v: 0.35, at: 0.3, d });
          for (let i = 0; i < 9; i++) ruido({ tipo: 'bandpass', f: aleatorio(700, 2200), q: 3, dur: 0.06, v: aleatorio(0.12, 0.22), d: d + 0.1 + Math.random() * (dur - 0.2) });
        }),
        // puerta que no cede: se la fuerza. Un chirrido de madera que se tensa, sacudidas con traqueteo del cerrojo y un golpe seco al trabarse
        puertaCerrada: efecto(() => {
          tono({ f: 150, f2: 92, dur: 0.42, v: 0.14, tipo: 'sawtooth', lp: 520, at: 0.06 });     // la madera cruje
          tono({ f: 158, f2: 98, dur: 0.42, v: 0.1, tipo: 'sawtooth', lp: 520, at: 0.06 });
          for (let i = 0; i < 5; i++) {                                                          // cada tirón: golpecito sordo y chasquido metálico
            const d = i * 0.075, fuerza = 1 - i * 0.14;
            tono({ f: 95 + Math.random() * 20, f2: 55, dur: 0.07, v: 0.22 * fuerza, d });
            ruido({ tipo: 'bandpass', f: aleatorio(900, 1600), q: 4, dur: 0.05, v: 0.2 * fuerza, d });
          }
          tono({ f: 64, f2: 38, dur: 0.18, v: 0.32, d: 0.4 });                                  // sigue trabada
        }),
        clic: efecto(() => tono({ f: 900, f2: 600, dur: 0.04, v: 0.1, tipo: 'square', lp: 2500 })),
        // tecla del panel: el tono sube con el dígito
        tecla: efecto((dig) => tono({ f: 300 + dig * 38, dur: 0.09, v: 0.16, tipo: 'triangle', rev: 0.2 })),
        // código correcto o último paso de un puzzle: arpegio menor con eco
        panelOk: efecto(() => {
          [220, 261.6, 329.6, 440].forEach((f, i) => tono({ f, dur: 1.2, v: 0.13, rev: 0.8, d: i * 0.11 }));
        }),
        // el cerebro del cuadro escribe en el suelo: zumbido que crece y crepitar de cerebritos
        cuadro: efecto(() => {
          const dur = CONFIG.texto.escribir + 0.8;
          tono({ f: 68, f2: 92, dur, v: 0.28, tipo: 'sawtooth', lp: 260, at: 1.2 });
          tono({ f: 71, f2: 96, dur, v: 0.2, tipo: 'sawtooth', lp: 260, at: 1.2 });
          for (let i = 0; i < 70; i++) ruido({ tipo: 'bandpass', f: aleatorio(1500, 4000), q: 5, dur: 0.03, v: aleatorio(0.06, 0.14), d: (i / 70) * CONFIG.texto.escribir });
        }),
        // el portal al siguiente nivel: soplido que sube
        portal: efecto(() => {
          ruido({ tipo: 'bandpass', f: 200, f2: 3500, q: 1.5, dur: 0.9, v: 0.4, at: 0.5 });
          tono({ f: 90, f2: 360, dur: 0.9, v: 0.2, at: 0.6, rev: 0.5 });
          fadeAmb(0.2, 0.6);
        }),
        // ESPERANZA: el cerebro malvado aparece
        monstruo: efecto(() => {
          ambPausado = false; callarCoro(0.25); fadeAmb(1, 0.4);        // el coro se corta de golpe y vuelven los drones
          tono({ f: 46, f2: 30, dur: 2.2, v: 0.5, tipo: 'sawtooth', lp: 200, at: 0.8 });
          tono({ f: 61, f2: 40, dur: 2.2, v: 0.3, tipo: 'square', lp: 180, at: 0.9 });
          ruido({ tipo: 'lowpass', f: 500, f2: 120, q: 1, dur: 1.8, v: 0.3, at: 0.6 });
          tension(1, 1.2);
        }),
        // un latido de la cuenta 3-2-1 (n = 0, 1, 2): cada vez más fuerte y agudo
        cuenta: efecto((n) => {
          tono({ f: 70, f2: 40, dur: 0.18, v: 0.5 + n * 0.1 });
          tono({ f: 60, f2: 34, dur: 0.2, v: 0.4, d: 0.17 });
          tono({ f: 220 * (1 + n * 0.25), dur: 0.15, v: 0.08, tipo: 'triangle', rev: 0.3 });
        }),
        // aparecen las flechas: aviso seco
        alerta: efecto(() => {
          tono({ f: 880, dur: 0.35, v: 0.18, tipo: 'square', lp: 2000 });
          tono({ f: 1175, dur: 0.3, v: 0.14, tipo: 'square', lp: 2000, d: 0.12 });
        }),
        // flecha acertada (n = cuántas van): sube un tono cada vez
        flecha: efecto((n) => tono({ f: 440 * Math.pow(2, (n * 2) / 12), dur: 0.12, v: 0.14, tipo: 'triangle' })),
        // el cerebro se come al personaje
        devorar: efecto(() => {
          fadeAmb(0, 0.3);
          tono({ f: 120, f2: 28, dur: 1.2, v: 0.6, tipo: 'sawtooth', lp: 600 });
          ruido({ tipo: 'lowpass', f: 2500, f2: 100, dur: 1.4, v: 0.55 });
          for (let i = 0; i < 6; i++) ruido({ tipo: 'highpass', f: 1800, dur: 0.07, v: 0.2, d: i * 0.09 });
          tono({ f: 50, f2: 25, dur: 2.5, v: 0.5, d: 0.2, rev: 0.6 });
          api.risa(0.9);                                                // y después, la risa
        }),
        // risa demoníaca lenta y grave: "ha.. ha.. ha.. haaa". Entra suave (sin golpe) y cada "ha" se hunde.
        // Tres capas: voz grave, voz principal y un segundo demonio un poco detrás. d = segundos hasta que empieza.
        risa: efecto((d) => {
          const ritmo = [0, 0.6, 1.2, 1.8];
          ritmo.forEach((t, i) => {
            const ultimo = i === ritmo.length - 1, dur = ultimo ? 1.1 : 0.45, tt = d + t, vol = 1 - i * 0.05;
            const f = 90 - i * 5, caida = ultimo ? 0.6 : 0.8;                         // cada "ha" arranca un poco más alto y cae; la risa baja
            ruido({ tipo: 'bandpass', f: 900, q: 1, dur: 0.12, v: 0.07, at: 0.05, d: tt });   // soplido suave de la "h"
            voz({ f: f * 0.5 * 1.15, f2: f * 0.5 * caida, dur, v: 0.2 * vol, d: tt, rev: 0.5, at: 0.07, drive: 3 });                 // grave
            voz({ f: f * 1.15, f2: f * caida, dur, v: 0.2 * vol, d: tt, rev: 0.5, at: 0.07, drive: 3, vib: ultimo ? 50 : 20, vibHz: 5 });   // principal
            voz({ f: f * 1.5, f2: f * 1.5 * caida, dur, v: 0.08 * vol, d: tt + 0.05, rev: 0.7, at: 0.09, drive: 3, forma: [380, 800, 900, 1300] });   // otro demonio
          });
        }),
        // lo lograste: estalla el cerebro y suena un acorde aliviado
        estallido: efecto(() => {
          api.explosion(true);
          [392, 523.3, 659.3].forEach((f, i) => tono({ f, dur: 1.6, v: 0.12, rev: 0.9, d: 0.3 + i * 0.1 }));
        }),
        // final bueno: el ambiente se apaga y sube un acorde mayor largo
        victoria: efecto(() => {
          ambPausado = true; fadeAmb(0, 1.5);                           // los drones no vuelven: sigue el coro con las campanitas de la puerta
          [220, 277.2, 329.6, 440, 554.4].forEach((f, i) => tono({ f, dur: 6, v: 0.09, at: 1.5, d: i * 0.25, rev: 0.9 }));
          tono({ f: 1318.5, dur: 3, v: 0.05, at: 0.1, d: 2, rev: 1 });
        })
      };

      // El audio solo puede empezar tras un gesto del usuario: cualquier tecla o toque lo despierta, salvo en la pantalla de inicio,
      // donde solo lo arranca "EMPEZAR" (empezarJuego llama a SND.iniciar)
      for (const ev of ['keydown', 'pointerdown', 'touchend']) window.addEventListener(ev, () => { if (!portada) iniciar(); }, true);
      // Con la pestaña (o el iframe) oculta, se pausa
      document.addEventListener('visibilitychange', () => {
        if (!ac) return;
        if (document.hidden) ac.suspend(); else if (!enPausa) ac.resume().catch(() => {});
      });
      btn.addEventListener('click', () => { alternar(); canvas.focus({ preventScroll: true }); });
      pintarBoton();
      return api;
    })();

    // ===== El cerebrito mini =====
    // Path2D en coordenadas unitarias: ancho 1, centrado en (0,0).
    // Contorno ovalado con bultos, muesca arriba, línea central y una curvita interna por lado.
    function crearPathCerebrito(v) {
      const rng = crearRng(CONFIG.semilla + v * 101);
      const j = (a) => (rng() - 0.5) * 2 * a;   // aleatorio en ±a
      const RX = 0.5, RY = 0.4;
      const p = new Path2D();

      // punto sobre la elipse (ángulo en grados, 0 = derecha, -90 = arriba) con factor de radio
      const sobreElipse = (grados, f) => {
        const a = grados * Math.PI / 180;
        return [RX * f * Math.cos(a), RY * f * Math.sin(a)];
      };

      // Punto del borde: signo = +1 derecha / -1 izquierda; i = posición (0 = muesca, bultos = fondo)
      const bultos = CONFIG.bultos;
      const puntoBorde = (signo, i, f) => {
        const [x, y] = sobreElipse(-90 + (180 * i) / bultos, f);
        return [signo * x, y];
      };
      // La muesca se hunde y se comparte entre los dos lados para que el trazo cierre limpio
      const muesca = puntoBorde(1, 0, 0.72 + j(0.03));
      // Por cada lado: puntos finales de cada tramo y su punto de control (empuja el bulto hacia afuera)
      const lados = [1, -1].map((signo) => {
        const fin = [], ctl = [];
        for (let i = 0; i < bultos; i++) {
          ctl.push(puntoBorde(signo, i + 0.5, 1.2 + j(0.05)));
          fin.push(puntoBorde(signo, i + 1, i + 1 < bultos ? 1 + j(0.04) : 1));
        }
        return { fin, ctl };
      });

      // derecha: de la muesca hacia abajo
      p.moveTo(muesca[0], muesca[1]);
      for (let i = 0; i < bultos; i++) {
        p.quadraticCurveTo(lados[0].ctl[i][0], lados[0].ctl[i][1], lados[0].fin[i][0], lados[0].fin[i][1]);
      }
      // izquierda: del fondo de vuelta a la muesca (tramos al revés)
      for (let i = bultos - 1; i >= 0; i--) {
        const destino = i > 0 ? lados[1].fin[i - 1] : muesca;
        p.quadraticCurveTo(lados[1].ctl[i][0], lados[1].ctl[i][1], destino[0], destino[1]);
      }

      // línea central: de la muesca al fondo
      p.moveTo(muesca[0], muesca[1]);
      p.lineTo(j(0.03), RY * 0.95);

      // curvitas internas (una por lado, espejadas con algo de variación)
      for (const lado of [1, -1]) {
        p.moveTo(lado * (0.05 + j(0.01)), -0.12 + j(0.03));
        p.quadraticCurveTo(lado * (0.26 + j(0.04)), -0.26 + j(0.03), lado * (0.31 + j(0.03)), -0.02 + j(0.03));
        p.moveTo(lado * (0.06 + j(0.01)), 0.14 + j(0.03));
        p.quadraticCurveTo(lado * (0.22 + j(0.04)), 0.08 + j(0.03), lado * (0.32 + j(0.03)), 0.22 + j(0.03));
      }
      return p;
    }

    // Pre-renderiza cada variación una sola vez. k = píxeles reales por píxel lógico.
    function crearSprites(tam, k, grosorMin, color) {
      const lado = tam + 2;                                   // 1 px lógico de margen por lado
      const grosor = Math.max(grosorMin, tam * CONFIG.grosorRel);
      const sprites = [];
      for (let v = 0; v < CONFIG.variaciones; v++) {
        const cv = document.createElement('canvas');
        cv.width = Math.ceil(lado * k);
        cv.height = Math.ceil(lado * k);
        const g = cv.getContext('2d');
        g.setTransform(k * tam, 0, 0, k * tam, cv.width / 2, cv.height / 2);
        g.lineWidth = Math.max(grosor * k, CONFIG.grosorMinPantalla) / (k * tam);
        g.lineJoin = 'round';
        g.lineCap = 'round';
        g.strokeStyle = color || CONFIG.colorTrazo;
        g.stroke(crearPathCerebrito(v));
        // tamaño del sprite en px lógicos (para estamparlo centrado)
        sprites.push({ canvas: cv, w: cv.width / k, h: cv.height / k });
      }
      return sprites;
    }

    // Juego de sprites del escenario a una escala dada (solo los pedidos)
    function crearJuegoEscenario(k, nombres) {
      const juego = {};
      for (const n of nombres) {
        const def = CONFIG.escenario[n];
        const c = def.color;
        const color = c === 'mal' ? CONFIG.colorMal : c === 'oro' ? CONFIG.colorOro : c === 'pasto' ? CONFIG.colorPasto :
          (c && /^slot[0-2]$/.test(c)) ? CONFIG.coloresSlot[Number(c[4])] : c;
        juego[n] = crearSprites(def.tam, k, def.grosorMin, color);
      }
      return juego;
    }

    // ===== Esqueleto =====
    // Puntos del esqueleto (invisibles). Cada par es [izquierda, derecha] = índice, índice + 1.
    const HUESO = {
      cabeza: 0, cuello: 1, hombroI: 2, hombroD: 3, codoI: 4, codoD: 5,
      manoI: 6, manoD: 7, cadera: 8, caderaI: 9, caderaD: 10,
      rodillaI: 11, rodillaD: 12, pieI: 13, pieD: 14
    };
    const N_PUNTOS = 15;

    // Pose en reposo, en alturas del personaje: [x, y] con (0,0) = suelo entre los pies, y negativo = arriba
    const REPOSO = [
      [0, -0.925],                      // cabeza
      [0, -0.84],                       // cuello
      [-0.15, -0.79], [0.15, -0.79],    // hombros (algo caídos respecto al cuello)
      [-0.20, -0.62], [0.20, -0.62],    // codos
      [-0.215, -0.47], [0.215, -0.47],  // manos
      [0, -0.50],                       // cadera (centro)
      [-0.07, -0.50], [0.07, -0.50],    // articulación de cada cadera
      [-0.08, -0.26], [0.08, -0.26],    // rodillas
      [-0.08, 0], [0.08, 0]             // pies
    ];

    // Cuánto acompaña cada punto a la inclinación del cuerpo (0 = nada, 1 = todo)
    const PESO_INCLINACION = [1, 0.85, 0.7, 0.7, 0.6, 0.6, 0.6, 0.6, 0.25, 0.25, 0.25, 0, 0, 0, 0];

    // De perfil los dos lados del cuerpo se solapan: cada miembro se escalona adelante/atrás esta distancia
    // (en alturas del personaje; el signo lo da el lado) para que no se fundan en uno solo
    const ESCALON = [0, 0, 0.05, 0.05, 0.07, 0.07, 0.07, 0.07, 0, 0.03, 0.03, 0.03, 0.03, 0.03, 0.03];

    // ===== Enjambre =====
    // Cada cerebrito tiene un objetivo sobre el esqueleto:
    //  tipo 0: sobre un hueso (a → b), a distancia t, desplazado de lado (w = medio ancho, en alturas)
    //  tipo 1: en un anillo alrededor de un punto (cabeza)
    //  tipo 2: racimo: desplazado (ox, oy) de un punto (manos)
    //  tipo 3: rasgo en 3D: desplazado (lx lateral, ly altura, lz profundidad hacia adelante) de un punto;
    //          según hacia dónde mira el cuerpo se proyecta en pantalla (cara, pecho, nariz, pies...)
    // vis = cuándo se ve: siempre | frente | espalda | ojos | perfil | ancho
    function crearEnjambre() {
      const rng = crearRng(CONFIG.semilla + 7);
      const lista = [];

      // Medio ancho del miembro en t (0..1), interpolando suave entre los puntos del perfil [t, ancho]
      const anchoPerfil = (perfil, t) => {
        for (let i = 1; i < perfil.length; i++) {
          if (t <= perfil[i][0]) {
            const [t0, w0] = perfil[i - 1], [t1, w1] = perfil[i];
            const u = (t - t0) / (t1 - t0);
            return w0 + (w1 - w0) * u * u * (3 - 2 * u);
          }
        }
        return perfil[perfil.length - 1][1];
      };

      // dos carriles a los lados de un hueso: el contorno de un miembro con su forma (perfil)
      // (esc = true: el ancho se angosta cuando el cuerpo está de perfil, como el torso)
      const carriles = (a, b, n, perfil, esc = false) => {
        for (const signo of [-1, 1]) {
          for (let i = 0; i < n; i++) {
            const t = (i + 0.5) / n;
            lista.push({ tipo: 0, a, b, t, w: anchoPerfil(perfil, t), signo, esc, vis: 'siempre', set: 'pers' });
          }
        }
      };
      // una sola línea sobre un hueso
      const linea = (a, b, n, vis = 'siempre') => {
        for (let i = 0; i < n; i++) lista.push({ tipo: 0, a, b, t: (i + 0.5) / n, w: 0, signo: 0, esc: false, vis, set: 'pers' });
      };
      // anillo alrededor de un punto
      const anillo = (centro, n, radio) => {
        for (let i = 0; i < n; i++) lista.push({ tipo: 1, a: centro, ang: (i / n) * Math.PI * 2, radio, vis: 'siempre', set: 'pers' });
      };
      // racimo de cerebritos con desplazamientos fijos respecto a un punto
      const racimo = (punto, offsets) => {
        for (const [ox, oy] of offsets) lista.push({ tipo: 2, a: punto, ox, oy, vis: 'siempre', set: 'pers' });
      };
      // rasgo en 3D sobre un punto del esqueleto; set 'rasgo' = cerebrito más chico para detalles
      const rasgo = (punto, lx, ly, lz, vis, set = 'rasgo') => {
        lista.push({ tipo: 3, a: punto, lx, ly, lz, vis, set });
      };

      // Perfiles [t, medio ancho]: pecho, cintura y cadera; músculo en muslo, pantorrilla y brazo
      const PERFIL = {
        torso: [[0, 0.035], [0.14, 0.095], [0.32, 0.105], [0.65, 0.078], [1, 0.092]],
        brazoSup: [[0, 0.026], [0.5, 0.028], [1, 0.021]],
        antebrazo: [[0, 0.021], [0.35, 0.024], [1, 0.014]],
        muslo: [[0, 0.036], [0.45, 0.038], [1, 0.027]],
        pantorrilla: [[0, 0.027], [0.3, 0.032], [0.8, 0.02], [1, 0.016]]
      };

      const H = HUESO;
      anillo(H.cabeza, 14, 0.074);
      carriles(H.cuello, H.cadera, 8, PERFIL.torso, true);  // torso (se angosta de perfil)
      linea(H.cuello, H.hombroI, 3, 'ancho');               // hombros (de perfil se esconden)
      linea(H.cuello, H.hombroD, 3, 'ancho');
      for (const lado of ['I', 'D']) {                      // brazos
        carriles(H['hombro' + lado], H['codo' + lado], 3, PERFIL.brazoSup);
        carriles(H['codo' + lado], H['mano' + lado], 3, PERFIL.antebrazo);
        racimo(H['mano' + lado], [[0, 0.022], [0, 0.042]]);
      }
      linea(H.caderaI, H.caderaD, 3, 'ancho');              // cintura (desaparece de perfil)
      for (const lado of ['I', 'D']) {                      // piernas
        carriles(H['cadera' + lado], H['rodilla' + lado], 4, PERFIL.muslo);
        carriles(H['rodilla' + lado], H['pie' + lado], 5, PERFIL.pantorrilla);
        // pie: dos cerebritos de talón y uno de punta que apunta hacia donde mira el cuerpo
        rasgo(H['pie' + lado], -0.02, 0, 0, 'siempre', 'pers');
        rasgo(H['pie' + lado], 0.02, 0, 0, 'siempre', 'pers');
        rasgo(H['pie' + lado], 0, 0, 0.026, 'siempre', 'pers');
      }

      // --- Rasgos que dicen hacia dónde mira ---
      // De frente: cara (ojos grandes y boca), pecho y ombligo
      rasgo(H.cabeza, -0.03, -0.01, 0.05, 'ojos', 'pers');  // ojos (también se ven de 3/4 y de perfil)
      rasgo(H.cabeza, 0.03, -0.01, 0.05, 'ojos', 'pers');
      rasgo(H.cabeza, 0, 0.042, 0.05, 'frente');            // boca
      rasgo(H.cuello, -0.05, 0.13, 0.06, 'frente');         // pecho
      rasgo(H.cuello, 0.05, 0.13, 0.06, 'frente');
      rasgo(H.cadera, 0, -0.07, 0.06, 'frente');            // ombligo
      // De perfil: la nariz sobresale hacia donde mira
      rasgo(H.cabeza, 0, 0.015, 0.078, 'perfil');           // al ras del anillo de la cabeza: no sobresale
      // De espaldas: la nuca queda llena (cuero cabelludo), con columna y omóplatos marcados
      for (const [lx, ly] of [[-0.035, -0.045], [0, -0.05], [0.035, -0.045], [-0.05, -0.005], [-0.017, -0.01],
        [0.017, -0.01], [0.05, -0.005], [0, 0.03]]) rasgo(H.cabeza, lx, ly, -0.05, 'espalda');
      for (const ly of [0.1, 0.19, 0.28, 0.37]) rasgo(H.cuello, 0, ly, -0.06, 'espalda', 'pers');   // columna
      rasgo(H.cuello, -0.055, 0.14, -0.06, 'espalda', 'pers');                                       // omóplatos
      rasgo(H.cuello, 0.055, 0.14, -0.06, 'espalda', 'pers');

      // Rasgos propios de cada cerebrito (fijos por semilla: no parpadean)
      for (const c of lista) {
        c.variante = Math.floor(rng() * CONFIG.variaciones);
        c.rot0 = (rng() * 2 - 1) * CONFIG.rotacionMax;
        c.k = CONFIG.seguirMin + rng() * (CONFIG.seguirMax - CONFIG.seguirMin);
        c.f1 = 0.7 + rng() * 0.6;  c.p1 = rng() * 6.283;     // vibración en x
        c.f2 = 0.7 + rng() * 0.6;  c.p2 = rng() * 6.283;     // vibración en y
        c.f3 = 0.7 + rng() * 0.6;  c.p3 = rng() * 6.283;     // vaivén de rotación
        c.x = 0; c.y = 0;          // posición actual
        c.tx = 0; c.ty = 0;        // objetivo del cuadro anterior (para estimar su velocidad)
      }
      return lista;
    }

    // ===== El encapuchado (CONFIG.personaje = 'encapuchado') =====
    // No usa el esqueleto: capaGenerar() calcula cada cuadro dónde va cada cerebrito a partir de la caminata
    // (personaje.amp, fase, giro, dirX/dirY) y del rastro de dónde estuvo (la tela se queda atrás).
    // Siempre pone la misma cantidad de cerebritos; cada uno persigue su sitio con el mismo enjambre de siempre.
    // Tamaño + tono -> juego de sprites (el normal de 6 px es 'pers', el de 3.6 px normal es 'rasgo')
    const CAPA_SETS = { m0: 'pers', xs0: 'rasgo', xs1: 'capaXsTenue', xs2: 'capaXsBrillo', s0: 'capaS', s1: 'capaS', s2: 'capaSBrillo', m1: 'pers', xl2: 'capaFarol' };
    // Medio ancho de la túnica según la altura u (0 = punta de la capucha, 1 = borde): capucha redonda, cuello, hombros, falda
    const PERFIL_CAPA = capaPerfil([
      [0, 0], [0.05, 0.09], [0.14, 0.15], [0.24, 0.145], [0.31, 0.085], [0.38, 0.13],
      [0.50, 0.125], [0.65, 0.15], [0.82, 0.20], [1, 0.265]
    ]);
    function capaPerfil(tabla) {
      return (u) => {
        for (let i = 1; i < tabla.length; i++) {
          if (u <= tabla[i][0]) {
            const [t0, w0] = tabla[i - 1], [t1, w1] = tabla[i];
            const q = (u - t0) / (t1 - t0);
            return w0 + (w1 - w0) * q * q * (3 - 2 * q);
          }
        }
        return tabla[tabla.length - 1][1];
      };
    }
    function capaAnillo(P, cx, cy, rx, ry, n, tam, tono) {
      for (let i = 0; i < n; i++) {
        const a = (i / n) * Math.PI * 2;
        P(cx + Math.cos(a) * rx, cy + Math.sin(a) * ry, tam, tono);
      }
    }
    // Dos carriles paralelos a los lados de un segmento; w0 y w1 = medio ancho al inicio y al final
    function capaCarriles(P, ax, ay, bx, by, n, w0, w1, tam, tono, alfa) {
      const dx = bx - ax, dy = by - ay, l = Math.hypot(dx, dy) || 1, nx = -dy / l, ny = dx / l;
      for (const s of [-1, 1]) {
        for (let i = 0; i < n; i++) {
          const u = (i + 0.5) / n, w = w0 + (w1 - w0) * u;
          P(ax + dx * u + nx * w * s, ay + dy * u + ny * w * s, tam, tono, alfa);
        }
      }
    }

    // Contexto de la caminata, el rastro y los objetivos de este cuadro
    const capaHist = [];                                       // dónde estuvo el personaje: { t, x, y }
    const capaR = [0, 0];
    const capaCtx = { t: 0, mov: 0, fase: 0, yaw: 0, dx: 0, dy: 1, rastro: capaRastro };
    const capaX = [], capaY = [], capaSet = [], capaAlfa = [];
    const capaLuz = { x: 0, y: 0 };                            // dónde está el farol (en el mundo): de ahí sale la luz del personaje
    let capaN = 0;
    let capaFase = 0;                                          // fase de la caminata sin dar la vuelta (personaje.fase se reinicia cada ciclo)
    let capaYaw = 0, capaYawVel = 0;                           // el giro de la capa: va detrás de personaje.giro con un resorte amortiguado
    function capaRastro(lag) {                                 // dónde estaba hace "lag" s, relativo a donde está ahora
      const h = capaHist;
      if (!h.length) { capaR[0] = 0; capaR[1] = 0; return capaR; }
      const tt = tiempo - lag;
      let i = h.length - 1;
      while (i > 0 && h[i].t > tt) i--;
      const a = h[i], b = h[Math.min(i + 1, h.length - 1)];
      const q = b.t > a.t ? limitar((tt - a.t) / (b.t - a.t), 0, 1) : 0;
      capaR[0] = a.x + (b.x - a.x) * q - personaje.x;
      capaR[1] = a.y + (b.y - a.y) * q - personaje.y;
      return capaR;
    }
    function capaP(x, y, tam, tono, alfa) {                    // pone un objetivo en coordenadas del mundo (alfa 0..1: opcional)
      const n = capaN++;
      capaX[n] = personaje.x + x; capaY[n] = personaje.y + y;
      capaSet[n] = CAPA_SETS[tam + tono] || 'pers';
      capaAlfa[n] = alfa === undefined ? 1 : alfa;
    }

    // c: t tiempo · mov 0..1 · fase · yaw (0 de frente, ±π/2 de lado, π de espaldas) · dx, dy rumbo ·
    //    rastro(lag) = dónde estaba hace "lag" s
    // Coordenadas locales: (0,0) = suelo bajo el personaje, y negativo = arriba.
    // El cuerpo es un cilindro algo aplastado (CONFIG.capa.elipse: más delgado de lado que de frente) y los rasgos
    // están pegados a su superficie en un ángulo th (0 = el frente, π = la espalda). Al girar, cada rasgo se desliza
    // por la superficie (x = ancho · sen(th + giro)) y se desvanece al llegar al borde: nada salta ni cambia de tamaño.
    // El brazo derecho del personaje lleva el farol: un puño, una cuerda corta y UN cerebrito grande y brillante que
    // cuelga y se balancea. De ese cerebrito sale la luz del personaje (capaLuz, en coordenadas del mundo).
    function capaGenerar(P, c) {
      const H = CONFIG.alturaPersonaje, K = CONFIG.capa, m = c.mov, t = c.t, ph = c.fase, R = K.elipse, prof = K.profundidad;
      const sen = Math.sin, cos = Math.cos, TAU = Math.PI * 2;
      const top = K.arriba * H, hem = K.dobladillo * H;
      const flota = sen(t * 1.4) * H * 0.008 - Math.abs(sen(ph)) * H * 0.012 * m;
      const co = cos(c.yaw), si = sen(c.yaw);
      const ancho = (u) => PERFIL_CAPA(u) * H;
      const incl = (u) => (1 - u) * (c.dx * K.inclina * H * m + sen(t * 0.8) * 0.008 * H);   // la parte de arriba se inclina
      const onda = (u) => sen(t * 1.3 + u * 2.4) * 0.008 * H * u + sen(ph * 0.5 - u * 3) * 0.012 * H * u * m;
      const arr = (u) => c.rastro(u * K.arrastre)[0] * 0.7;    // la tela se queda atrás, más cuanto más abajo
      const cen = (u) => incl(u) + onda(u) + arr(u);           // eje de la túnica a la altura u
      const Y = (u) => top + (hem - top) * u + flota;
      const anchoPant = (u) => ancho(u) * Math.hypot(co, R * si);   // medio ancho de la silueta con el giro
      const Xq = (u, q) => cen(u) + q * anchoPant(u);
      // punto de la superficie a la altura u y ángulo th: [x en pantalla, cuánto da a la cámara (-1..1)]
      const sup = (u, th) => {
        const a = ancho(u), lx = a * sen(th), lz = a * R * cos(th);
        return [cen(u) + lx * co + lz * si, (lz * co - lx * si) / (a || 1)];
      };
      const mira = (z, a, b) => suavizar(a, b, z);

      // silueta y remate de la capucha
      for (const s of [-1, 1]) for (let i = 0; i < 16; i++) {
        const u = 0.05 + (i / 15) * 0.95;
        P(Xq(u, s), Y(u), 'm', 0);
      }
      for (let k = 0; k < 5; k++) P(cen(0) + (k - 2) * 0.032 * H, Y(0) + (k - 2) * (k - 2) * 0.008 * H, 'm', 0);

      // la abertura vacía de la capucha y el broche del cuello (solo de frente)
      const fu = 0.165, fcy = Y(fu);
      for (let i = 0; i < 12; i++) {
        const a = (i / 12) * TAU, [x, z] = sup(fu, cos(a) * 0.62);
        P(x, fcy + sen(a) * 0.105 * H, 'xs', 1, mira(z, -0.05, 0.4));
      }
      const [bx, bz] = sup(0.31, 0);
      P(bx, Y(0.31), 's', 2, mira(bz, -0.05, 0.4));
