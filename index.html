      // el texto de ayuda (la transformación tiene que volver a la normal: los cerebritos de arriba la dejan rotada)
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.fillStyle = '#d4d4d4'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = Math.round(16 * k) + 'px ui-monospace, Consolas, monospace';
      ctx.globalAlpha = 0.7;
      ctx.fillText('0-9 o ↑ ↓: poner el número      ← →: cambiar de casillero', 640 * k, 442 * k);
      ctx.globalAlpha = 0.95;
      ctx.fillText('E: confirmar el código      Esc: salir', 640 * k, 470 * k);
      ctx.globalAlpha = 1;
    }

    // El portal-trampa de ESPERANZA: un arco de cerebritos blancos con el fondo de luz, igual que una salida. Al acercarte
    // tiembla; cuando se dispara la trampa se vuelve rojo, se deshace y de ahí crece el cerebro malvado.
    // Devuelve cuánto se transformó (0 = portal, 1 = ya es el monstruo) y cuánta presencia tiene, para la luz.
    function estadoPortal(t) {
      const X = PUERTAS.find((p) => p.tipo === 'X');
      if (!X || !X.abierta || X.superada) return null;
      const po = portalDe(X);
      const disparado = fin && fin.tipo === 'derrota', tt = disparado ? t - fin.t0 : 0;
      const mo = disparado ? suavizar(0, 0.9, tt) : 0;
      const A = (disparado ? 1 - suavizar(0.4, 1.2, tt) : 1) * suavizar(0.4, 1.4, t - X.tAbrir);   // aparece al deshacerse el disfraz de la pared
      const d = Math.hypot(personaje.x - po.x, personaje.y - po.base);
      const cerca = disparado ? 1 : limitar(1 - (d - CONFIG.final.portalDisparo) / 90, 0, 1);     // la inquietud antes de que se dispare
      return { po, mo, A, cerca };
    }
    function dibujarPortalTrampa(t) {
      const e = estadoPortal(t);
      if (!e || e.A < 0.02) return;
      const { po, mo, A, cerca } = e;
      if (!visible(po.x, po.base - po.alto / 2, 160)) return;
      const hw = po.ancho / 2, cyA = po.base - (po.alto - hw);                  // centro del medio círculo de arriba
      const sx = (x) => x * k - cam.px, sy = (y) => y * k - cam.py;

      // el fondo de luz: blanco que respira (y se tiñe de rojo al transformarse)
      const cr = Math.round(255 - 55 * mo), cg = Math.round(255 - 202 * mo), cb = Math.round(255 - 210 * mo);
      const gr = ctx.createRadialGradient(sx(po.x), sy(cyA + 12), 4 * k, sx(po.x), sy(cyA + 12), (hw + 46) * k);
      gr.addColorStop(0, 'rgba(' + cr + ',' + cg + ',' + cb + ',1)');
      gr.addColorStop(1, 'rgba(' + Math.round(cr * 0.8) + ',' + Math.round(cg * 0.8) + ',' + Math.round(cb * 0.8) + ',0.82)');
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      const parpadeo = cerca > 0 && mo === 0 ? 0.12 * cerca * Math.sin(t * 38) : 0;       // se inquieta al acercarte
      ctx.globalAlpha = limitar(A * (0.9 + 0.1 * Math.sin(t * 2.4) + parpadeo), 0, 1);
      ctx.fillStyle = gr;
      ctx.beginPath();
      ctx.moveTo(sx(po.x - hw), sy(po.base));
      ctx.lineTo(sx(po.x - hw), sy(cyA));
      ctx.arc(sx(po.x), sy(cyA), hw * k, Math.PI, 0);
      ctx.lineTo(sx(po.x + hw), sy(po.base));
      ctx.closePath();
      ctx.fill();
      // ondas grises que se van hacia adentro, como un túnel de luz
      ctx.strokeStyle = '#8a8a8a'; ctx.lineWidth = 1.5 * k;
      for (let i = 0; i < 3; i++) {
        const f = (t * 0.32 + i / 3) % 1, w = hw * (1 - f), ytop = cyA + hw * f * 0.6;
        ctx.globalAlpha = A * (1 - mo) * (1 - f) * 0.3;
        ctx.beginPath();
        ctx.moveTo(sx(po.x - w), sy(po.base - 4 - 10 * f));
        ctx.lineTo(sx(po.x - w), sy(ytop));
        ctx.arc(sx(po.x), sy(ytop), w * k, Math.PI, 0);
        ctx.lineTo(sx(po.x + w), sy(po.base - 4 - 10 * f));
        ctx.stroke();
      }

      // el marco: cerebritos en fila (un lado, el medio círculo y el otro lado); al transformarse se ponen rojos y saltan
      const pts = [], paso = 8, lado = po.base - cyA, hm = hw + 7;               // el marco rodea la luz (7 px por fuera)
      for (let s = 0; s <= lado; s += paso) { pts.push([-hm, -s]); pts.push([hm, -s]); }
      const nArco = Math.round(Math.PI * hm / paso);
      for (let i = 0; i <= nArco; i++) { const a = Math.PI + (i / nArco) * Math.PI; pts.push([Math.cos(a) * hm, -lado + Math.sin(a) * hm]); }
      const V = CONFIG.variaciones;
      for (let i = 0; i < pts.length; i++) {
        const [dx, dy] = pts[i];
        const h = (i * 0.618034) % 1, rojo = mo > h;
        const ex = mo * mo * 34, nx = dx / hm, ny = (dy + lado) / hm;           // hacia afuera del centro del arco
        const tx = Math.sin(t * 41 + i * 3.1) * (0.5 + 2.4 * cerca) * (cerca > 0 ? 1 : 0), ty = Math.cos(t * 37 + i * 1.7) * (0.5 + 2.4 * cerca) * (cerca > 0 ? 1 : 0);
        const set = juegoK[rojo ? 'mal' : 'llave'];
        estamparMundo(set[i % V], po.x + dx + nx * ex + tx, po.base + dy + (ny - 0.5) * ex * 0.6 + ty, i * 0.7 + mo * 4, A * 0.95);
      }
      ctx.globalAlpha = 1;
    }

    // ===== El monstruo de ESPERANZA =====
    // Dónde está, qué tamaño tiene y cuánto abre la boca según la fase: aparece sobre el personaje, se va acercando mientras
    // corre la cuenta, se abalanza si fallás y estalla si lográs la combinación.
    function estadoMonstruo(t) {
      const tt = t - fin.t0, total = fin.tLimite - fin.tCombo;                  // la cuenta y la combinación, juntas
      const u = limitar((tt - 0.1) / 1.1, 0, 1);
      let esc = 1 - Math.pow(1 - u, 3);                                         // aparece creciendo
      const p = limitar((t - fin.tCombo) / total, 0, 1);                        // cuánto de la cuenta ya pasó
      let x = fin.bx + Math.sin(t * 1.3) * 7, y = fin.by + 60 * p + Math.sin(t * 1.9) * 5, abre = 0.5 + 0.35 * Math.sin(t * 5.5), alfa = 1;
      esc *= 1 + 0.1 * p;
      if (fin.fase === 'comido') {                                              // se abalanza sobre el personaje y se cierra de golpe
        const e = 1 - Math.pow(1 - limitar((t - fin.tc) / 0.5, 0, 1), 3);
        y = fin.desdeY + (personaje.y - 135 - fin.desdeY) * e;
        esc *= 1 + 0.3 * e;
        abre = (t - fin.tc) < 0.45 ? 1 : 0.1 + 0.08 * Math.sin((t - fin.tc) * 15);
      } else if (fin.fase === 'salvado') {                                      // estalla: se apaga de golpe
        alfa = 1 - suavizar(0, 0.3, t - fin.tS);
      }
      return { x, y, esc, abre, alfa, p };
    }
    function dibujarMonstruo(t) {
      if (!fin || fin.tipo !== 'derrota') return;
      const m = estadoMonstruo(t);
      if (m.alfa < 0.02 || m.esc < 0.03) return;
      const rx = 200 * m.esc, V = CONFIG.variaciones, A = m.alfa * Math.min(1, m.esc * 2.5);
      const reach = fin.fase === 'comido' ? 1 : 0.25 + 0.5 * m.p;               // los tentáculos se estiran más a medida que corre la cuenta

      // tentáculos: siete cadenas de cerebritos que salen de abajo del cerebro y se arrastran hacia el personaje
      for (let j = 0; j < 7; j++) {
        const ang = (0.12 + (j / 6) * 0.76) * Math.PI;                          // repartidos por el borde de abajo
        const ax = m.x + Math.cos(ang) * rx * 0.82, ay = m.y + Math.sin(ang) * rx * 0.55;
        const tx = personaje.x + (j - 3) * 24, ty = personaje.y - 40 + (j % 2) * 34;
        const dx = tx - ax, dy = ty - ay, L = Math.hypot(dx, dy) || 1, nx = -dy / L, ny = dx / L;
        for (let s = 0; s < 11; s++) {
          const f = s / 10;
          const ond = Math.sin(t * 3.2 - f * 5 + j * 1.7) * 26 * f * (1 - 0.3 * reach);
          estamparEsc(juegoK.mal[(j + s) % V], ax + dx * reach * f + nx * ond, ay + dy * reach * f + ny * ond, f * 4 + j, A * (0.95 - 0.35 * f), 2.7 - 1.7 * f, false);
        }
      }
      // cuerpo: el cerebro de siempre, pero enorme y latiendo
      for (let i = 0; i < CEREBRO_MALO.length; i++) {
        const [px, py] = CEREBRO_MALO[i];
        for (let c = 0; c < 2; c++) {
          const x = m.x + px * rx + Math.sin(t * 3 + i + c * 2) * 3, y = m.y + py * rx + Math.cos(t * 2.6 + i * 1.3 + c) * 3;
          estamparEsc(juegoK.mal[(i + c) % V], x, y, i * 0.7 + c, A * (0.8 + 0.2 * Math.sin(t * 5 + i)), 3.4, false);
        }
      }
      // cejas furiosas: dos rayas de cerebritos que bajan hacia el centro
      for (const sg of [-1, 1]) {
        for (let s = 0; s < 6; s++) {
          const f = s / 5;
          estamparEsc(juegoK.mal[(s + 1) % V], m.x + sg * (0.52 - 0.38 * f) * rx, m.y + (-0.42 + 0.15 * f) * rx, sg * 0.6, A, 2.4, false);
        }
      }
      // ojos: un aro blanco de cerebritos con una pupila roja rasgada que mira al personaje
      for (const sg of [-1, 1]) {
        const ex = m.x + sg * 0.3 * rx, ey = m.y - 0.1 * rx, er = 0.14 * rx;
        const mx = personaje.x - ex, my = personaje.y - 100 - ey, ml = Math.hypot(mx, my) || 1;
        for (let i = 0; i < 11; i++) {
          const a = (i / 11) * 6.2832;
          estamparEsc(juegoK.llave[i % V], ex + Math.cos(a) * er, ey + Math.sin(a) * er * 0.8, a, A * (0.85 + 0.15 * Math.sin(t * 6 + i)), 1.5, false);
        }
        for (let s = -1; s <= 1; s++) estamparEsc(juegoK.mal[(s + 2) % V], ex + (mx / ml) * er * 0.35, ey + (my / ml) * er * 0.3 + s * er * 0.42, 0, A, 2.1, false);
      }
      // boca: un hueco negro con dos filas de dientes que se abre y se cierra
      const my2 = m.y + 0.36 * rx, ancho = 0.82 * rx, hueco = rx * (0.04 + 0.28 * m.abre);
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.globalAlpha = A * 0.95; ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.ellipse(m.x * k - cam.px, my2 * k - cam.py, ancho * 0.54 * k, (hueco * 0.5 + 0.045 * rx) * k, 0, 0, 6.2832);
      ctx.fill();
      for (let i = 0; i < 9; i++) {
        const x = m.x + (i / 8 - 0.5) * ancho;
        for (let q = 0; q < 3; q++) {
          const esc2 = (2.0 - q * 0.45) * Math.min(1, m.esc + 0.2);
          estamparEsc(juegoK.llave[(i + q) % V], x, my2 - hueco / 2 + q * 9 * m.esc, 0, A, esc2, false);                          // dientes de arriba, hacia abajo
          estamparEsc(juegoK.llave[(i + q + 1) % V], x + ancho / 16, my2 + hueco / 2 - q * 9 * m.esc, 0, A, esc2, false);         // y de abajo, hacia arriba
        }
      }
      ctx.globalAlpha = 1;
    }

    // La prueba de ESPERANZA en pantalla. Primero corre la cuenta 3-2-1 (la banda oscura de arriba está vacía); cuando termina
    // aparecen las flechas y empieza el segundo reloj, el de la combinación.
    function dibujarPrueba(t) {
      if (!fin || fin.tipo !== 'derrota' || fin.fase !== 'amenaza' || t < fin.tCombo) return;
      const seg = CONFIG.final.segundosPorNumero;
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      // la banda oscura de arriba, para que lo que va encima se lea sobre el monstruo (desde que empieza la cuenta)
      ctx.globalAlpha = 0.55; ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, canvas.width, 128 * k);

      if (t < fin.tFlechas) {
        // LA CUENTA: un número enorme, rojo, que late más cuanto menos queda
        const n = limitar(Math.ceil((fin.tFlechas - t) / seg), 1, 3);
        const pulso = 1 + 0.12 * Math.sin(t * 14) * (4 - n) / 3;
        for (const b of digitoBrains(n, true)) {
          estamparEsc(juegoK.mal[b.v], 150 + (b.x - 39) * pulso, 330 + (b.y - 52) * pulso, b.ang, 0.95, 1.5 * pulso, true);
        }
      } else {
        // LA COMBINACIÓN: flechas hechas de cerebritos; las acertadas se vuelven doradas y la que toca late
        const cuantas = fin.combo.length, sep = 150, x0 = 640 - ((cuantas - 1) * sep) / 2;
        const aparece = suavizar(0, 0.25, t - fin.tFlechas);                       // las flechas se encienden de golpe
        for (let i = 0; i < cuantas; i++) {
          const [dx, dy] = DIRS[fin.combo[i]];
          const hecha = i < fin.progreso, toca = i === fin.progreso;
          const set = juegoK[hecha ? 'oro' : 'llave'];
          const alfa = (hecha ? 1 : toca ? 0.8 + 0.2 * Math.sin(t * 10) : 0.5) * aparece;
          const f = toca ? 1.15 : 0.95;
          puntosFlecha(dx, dy).forEach(([px, py], j) => estamparEsc(set[j % CONFIG.variaciones], x0 + i * sep + px * f * 0.8, 58 + py * f * 0.8, j, alfa, 1.1, true));
        }
        // el reloj de la combinación: una línea de cerebritos que se va acortando y se pone roja al final
        const resto = limitar((fin.tLimite - t) / CONFIG.final.segundosCombo, 0, 1);
        const largo = 1000, n = Math.floor((largo / 9) * resto), poco = resto < 0.33;
        for (let i = 0; i < n; i++) estamparEsc(juegoK[poco ? 'mal' : 'llave'][i % CONFIG.variaciones], 140 + i * 9, 110, i, poco ? 0.95 : 0.7, 0.85, true);
      }
      ctx.globalAlpha = 1;
    }
    // Lo que va sobre toda la pantalla en los finales: la derrota se va a negro; la victoria, a luz y luego al letrero
    function dibujarFinPantalla(t) {
      if (!fin) return;
      const tt = t - fin.t0, W = canvas.width, Hh = canvas.height;
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      if (fin.tipo === 'derrota') {
        dibujarPrueba(t);
        if (fin.fase === 'comido') {                                          // devorado: la pantalla se va a negro
          ctx.setTransform(1, 0, 0, 1, 0, 0);
          ctx.globalAlpha = suavizar(3.0, 4.0, t - fin.tc); ctx.fillStyle = '#000';
          ctx.fillRect(0, 0, W, Hh);
        } else if (fin.fase === 'salvado') {                                  // lo lograste: un destello blanco al estallar
          ctx.globalAlpha = 0.75 * (1 - suavizar(0, 0.6, t - fin.tS)); ctx.fillStyle = '#fff';
          ctx.fillRect(0, 0, W, Hh);
        }
      } else {
        ctx.globalAlpha = suavizar(0, 1.0, tt); ctx.fillStyle = '#fff';       // se vuelve luz...
        ctx.fillRect(0, 0, W, Hh);
        ctx.globalAlpha = suavizar(1.0, 1.7, tt); ctx.fillStyle = '#000';     // ...y luego negro
        ctx.fillRect(0, 0, W, Hh);
        if (fin.texto) dibujarTextoObj(fin.texto, t, false);
      }
      ctx.globalAlpha = 1;
    }

    function dibujar(t, foco) {
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.globalAlpha = 1;
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      if (mundo) { pegar(mundo.suelo); pegar(mundo.muros); }
      dibujarTexto(t);
      dibujarCuadros(t);

      // las llaves: aparecen cuando se abre su cuarto; flotan y brillan. La verdadera se deshace al recogerla;
      // una falsa estalla en cerebritos rojos (todas se ven iguales hasta que se agarran)
      for (const l of llaves) {
        if (!visible(l.x, l.y, 80)) continue;
        if (llaveAlAlcance(l)) {
          dibujarLlave(l.x, l.y - 30 - Math.sin(t * 2 + l.fase) * 3, t + l.fase, 1.5, 1, 0, false);
        } else if (l.estado === 'recogida' && t - l.tFin < 0.7) {
          const e = (t - l.tFin) / 0.7;
          dibujarLlave(l.x, l.y - 30, t + l.fase, 1.5 + e * 0.5, 1 - e, e, false);
        }
      }
      for (const ex of explosiones) {
        const e = (t - ex.t0) / CONFIG.explosion.duracion;
        if (e >= 1) continue;
        const suave = 1 - (1 - e) * (1 - e);                   // sale rápido y frena
        for (const b of ex.brains) {
          estamparMundo(juegoK.mal[b.v], ex.x + b.dx * suave, ex.y + b.dy * suave + e * e * 18, b.giro * e, (1 - e) * 0.95);
        }
      }
      dibujarPortal(t);
      dibujarPortalTrampa(t);
      dibujarPuertas(t);
      dibujarPalancas(t);
      dibujarPanelFachada(t);

      // personaje: posición y rotación con un solo setTransform, sin save/restore
      let desvanece = fin && fin.tipo === 'derrota' && fin.tc !== null ? 1 - suavizar(1.4, 3.2, t - fin.tc) : 1;   // devorado, se va apagando
      if (piscina && (piscina.fase === 'desintegra' || piscina.fase === 'fin')) desvanece = 1 - suavizar(0, CONFIG.piscina.desintegra * 0.85, t - piscina.tDes);   // desintegrado
      dibujarEnjambre(t, desvanece, cam.px, cam.py);
      dibujarMonstruo(t);

      // polvo flotante (solo el que cae dentro de la pantalla)
      const izq = cam.px / k - 20, der = izq + CONFIG.logico.w + 40;
      const arr = cam.py / k - 20, aba = arr + CONFIG.logico.h + 40;
      for (const m of polvo) {
        const x = m.bx + Math.sin(t * m.fx + m.px) * m.ax;
        const y = m.by + Math.sin(t * m.fy + m.py) * m.ay;
        if (x < izq || x > der || y < arr || y > aba) continue;
        estamparMundo(juegoK.polvo[m.v], x, y, t * 0.25 + m.px,
          CONFIG.polvo.alfa * m.a * (0.65 + 0.35 * Math.sin(t * 1.3 + m.py)));
      }
      ctx.globalAlpha = 1;
      ctx.setTransform(1, 0, 0, 1, 0, 0);

      dibujarOscuridad(t);
      dibujarPiscina(t);

      // lo que va por encima de la oscuridad: la llave que llevás y la pista de interacción
      if (tieneLlave) dibujarLlave(46, 50, t, 1.1, 0.9, 0, true);
      ctx.globalAlpha = 1;
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      dibujarPistaCuadros(t);
      if (foco) dibujarPista(foco, t);
      dibujarPanelModal(t);
      dibujarFinPantalla(t);
      dibujarInicio(t);

      // fundido a negro entre niveles
      if (transicion) {
        let a;
        if (!transicion.cargado) a = limitar((t - transicion.t0) / CONFIG.transicion.salir, 0, 1);
        else a = 1 - limitar((t - transicion.t1) / CONFIG.transicion.entrar, 0, 1);
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.globalAlpha = a;
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.globalAlpha = 1;
      }
    }

    // Oscuridad: se hace en un canvas aparte y cada luz "borra" un círculo (así se pueden sumar varias luces)
    function dibujarOscuridad(t) {
      const o = capaOscura.getContext('2d');
      const W = canvas.width, Hh = canvas.height;
      o.globalCompositeOperation = 'source-over';
      o.globalAlpha = 1;
      o.clearRect(0, 0, W, Hh);
      o.fillStyle = 'rgba(0,0,0,' + CONFIG.luz.oscuridad + ')';
      o.fillRect(0, 0, W, Hh);
      o.globalCompositeOperation = 'destination-out';

      const luz = (m, x, y, intensidad, escala) => {            // x, y en el mundo
        const R = m.r * (escala || 1);
        const sx = x * k - cam.px, sy = y * k - cam.py;
        if (sx + R < 0 || sx - R > W || sy + R < 0 || sy - R > Hh) return;
        o.globalAlpha = intensidad;
        o.drawImage(m.canvas, sx - R, sy - R, R * 2, R * 2);
      };
      // personaje (con un parpadeo sutil)
      const parp = 1 + Math.sin(t * 7.1) * CONFIG.luz.parpadeo * 0.6 + Math.sin(t * 3.3 + 1) * CONFIG.luz.parpadeo * 0.4;
      // el encapuchado lleva un farol: la luz sale de él (salvo en la derrota y la piscina, donde el personaje se deshace)
      const luzDelFarol = PERSONAJES[sel].farol && !(fin && fin.tipo === 'derrota') && !(piscina && piscina.fase !== 'libre');
      if (luzDelFarol) {
        const F = CONFIG.luz.farol;
        const llama = 1 + Math.sin(t * 7.1) * F.parpadeo * 0.6 + Math.sin(t * 3.3 + 1) * F.parpadeo * 0.4;   // el farol parpadea más que la luz general
        luz(luces.personaje, capaLuz.x, capaLuz.y, F.base, parp);                 // la luz general, algo más baja
        luz(luces.farol, capaLuz.x, capaLuz.y, F.intensidad, llama);              // el charco concentrado en el farol
      } else luz(luces.personaje, personaje.x, personaje.y - CONFIG.alturaPersonaje * 0.55, 1, parp);
      // las llaves brillan en la oscuridad (las falsas igual que la verdadera), pero solo cuando su cuarto ya se abrió
      for (const l of llaves) if (llaveAlAlcance(l)) luz(luces.llave, l.x, l.y - 30, 0.85 + 0.15 * Math.sin(t * 2.2 + l.fase), 1);
      // un destello rojo breve cuando estalla una llave falsa
      for (const ex of explosiones) {
        const e = (t - ex.t0) / CONFIG.explosion.duracion;
        if (e < 1) luz(luces.llave, ex.x, ex.y, 0.9 * (1 - e), 1.4);
      }
      // el cuadro tiene luz propia, latiendo
      for (const q of CUADROS) luz(luces.cuadro, q.cx, q.cy + 10, 0.8 + 0.2 * Math.sin(t * 1.4) + q.pulso * 0.2, 1 + q.pulso * 0.15);
      // las palancas bien tiradas se encienden en la oscuridad (doradas)
      for (const p of PALANCAS) if (p.estado === 'abajo' || puzzleResuelto) luz(luces.llave, p.x, p.y + 45, 0.6 + 0.1 * Math.sin(t * 2 + p.indice), 1);
      // la cerradura dorada de la puerta final: una luz suave que deja ver desde lejos cuál es la que hay que abrir
      for (const pu of PUERTAS) {
        if (tieneCandado(pu) && !pu.abierta) luz(luces.cerradura, (pu.c + 0.5) * T, (pu.r + 0.5) * T, 0.5 + 0.12 * Math.sin(t * 1.6), 1);
      }
      // el panel del código, una vez resuelto, brilla dorado
      if (PANEL && puzzleResuelto) luz(luces.llave, PANEL.x, PANEL.y + 46, 0.7, 1.1);
      // el portal-trampa de ESPERANZA ilumina el cuartito como si fuera una salida
      const ep = estadoPortal(t);
      if (ep && ep.A > 0.02) luz(luces.portal, ep.po.x, ep.po.base - 55, 0.95 * ep.A * (0.92 + 0.08 * Math.sin(t * 2.4)), 1);
      // al ser devorado, el cerebro malvado lo ilumina todo con su luz roja
      if (fin && fin.tipo === 'derrota') {
        const m = estadoMonstruo(t);
        luz(luces.cuadro, m.x, m.y + 40, suavizar(0.1, 1.2, t - fin.t0) * m.alfa, 2.4);
      }
      // el texto escrito en el suelo se enciende con luz propia, para que se pueda leer entero
      if (textoSuelo) luz(luces.texto, textoSuelo.centroX, textoSuelo.centroY, 0.9 * suavizar(0, 1.2, t - textoSuelo.t0), 1);
      // el portal de la salida, una vez abierta la puerta final
      if (salidaActiva()) luz(luces.portal, salida.x, salida.y, 0.9 + 0.1 * Math.sin(t * 2.1), 1);
      o.globalAlpha = 1;
      o.globalCompositeOperation = 'source-over';

      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.drawImage(capaOscura, 0, 0);

      // resplandor rojo del cerebro malvado, sumado encima
      ctx.globalCompositeOperation = 'lighter';
      if (luzDelFarol) {                                       // y el halo blanco del farol
        const m = luces.brilloFarol, sx = capaLuz.x * k - cam.px, sy = capaLuz.y * k - cam.py;
        ctx.globalAlpha = 0.9 + 0.1 * Math.sin(t * 5.3);
        ctx.drawImage(m.canvas, sx - m.r, sy - m.r, m.r * 2, m.r * 2);
      }
      for (const q of CUADROS) {
        const m = luces.brilloCuadro;
        const sx = q.cx * k - cam.px, sy = (q.cy + 10) * k - cam.py;
        if (sx + m.r < 0 || sx - m.r > W || sy + m.r < 0 || sy - m.r > Hh) continue;
        ctx.globalAlpha = (0.6 + 0.4 * Math.sin(t * 1.4)) * (1 + q.pulso * 0.8);
        ctx.drawImage(m.canvas, sx - m.r, sy - m.r, m.r * 2, m.r * 2);
      }
      // el cerebro malvado devorando: un gran resplandor rojo
      if (fin && fin.tipo === 'derrota') {
        const mo = estadoMonstruo(t);
        const m = luces.brilloCuadro, sx = mo.x * k - cam.px, sy = (mo.y + 40) * k - cam.py, R = m.r * 2.2;
        ctx.globalAlpha = Math.min(1, suavizar(0.1, 1.2, t - fin.t0) * mo.alfa * (0.85 + 0.15 * Math.sin(t * 6)));
        ctx.drawImage(m.canvas, sx - R, sy - R, R * 2, R * 2);
      }
      // resplandor dorado sutil sobre la cerradura de la puerta final, mientras siga cerrada
      for (const pu of PUERTAS) {
        if (!tieneCandado(pu) || pu.abierta) continue;
        const m = luces.brilloOro;
        const sx = (pu.c + 0.5) * T * k - cam.px, sy = (pu.r + 0.5) * T * k - cam.py;
        if (sx + m.r < 0 || sx - m.r > W || sy + m.r < 0 || sy - m.r > Hh) continue;
        ctx.globalAlpha = 0.7 + 0.3 * Math.sin(t * 1.6);
        ctx.drawImage(m.canvas, sx - m.r, sy - m.r, m.r * 2, m.r * 2);
      }
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
    }

    // ===== Bucle principal =====
    let anterior = 0;
    let acumFps = 0, cuadros = 0, peorCuadro = 0, ultimoPanel = 0;

    // Fundido entre niveles: sale a negro, carga el nuevo nivel y vuelve a mostrarse
    function avanzarTransicion(t) {
      if (!transicion) return;
      if (!transicion.cargado && t - transicion.t0 >= CONFIG.transicion.salir) {
        iniciarNivel(transicion.destino);
        transicion.cargado = true;
        transicion.t1 = t;
      } else if (transicion.cargado && t - transicion.t1 >= CONFIG.transicion.entrar) {
        transicion = null;
      }
    }

    function bucle(ts) {
      if (!mundo) { requestAnimationFrame(bucle); return; }   // espera a que el canvas tenga tamaño
      if (pausado) {                                           // en pausa no se actualiza ni se dibuja: queda el último cuadro
        if (pausaT0 === null) pausaT0 = ts / 1000;
        requestAnimationFrame(bucle);
        return;
      }
      if (pausaT0 !== null) { pausaAcum += ts / 1000 - pausaT0; pausaT0 = null; }   // el reloj del juego no cuenta el tiempo en pausa
      const t = ts / 1000 - pausaAcum;
      tiempo = t;
      if (anterior === 0) anterior = t;
      const dtReal = t - anterior;
      anterior = t;
      const dt = Math.min(dtReal, 1 / 20);                     // si la pestaña se durmió, no da saltos

      avanzarTransicion(t);
      if (!mundo) { requestAnimationFrame(bucle); return; }    // el nivel nuevo aún no tiene escenario
      actualizarPersonaje(dt);
      recogerLlaves();
      actualizarPalancas(dt);
      actualizarBichos(dt);
      actualizarPastos();
      comprobarFinal();
      actualizarInicio(dt);
      actualizarPiscina(t);
      actualizarFin(t);
      actualizarCamara(dt);
      actualizarEnjambre(dt);
      for (const q of CUADROS) q.pulso = Math.max(0, q.pulso - dt * 1.2);   // el cuadro se calma solo
      explosiones = explosiones.filter((ex) => t - ex.t0 < CONFIG.explosion.duracion);

      const foco = buscarInteraccion();                        // qué se puede usar desde acá
      btnE.style.display = (tactil && foco) ? 'block' : 'none';
      dibujar(t, foco);

      if (mostrarFps) {                                        // medición (F3)
        acumFps += dtReal; cuadros++;
        peorCuadro = Math.max(peorCuadro, dtReal);
        if (t - ultimoPanel > 0.5) {
          panelFps.textContent = Math.round(cuadros / acumFps) + ' fps\npeor cuadro: ' + (peorCuadro * 1000).toFixed(1) +
            ' ms\nescenario: ' + msMundo.toFixed(0) + ' ms (una vez por nivel)';
          acumFps = 0; cuadros = 0; peorCuadro = 0; ultimoPanel = t;
        }
      }
      requestAnimationFrame(bucle);
    }

    construirTeclado();
    construirFlechas();
    portada = construirInicio();                    // la pantalla de inicio va antes del nivel 1
    iniciarNivel(0);
    ajustar();                                     // (si aún no hay tamaño, el ResizeObserver lo hará)
    canvas.focus({ preventScroll: true });
    requestAnimationFrame(bucle);
  </script>
</body>
</html>
