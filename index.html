      g.letterSpacing = '10px';                                // letras bien separadas: se lee mejor hecha de cerebritos chicos
      g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillText('EMPEZAR', 215, 35);                          // (el espaciado deja 10 px de más a la derecha: se compensa con el 215)
      const hint = vestirPuntos(muestrearPuntos(cv, S.empezar.x - 210, S.empezar.y - 35, 5), rng, 1.2);
      // las instrucciones de teclas, a ambos lados de una "o" (se saltan en pantallas táctiles: allí sale el joystick)
      let teclas = [];
      if (!(window.matchMedia && matchMedia('(pointer: coarse)').matches)) {
        const T0 = S.teclas, sep = 36;
        const o = document.createElement('canvas'); o.width = 40; o.height = 40;
        const go = o.getContext('2d'); go.font = '700 26px ' + FUENTE_INDICACION; go.fillStyle = '#fff'; go.textAlign = 'center'; go.textBaseline = 'middle';
        go.fillText('o', 20, 22);
        teclas = [
          teclasGrupo('wasd', T0.x - sep - TECLAS_ANCHO, T0.y, rng, 2.0),
          vestirPuntos(muestrearPuntos(o, T0.x - 20, T0.y + TECLA + TECLA_GAP / 2 - 20, 5), rng, 2.0),
          teclasGrupo('flechas', T0.x + sep, T0.y, rng, 2.0)
        ];
      }
      // la zona donde hay que hacer clic: la caja de "EMPEZAR" con un poco de margen
      const m = 18, caja = {
        x0: Math.min(...hint.map((b) => b.x)) - m, x1: Math.max(...hint.map((b) => b.x)) + m,
        y0: Math.min(...hint.map((b) => b.y)) - m, y1: Math.max(...hint.map((b) => b.y)) + m
      };
      // selector de personaje: dos flechas (‹ ›) hechas de cerebritos a los lados del personaje y un puntito por personaje debajo
      const SEL = S.selector, yc = SEL.y - CONFIG.alturaPersonaje * 0.45;
      const flecha = (dir) => {
        const f = document.createElement('canvas'); f.width = 60; f.height = 90;
        const q = f.getContext('2d');
        q.strokeStyle = '#fff'; q.lineWidth = 11; q.lineJoin = 'miter'; q.lineCap = 'butt';
        q.beginPath();
        q.moveTo(dir < 0 ? 44 : 16, 8); q.lineTo(dir < 0 ? 14 : 46, 45); q.lineTo(dir < 0 ? 44 : 16, 82);
        q.stroke();
        const cx = SEL.x + dir * SEL.separacion;
        return { dir, cx, cy: yc, puntos: vestirPuntos(muestrearPuntos(f, cx - 30, yc - 45, 6), rng, 1.5), sobre: false };
      };
      const flechas = [flecha(-1), flecha(1)];
      const puntitos = PERSONAJES.map((_, i) => ({ x: SEL.x + (i - (PERSONAJES.length - 1) / 2) * 22, y: SEL.y + 30 }));
      return { fase: 'espera', t0: null, tSalida: 0, down: null, sobre: false, letras, suelo, hint, caja, flechas, puntitos, teclas };
    }
    // Coordenadas del puntero en px lógicos (1280x720) y si caen sobre "EMPEZAR"
    const posLogica = (e) => {
      const r = canvas.getBoundingClientRect();
      return { x: (e.clientX - r.left) / r.width * CONFIG.logico.w, y: (e.clientY - r.top) / r.height * CONFIG.logico.h };
    };
    const sobreEmpezar = (e) => {
      const p = posLogica(e), c = portada.caja;
      return p.x >= c.x0 && p.x <= c.x1 && p.y >= c.y0 && p.y <= c.y1;
    };
    function empezarJuego() {
      if (!portada || portada.fase !== 'espera' || portada.t0 === null || tiempo - portada.t0 < 0.8) return;   // que se alcance a ver el título
      portada.fase = 'sale'; portada.tSalida = tiempo;
      SND.iniciar();                                             // el sonido arranca aquí, no antes
      SND.empezar();
      canvas.focus({ preventScroll: true });
    }
    // Qué hay bajo el puntero en la pantalla de inicio: 'empezar', una flecha del selector (-1 anterior, 1 siguiente),
    // 'pj' (el personaje: pasa al siguiente) o null
    const sobreSelector = (e) => {
      if (e.target !== canvas) return null;
      if (sobreEmpezar(e)) return 'empezar';
      const p = posLogica(e), SEL = CONFIG.inicio.selector;
      for (const f of portada.flechas) if (Math.abs(p.x - f.cx) < 50 && Math.abs(p.y - f.cy) < 68) return f.dir;
      if (Math.abs(p.x - SEL.x) < 60 && p.y > SEL.y - CONFIG.alturaPersonaje && p.y < SEL.y + 40) return 'pj';
      return null;
    };
    // Solo un clic (o toque) sobre "EMPEZAR", una flecha o el personaje hace algo; en cualquier otro sitio no pasa nada
    const portadaLista = () => portada && portada.fase === 'espera' && portada.t0 !== null && tiempo - portada.t0 >= 0.8;
    function accionSelector(que) {
      if (que === 'empezar') empezarJuego();
      else if (que === 'pj') elegirPersonaje(1);
      else if (que === -1 || que === 1) elegirPersonaje(que);
    }
    window.addEventListener('pointermove', (e) => {
      if (!portada || portada.fase !== 'espera') return;
      const que = sobreSelector(e);
      portada.sobre = que === 'empezar';
      for (const f of portada.flechas) f.sobre = que === f.dir;
      canvas.style.cursor = que !== null ? 'pointer' : '';
    });
    window.addEventListener('pointerdown', (e) => {
      if (!portada) return;
      const que = sobreSelector(e);
      portada.down = que !== null ? { x: e.clientX, y: e.clientY, que } : null;
    });
    window.addEventListener('pointerup', (e) => {
      if (!portada || !portada.down) return;
      const d = Math.hypot(e.clientX - portada.down.x, e.clientY - portada.down.y), antes = portada.down.que;
      portada.down = null;
      if (d < 14 && portadaLista() && sobreSelector(e) === antes) accionSelector(antes);
    });
    window.addEventListener('pointercancel', () => { if (portada) portada.down = null; });

    function actualizarInicio(dt) {
      if (!portada) return;
      if (portada.fase === 'sale' && tiempo - portada.tSalida > CONFIG.inicio.salida) { portada = null; canvas.style.cursor = ''; document.getElementById('btnPausa').style.display = 'grid'; }
    }
    function dibujarInicio(t) {
      if (!portada) return;
      const S = CONFIG.inicio;
      if (portada.t0 === null) portada.t0 = t;
      const a = portada.fase === 'sale' ? 1 - suavizar(0, S.salida, t - portada.tSalida) : 1, tt = t - portada.t0;
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.globalAlpha = a; ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      const sp = juegoK.llave;
      // pinta una lista de cerebritos: vuelan desde lejos hasta su sitio y, ya quietos, tiemblan apenas
      const pintar = (lista, alfa, esc) => {
        if (alfa < 0.02) return;
        for (const b of lista) {
          const u = suavizar(0, 1, (tt - b.demora) / S.armado);
          if (u <= 0) continue;
          const f = (1 - u) * (1 - u);
          const x = b.x + b.sx * f + Math.sin(t * 2 + b.fase) * 0.6, y = b.y + b.sy * f + Math.sin(t * 1.7 + b.fase * 1.3) * 0.6;
          estamparEsc(sp[b.v], x, y, b.ang + f * 3, alfa * u * a, esc, true);
        }
      };
      for (const letra of portada.letras) pintar(letra, 1, S.escala);
      pintar(portada.suelo, 0.6, S.escala * 0.9);
      pintar(portada.hint, portada.sobre ? 1 : 0.6 + 0.3 * Math.sin(t * 2.2), portada.sobre ? 0.8 : 0.7);   // al pasar el mouse se enciende
      for (const f of portada.flechas) pintar(f.puntos, f.sobre ? 1 : 0.55 + 0.2 * Math.sin(t * 2.2 + f.dir), f.sobre ? 0.8 : 0.65);
      for (const grupo of portada.teclas) pintar(grupo, 0.7, 0.55);                                 // las instrucciones: discretas, siempre quietas

      // el selector: el personaje elegido (el de verdad, el mismo que luego se maneja) camina en el lugar y debajo un puntito por personaje
      const SEL = S.selector, ap = suavizar(1.2, 2.4, tt);
      if (ap > 0.02) {
        dibujarEnjambre(t, a * ap, (personaje.x - SEL.x) * k, (personaje.y - SEL.y) * k);
        if (PERSONAJES[sel].farol && luces) {                  // el halo blanco del farol (en el juego va sumado por encima de la oscuridad)
          const m = luces.brilloFarol, sx = (capaLuz.x - personaje.x + SEL.x) * k, sy = (capaLuz.y - personaje.y + SEL.y) * k;
          ctx.globalCompositeOperation = 'lighter';
          ctx.globalAlpha = a * ap * (0.9 + 0.1 * Math.sin(t * 5.3));
          ctx.drawImage(m.canvas, sx - m.r, sy - m.r, m.r * 2, m.r * 2);
          ctx.globalCompositeOperation = 'source-over';
        }
        portada.puntitos.forEach((q, i) => estamparEsc(sp[i % CONFIG.variaciones], q.x, q.y, i * 1.3, a * ap * (i === sel ? 1 : 0.45), i === sel ? 1.7 : 1.2, true));
      }
      ctx.globalAlpha = 1;
      ctx.setTransform(1, 0, 0, 1, 0, 0);
    }

    // ===== Pausa (tecla P o Esc) =====
    // Se congela todo: el reloj del juego (tiempo) se descuenta lo que dure la pausa, así los temporizadores siguen donde estaban
    const pausaEl = document.getElementById('pausa');
    const btnReanudar = document.getElementById('btnReanudar');
    const btnSitio = document.getElementById('btnSitio');
    btnSitio.href = CONFIG.pausa.urlSitio;
    let pausado = false, pausaT0 = null, pausaAcum = 0;
    function pausar() {
      if (pausado || portada) return;                          // en la pantalla de inicio no hay nada que pausar
      pausado = true;
      activas.clear(); soltarJoystick();
      pausaEl.style.display = 'flex';
      SND.pausa(true);
      btnReanudar.focus();
    }
    function reanudar() {
      if (!pausado) return;
      pausado = false;
      pausaEl.style.display = 'none';
      SND.pausa(false);
      canvas.focus({ preventScroll: true });
    }
    btnReanudar.addEventListener('click', reanudar);
    document.getElementById('btnPausa').addEventListener('click', pausar);
    // Reinicia la partida desde el nivel 1 y vuelve a la pantalla de inicio, con su selector de personaje (queda elegido el último
    // que se usó). iniciarNivel(0) ya cierra finales, piscina, paneles y llaves; el ambiente vuelve al del nivel 1.
    // Lo usan "Volver al inicio" (pausa) y "Jugar de nuevo" (final de SALVACIÓN).
    function irAlInicio() {
      transicion = null;
      activas.clear(); soltarJoystick();
      iniciarNivel(0);
      portada = construirInicio();
      canvas.style.cursor = '';
      document.getElementById('btnPausa').style.display = 'none';
      canvas.focus({ preventScroll: true });
    }
    function volverAlInicio() {
      if (!pausado) return;
      reanudar();
      irAlInicio();
    }
    document.getElementById('btnInicio').addEventListener('click', volverAlInicio);

    // Botón de los finales: tras ganar se vuelve a la pantalla de inicio (para elegir personaje); tras perder se reintenta
    // desde la sala de las dos puertas
    btnFinSitio.href = CONFIG.pausa.urlSitio;
    function accionFin() {
      if (!fin || !fin.listo) return;
      btnFin.style.display = 'none';
      if (fin.tipo === 'victoria') { irAlInicio(); return; }
      fin = null;
      SND.nivel(nivelActual);                                // vuelve el ambiente
      flechasEl.style.display = 'none';
      for (const p of PUERTAS) if (p.tipo === 'S' || p.tipo === 'X') { p.abierta = false; p.tAbrir = 0; p.sacudirHasta = 0; p.superada = false; }
      const d = PUERTAS.find((p) => p.tipo === 'D');
      personaje.x = ((d ? d.c : inicio.c) + 0.5) * T; personaje.y = ((d ? d.r : inicio.r) - 0.5) * T;
      personaje.vx = personaje.vy = 0; personaje.amp = 0; personaje.giro = Math.PI;
      enjambreIniciado = false; cam.iniciada = false; explosiones = [];
      transicion = { t0: tiempo, destino: -1, cargado: true, t1: tiempo };      // reaparece con un fundido
      canvas.focus({ preventScroll: true });
    }
    btnFin.addEventListener('click', accionFin);
    // El final avanza solo: la derrota se come al personaje y se va a negro; la victoria se vuelve luz y luego un letrero
    function actualizarFin(t) {
      if (!fin) return;
      const tt = t - fin.t0;
      if (fin.tipo === 'derrota') {
        if (fin.fase === 'amenaza') {                                    // latido en cada número de la cuenta y aviso al aparecer las flechas
          const n = Math.floor((t - fin.tCombo) / CONFIG.final.segundosPorNumero);
          if (t >= fin.tCombo && n < 3 && n > fin.sndCuenta) { fin.sndCuenta = n; SND.cuenta(n); }
          if (!fin.sndFlechas && t >= fin.tFlechas) { fin.sndFlechas = true; SND.alerta(); }
        }
        if (fin.fase === 'amenaza' && t >= fin.tLimite) devorar();       // se acabó el tiempo de la combinación: te devora
        if (fin.fase === 'comido' && !fin.listo && t - fin.tc > 4.2) {
          fin.listo = true;
          btnFin.textContent = 'Intentar de nuevo'; btnFin.style.display = 'block'; btnFin.focus();
        }
        if (fin.fase === 'salvado' && t - fin.tS > 2) fin = null;           // el cerebro ya no está: el personaje vuelve a ser libre
        return;
      }
      if (fin.tipo === 'victoria') {
        if (!fin.texto && tt > 1.6) {                         // sobre el negro, el letrero se va escribiendo con cerebritos blancos
          fin.texto = crearTextoEnRegion('SALVACIÓN', 140, 210, 1000, 300, { set: 'llave', pantalla: true, tamMax: 200, paso: 7, max: 3200, origenX: 640, origenY: 360 });
          fin.texto.t0 = t;
        }
        if (fin.texto && !fin.listo && t - fin.texto.t0 > 4) {
          fin.listo = true;
          btnFin.textContent = 'Jugar de nuevo'; btnFin.style.display = 'block'; btnFin.focus();
          btnFinSitio.style.display = 'block';
        }
      }
    }

    // Pasar por encima de una llave la agarra: la verdadera se guarda; una falsa explota y desaparece
    function recogerLlaves() {
      if (transicion) return;
      for (const l of llaves) {
        if (!llaveAlAlcance(l)) continue;
        if (Math.hypot(personaje.x - l.x, personaje.y - l.y) > CONFIG.llaves.recoger) continue;
        l.tFin = tiempo;
        if (l.real) { l.estado = 'recogida'; tieneLlave = true; SND.llave(); }
        else { l.estado = 'explotada'; explotarLlave(l); }
      }
    }
    // El portal se enciende cuando se abre la puerta final
    const salidaActiva = () => salida && (!salida.puerta || salida.puerta.abierta);

    // ===== El cerebro malvado escribe en el suelo =====
    // La frase se rasteriza con la letra más grande que quepa en la región, y cada punto de las letras
    // pasa a ser un cerebrito rojo que sale volando desde el cuadro hasta su sitio, en orden de lectura.
    // Opciones (o): set ('mal' rojo o 'llave' blanco), alfa, estatico (ya escrito, sin animación), paso, max, margen, tamMax,
    // origenX/origenY (de dónde salen volando) y pantalla (se dibuja pegado a la pantalla, no al mundo).
    function crearTextoEnRegion(frase, x0, y0, w, h, o = {}) {
      const margen = o.margen !== undefined ? o.margen : 16;
      const cv = document.createElement('canvas');
      cv.width = w; cv.height = h;
      const g = cv.getContext('2d', { willReadFrequently: true });
      const familia = '"Arial Black", Impact, "Arial Bold", Arial, sans-serif';
      const palabras = frase.toLocaleUpperCase('es').split(/\s+/);

      // la letra más grande para la que el texto, partido en líneas, cabe en la región
      let ajuste = null;
      for (let size = o.tamMax || 150; size >= 10 && !ajuste; size -= 2) {
        g.font = '900 ' + size + 'px ' + familia;
        const maxW = w - margen * 2, lineas = [];
        let linea = '';
        for (const p of palabras) {
          const prueba = linea ? linea + ' ' + p : p;
          if (g.measureText(prueba).width <= maxW) linea = prueba;
          else { if (linea) lineas.push(linea); linea = p; }
        }
        if (linea) lineas.push(linea);
        if (lineas.some((l) => g.measureText(l).width > maxW)) continue;          // una palabra más ancha que la región
        const lh = size * 1.1;
        if (lineas.length * lh <= h - margen * 2) ajuste = { size, lineas, lh };
      }
      if (!ajuste) return null;

      g.font = '900 ' + ajuste.size + 'px ' + familia;
      g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillStyle = '#fff'; g.strokeStyle = '#fff'; g.lineJoin = 'round';
      g.lineWidth = ajuste.size * 0.05;                       // un poco más gruesas: así las letras quedan bien llenas
      const arranque = h / 2 - ((ajuste.lineas.length - 1) / 2) * ajuste.lh;
      ajuste.lineas.forEach((l, i) => { g.strokeText(l, w / 2, arranque + i * ajuste.lh); g.fillText(l, w / 2, arranque + i * ajuste.lh); });
      const datos = g.getImageData(0, 0, w, h).data;

      // cerebritos sobre una cuadrícula escalonada, solo donde hay letra; si salen demasiados, se separan más
      const rng = crearRng(CONFIG.semilla + 211);
      let paso = o.paso || CONFIG.texto.paso, brains;
      for (let intento = 0; intento < 8; intento++) {
        brains = [];
        for (let j = 0, y = paso / 2; y < h; j++, y += paso * 0.88) {
          for (let x = (j % 2) * paso / 2 + paso / 2; x < w; x += paso) {
            if (datos[((Math.floor(y) * w) + Math.floor(x)) * 4 + 3] < 128) continue;
            const linea = Math.max(0, Math.min(ajuste.lineas.length - 1, Math.floor((y - (arranque - ajuste.lh / 2)) / ajuste.lh)));
            brains.push({
              x: x0 + x + (rng() - 0.5) * 1.6, y: y0 + y + (rng() - 0.5) * 1.6, v: Math.floor(rng() * CONFIG.variaciones),
              ang: (rng() - 0.5) * 2.4, fase: rng() * 6.283, orden: linea * 100000 + x, vuelo: 0.75 + rng() * 0.5
            });
          }
        }
        if (brains.length <= (o.max || CONFIG.texto.maxCerebritos)) break;
        paso *= 1.12;
      }
      // el orden de lectura: línea por línea, de izquierda a derecha
      brains.sort((a, b) => a.orden - b.orden);
      brains.forEach((b, i) => { b.demora = (i / brains.length) * CONFIG.texto.escribir; });

      return {
        t0: tiempo, x0, y0, w, h, brains, origenX: o.origenX !== undefined ? o.origenX : x0 + w / 2, origenY: o.origenY !== undefined ? o.origenY : y0 + h / 2,
        centroX: x0 + w / 2, centroY: y0 + h / 2,
        set: o.set || 'mal', alfa: o.alfa !== undefined ? o.alfa : 1, pantalla: !!o.pantalla,
        total: o.estatico ? 0 : CONFIG.texto.escribir + CONFIG.texto.vuelo * 1.25,   // cuando el último ya aterrizó
        bake: null, bakeK: 0                                        // imagen ya terminada, para no dibujar miles de cerebritos por cuadro
      };
    }
    // El texto que escribe el cuadro en el suelo, ocupando la región (en celdas) que define el nivel
    function crearTextoSuelo(def, cuadro) {
      const R = def.region;
      return crearTextoEnRegion(def.frase, R.c0 * T, R.r0 * T, (R.c1 - R.c0 + 1) * T, (R.r1 - R.r0 + 1) * T, { origenX: cuadro.cx, origenY: cuadro.cy });
    }

    // Cosas con las que se puede interactuar y desde dónde (punto en el mundo). Devuelve la más cercana.
    function buscarInteraccion() {
      if (portada || transicion || fin || panelEstado.abierto) return null;
      const p = personaje;
      let mejor = null, mejorD = Infinity;
      const probar = (tipo, ref, x, y, radio, hx, hy) => {
        const d = Math.hypot(p.x - x, p.y - y);
        if (d < radio && d < mejorD) { mejorD = d; mejor = { tipo, ref, hx, hy, d, radio }; }
      };
      for (const pu of PUERTAS) {
        if (pu.abierta) continue;
        // la marca de E se pone bien arriba, por encima de la cabeza del personaje, para que su cuerpo no la tape
        probar('puerta', pu, (pu.c + 0.5) * T, (pu.r + 1) * T + 25, CONFIG.interaccion.puerta, (pu.c + 0.5) * T, pu.r * T - 88);
      }
      for (const pa of PALANCAS) {
        if (pa.estado === 'abajo') continue;
        probar('palanca', pa, pa.x, (pa.r + 1) * T + 25, CONFIG.palancas.alcance, pa.x, pa.r * T - 88);
      }
      if (PANEL && !puzzleResuelto) probar('panel', PANEL, PANEL.x, (PANEL.r + 1) * T + 25, CONFIG.interaccion.panel, PANEL.x, PANEL.r * T - 88);
      for (const q of CUADROS) probar('cuadro', q, q.cx, q.y1 + 30, CONFIG.interaccion.cuadro, q.cx, q.y0 - 26);
      if (salidaActiva()) probar('salida', salida, salida.x, salida.y, CONFIG.interaccion.salida, salida.x, salida.y - 56);
      return mejor;
    }

    function interactuar() {
      const f = buscarInteraccion();
      if (!f) return;
      if (f.tipo === 'puerta') {
        const pu = f.ref;
        // SALVACIÓN no se abre hasta superar la prueba de la otra puerta (ESPERANZA); la puerta final, hasta resolver su puzzle
        const salvacionCerrada = pu.tipo === 'S' && !PUERTAS.some((q) => q.tipo === 'X' && q.superada);
        if ((pu.tipo === 'D' && !puertaFinalAbre()) || salvacionCerrada) {       // aún cerrada: tiembla
          pu.sacudirHasta = tiempo + CONFIG.puertaTembloroTiempo;
          SND.puertaCerrada();
        } else {
          if (pu.tipo === 'D' && !puzzleTipo) tieneLlave = false;   // la llave se gasta en la puerta final
          pu.abierta = true; pu.tAbrir = tiempo;           // los cuartitos se abren sin llave
          SND.puertaAbre(0);
          if (pu.tipo === 'X') SND.angeles();              // ESPERANZA: suena celestial (es la trampa)
        }
      } else if (f.tipo === 'palanca') {
        tirarPalanca(f.ref);
      } else if (f.tipo === 'panel') {
        abrirPanel();
      } else if (f.tipo === 'cuadro') {
        f.ref.pulso = 1;                                   // el cuadro reacciona
        f.ref.usado = true;                                // y su E flotante se apaga para siempre (en este nivel)
        if (textoListo && !textoSuelo) { textoSuelo = textoListo; textoSuelo.t0 = tiempo; SND.cuadro(); }   // y escribe en el suelo (una sola vez)
      } else if (f.tipo === 'salida') {
        SND.portal();
        transicion = { t0: tiempo, destino: f.ref.destino, cargado: false, t1: 0 };
      }
    }

    // ===== Construcción del escenario (se dibuja UNA vez en canvas aparte) =====
    // Coordenadas del caché: x = mundoX * kc ; y = mundoY * kc
    function poner(g, spr, x, y, ang, alfa, kc) {
      const co = Math.cos(ang) * kc, si = Math.sin(ang) * kc;
      g.globalAlpha = alfa;
      g.setTransform(co, si, -si, co, x * kc, y * kc);
      g.drawImage(spr.canvas, -spr.w / 2, -spr.h / 2, spr.w, spr.h);
    }

    function construirMundo(kc) {
      const t0 = performance.now();
      const V = CONFIG.variaciones;
      const juego = crearJuegoEscenario(kc, ['muro', 'techo', 'suelo', 'relieve', 'mal', 'oro']);
      const crear = (w, h) => {
        const cv = document.createElement('canvas');
        cv.width = Math.ceil(w * kc);
        cv.height = Math.ceil(h * kc);
        return cv;
      };
      const suelo = crear(COLS * T, FILAS * T), muros = crear(COLS * T, FILAS * T);
      const gs = suelo.getContext('2d'), gm = muros.getContext('2d');
      const elegir = (set, g) => set[Math.floor(g() * V)];

      // --- Piso: cerebritos diminutos en las esquinas de las celdas, grietas y grabados sueltos
      for (let r = 0; r <= FILAS; r++) {
        for (let c = 0; c <= COLS; c++) {
          if (!(decorable(c - 1, r - 1) || decorable(c, r - 1) || decorable(c - 1, r) || decorable(c, r))) continue;
          const g = rngCelda(c, r, 11);
          poner(gs, elegir(juego.suelo, g), c * T + (g() - 0.5) * 3, r * T + (g() - 0.5) * 3,
            (g() - 0.5) * 1.4, 0.42 + g() * 0.18, kc);
        }
      }
      for (let r = 0; r < FILAS; r++) {
        for (let c = 0; c < COLS; c++) {
          if (!decorable(c, r)) continue;
          const g = rngCelda(c, r, 23);
          const n = g() < 0.35 ? (g() < 0.4 ? 2 : 1) : 0;
          for (let i = 0; i < n; i++) {
            poner(gs, elegir(juego.suelo, g), c * T + 10 + g() * (T - 20), r * T + 10 + g() * (T - 20),
              (g() - 0.5) * 3, 0.26, kc);
          }
          if (g() < 0.07) {                                   // grabado grande y tenue en el piso
            poner(gs, elegir(juego.relieve, g), (c + 0.5) * T + (g() - 0.5) * 14, (r + 0.5) * T + (g() - 0.5) * 14,
              (g() - 0.5) * 1.2, 0.1, kc);
          }
        }
      }

      // --- Muros. Cada uno se queda dentro de su celda:
      //     con piso (o puerta) al sur muestra su fachada de ladrillos; con otro muro al sur, solo su techo plano.
      const pasoTecho = T / 9;                                // 9 x 9 cerebritos por techo
      const filasCara = 10, pasoFilaCara = T / filasCara;     // ladrillos de 10 hileras
      const colsCara = 10, pasoColCara = T / colsCara;
      for (let r = 0; r < FILAS; r++) {
        for (let c = 0; c < COLS; c++) {
          if (!esMuro(c, r)) continue;
          const g = rngCelda(c, r, 37);
          const abierto = {
            n: !muroVisual(c, r - 1), s: !muroVisual(c, r + 1), o: !muroVisual(c - 1, r), e: !muroVisual(c + 1, r)
          };

          if (!abierto.s) {
            // Techo plano: bordes abiertos brillantes; adentro, cerebritos sueltos y tenues
            const x0 = c * T, y0 = r * T;
            for (let j = 0; j < 9; j++) {
              for (let i = 0; i < 9; i++) {
                const borde = (j === 0 && abierto.n) || (i === 0 && abierto.o) || (i === 8 && abierto.e);
                if (!borde && g() < 0.45) continue;
                poner(gm, elegir(juego.techo, g), x0 + (i + 0.5) * pasoTecho + (g() - 0.5) * 1.2,
                  y0 + (j + 0.5) * pasoTecho + (g() - 0.5) * 1.2, (g() - 0.5) * 1.6,
                  borde ? 0.9 : 0.3 + g() * 0.12, kc);
              }
            }
          } else {
            // Fachada: ladrillos de cerebritos escalonados
            const yCara = r * T;
            for (let j = 0; j < filasCara; j++) {
              const desf = (j % 2) * pasoColCara / 2;
              for (let i = 0; i < colsCara; i++) {
                const x = c * T + (i + 0.5) * pasoColCara + desf;
                if (x > (c + 1) * T - 1) continue;
                const y = yCara + (j + 0.5) * pasoFilaCara;
                if (dentroDeCuadro(x, y)) continue;            // el interior de un cuadro queda oscuro
                const borde = j === 0 || j === filasCara - 1 ||
                  (i === 0 && abierto.o && j % 2 === 0) || (i === colsCara - 1 && abierto.e && j % 2 === 1);
                if (!borde && g() < 0.12) continue;           // huecos: textura de mampostería vieja
                poner(gm, elegir(juego.muro, g), x + (g() - 0.5) * 1.2, y + (g() - 0.5) * 1.2,
                  (g() - 0.5) * 1.8, borde ? 0.85 : 0.36 + g() * 0.16, kc);
              }
            }
            if (g() < 0.14 && car(c, r) === '#' && !CUADROS.some((q) => c >= q.c && c < q.c + q.w && r === q.r)) {   // cerebro grande tallado
              poner(gm, elegir(juego.relieve, g), (c + 0.5) * T, yCara + T / 2, (g() - 0.5) * 0.5, 0.24, kc);
            }
          }
        }
      }

      // --- Cuadros: marco de cerebritos y el cerebro malvado completo, apenas insinuado, como un boceto
      for (const q of CUADROS) {
        const g = rngCelda(q.c, q.r, 53);
        const perimetro = [];
        const paso = 8;
        for (let x = q.x0; x <= q.x1; x += paso) { perimetro.push([x, q.y0]); perimetro.push([x, q.y1]); }
        for (let y = q.y0 + paso; y < q.y1; y += paso) { perimetro.push([q.x0, y]); perimetro.push([q.x1, y]); }
        for (const [x, y] of perimetro) {
          poner(gm, elegir(juego.muro, g), x, y, (g() - 0.5) * 1.5, 0.8, kc);
        }
        CEREBRO_MALO.forEach(([px, py], i) => {              // lo que falta por dibujar: muy tenue
          if (i < q.reveladas) return;
          poner(gm, elegir(juego.mal, g), q.cx + px * q.rx, q.cy + py * q.rx, (g() - 0.5) * 1.5, 0.12, kc);
        });
      }
      // --- Paneles de las palancas y del código: un marco de cerebritos que los encuadra en la fachada
      for (const pa of paneles()) {
        const g = rngCelda(pa.c, pa.r, 61);
        const px0 = pa.c * T + 14, px1 = (pa.c + (pa.w || 1)) * T - 14, py0 = pa.r * T + 6, py1 = (pa.r + 1) * T - 6;
        for (let x = px0; x <= px1 + 0.1; x += 7) { poner(gm, elegir(juego.muro, g), x, py0, (g() - 0.5) * 1.5, 0.78, kc); poner(gm, elegir(juego.muro, g), x, py1, (g() - 0.5) * 1.5, 0.78, kc); }
        for (let y = py0 + 7; y < py1; y += 7) { poner(gm, elegir(juego.muro, g), px0, y, (g() - 0.5) * 1.5, 0.78, kc); poner(gm, elegir(juego.muro, g), px1, y, (g() - 0.5) * 1.5, 0.78, kc); }
      }
      gs.globalAlpha = 1; gm.globalAlpha = 1;

      // --- Bloque de cada puerta (fachada + disfraz del cuarto): una imagen lista para pegar mientras está cerrada
      for (const p of PUERTAS) {
        let c0 = p.c, c1 = p.c, r0 = p.r, r1 = p.r;
        for (const [c, r] of p.cubre) { c0 = Math.min(c0, c); c1 = Math.max(c1, c); r0 = Math.min(r0, r); r1 = Math.max(r1, r); }
        const bx = c0 * T, by = r0 * T, bw = (c1 - c0 + 1) * T, bh = (r1 - r0 + 1) * T;
        const cv = crear(bw, bh);
        const g = cv.getContext('2d');
        for (const b of p.brains) {
          if (b.dinamica) continue;                          // la cerradura dorada se dibuja aparte, titilando
          const s = juego[b.set][b.v];
          const co = Math.cos(b.ang) * kc, si = Math.sin(b.ang) * kc;
          g.globalAlpha = b.alfa;
          g.setTransform(co, si, -si, co, (b.x - bx) * kc, (b.y - by) * kc);
          g.drawImage(s.canvas, -s.w / 2, -s.h / 2, s.w, s.h);
        }
        g.globalAlpha = 1;
        p.bloque = { canvas: cv, x: bx, y: by, w: bw, h: bh };
      }

      msMundo = performance.now() - t0;
      return { kc, suelo, muros };
    }

    // ===== Luces =====
    // Máscara de luz: blanca y opaca al centro, transparente en el borde. Se usa para "borrar" la oscuridad.
    function crearMascaraLuz(radioLogico) {
      const R = radioLogico * k, D = Math.ceil(R * 2);
      const cv = document.createElement('canvas');
      cv.width = D; cv.height = D;
      const g = cv.getContext('2d');
      const grad = g.createRadialGradient(D / 2, D / 2, 0, D / 2, D / 2, D / 2);
      grad.addColorStop(0, 'rgba(255,255,255,1)');
      grad.addColorStop(0.22, 'rgba(255,255,255,0.97)');
      grad.addColorStop(0.55, 'rgba(255,255,255,0.6)');
      grad.addColorStop(0.8, 'rgba(255,255,255,0.2)');
      grad.addColorStop(1, 'rgba(255,255,255,0)');
      g.fillStyle = grad;
      g.fillRect(0, 0, D, D);
      return { canvas: cv, r: R };
    }
    // Resplandor rojo (se suma encima de lo que ya está dibujado)
    function crearBrilloRojo(radioLogico) {
      const R = radioLogico * k, D = Math.ceil(R * 2);
      const cv = document.createElement('canvas');
      cv.width = D; cv.height = D;
      const g = cv.getContext('2d');
      const grad = g.createRadialGradient(D / 2, D / 2, 0, D / 2, D / 2, D / 2);
      grad.addColorStop(0, 'rgba(200,36,30,0.5)');
      grad.addColorStop(0.4, 'rgba(160,26,22,0.2)');
      grad.addColorStop(1, 'rgba(120,16,14,0)');
      g.fillStyle = grad;
      g.fillRect(0, 0, D, D);
      return { canvas: cv, r: R };
    }
    // Resplandor dorado (se suma encima de lo que ya está dibujado)
    function crearBrilloOro(radioLogico) {
      const R = radioLogico * k, D = Math.ceil(R * 2);
      const cv = document.createElement('canvas');
      cv.width = D; cv.height = D;
      const g = cv.getContext('2d');
      const grad = g.createRadialGradient(D / 2, D / 2, 0, D / 2, D / 2, D / 2);
      grad.addColorStop(0, 'rgba(235,185,70,0.42)');
      grad.addColorStop(0.35, 'rgba(210,160,55,0.16)');
      grad.addColorStop(1, 'rgba(180,130,40,0)');
      g.fillStyle = grad;
      g.fillRect(0, 0, D, D);
      return { canvas: cv, r: R };
    }
    // Resplandor blanco neutro (se suma encima): el halo del farol
    function crearBrilloBlanco(radioLogico, alfa) {
      const R = radioLogico * k, D = Math.ceil(R * 2);
      const cv = document.createElement('canvas');
      cv.width = D; cv.height = D;
      const g = cv.getContext('2d');
      const grad = g.createRadialGradient(D / 2, D / 2, 0, D / 2, D / 2, D / 2);
      grad.addColorStop(0, 'rgba(255,255,255,' + alfa + ')');
      grad.addColorStop(0.4, 'rgba(255,255,255,' + alfa * 0.4 + ')');
      grad.addColorStop(1, 'rgba(255,255,255,0)');
      g.fillStyle = grad;
      g.fillRect(0, 0, D, D);
      return { canvas: cv, r: R };
    }
    function construirLuces() {
      return {
        farol: crearMascaraLuz(CONFIG.luz.farol.radio),
        brilloFarol: crearBrilloBlanco(CONFIG.luz.farol.resplandor, CONFIG.luz.farol.brillo),
        cerradura: crearMascaraLuz(160),
        brilloOro: crearBrilloOro(120),
        personaje: crearMascaraLuz(CONFIG.luz.radio),
        llave: crearMascaraLuz(130),
        cuadro: crearMascaraLuz(260),
        portal: crearMascaraLuz(230),
        texto: crearMascaraLuz(470),
        brilloCuadro: crearBrilloRojo(300)
      };
    }

    // ===== Tamaño del canvas =====
    let temporizadorMundo = 0;
    let anchoPrevio = 0;
    function reconstruirMundo() {
      const kc = Math.min(k, Math.sqrt(CONFIG.cacheMaxPx / (COLS * T * FILAS * T)));   // tope de memoria
      mundo = construirMundo(kc);
    }
    function ajustar() {
      const dpr = Math.min(window.devicePixelRatio || 1, CONFIG.dprMax);
      const ancho = canvas.getBoundingClientRect().width;
      // si el contenedor aún no tiene tamaño (p. ej. un iframe que recién carga) no se construye nada
      if (ancho < 32 || Math.abs(ancho * dpr - anchoPrevio) < 1) return;
      anchoPrevio = ancho * dpr;
      canvas.width = Math.round(ancho * dpr);
      canvas.height = Math.round(ancho * dpr * CONFIG.logico.h / CONFIG.logico.w);
      k = canvas.width / CONFIG.logico.w;
      // todo lo que depende de k se vuelve a pre-renderizar a la nueva escala
      spritesPers = crearSprites(CONFIG.tamCerebrito, k, CONFIG.grosorMin);
      juegoK = crearJuegoEscenario(k, ['polvo', 'rasgo', 'llave', 'mal', 'muro', 'techo', 'relieve', 'oro', 'pasto', 'slot0', 'slot1', 'slot2',
        'capaXsTenue', 'capaXsBrillo', 'capaS', 'capaSBrillo', 'capaFarol']);
      pincel = crearPincel();
      // los cerebros de las palancas: cinco tamaños, cada uno en blanco (sin tirar), dorado (bien tirada) y rojo (error)
      juegoK.glifos = { blanco: [], oro: [], mal: [] };
      for (const tam of CONFIG.glifos) {
        juegoK.glifos.blanco.push(crearSprites(tam, k, 0.8));
        juegoK.glifos.oro.push(crearSprites(tam, k, 0.8, CONFIG.colorOro));
        juegoK.glifos.mal.push(crearSprites(tam, k, 0.8, CONFIG.colorMal));
      }
      luces = construirLuces();
      capaOscura = document.createElement('canvas');
      capaOscura.width = canvas.width;
      capaOscura.height = canvas.height;
      // el escenario es lo más pesado: la primera vez se hace ya; al cambiar de tamaño, con un pequeño retraso
      clearTimeout(temporizadorMundo);
      if (!mundo) reconstruirMundo();
      else temporizadorMundo = setTimeout(reconstruirMundo, 200);
    }
    // Se reajusta cada vez que el canvas cambia de tamaño (ventana, iframe, zoom); también la primera vez
    new ResizeObserver(ajustar).observe(canvas);

    // ===== Lógica =====
    // ¿La caja de los pies en (x, y) toca algo sólido?
    function chocaCaja(x, y) {
      const hw = CONFIG.colision.mitadAncho, hd = CONFIG.colision.mitadFondo;
      const c0 = Math.floor((x - hw) / T), c1 = Math.floor((x + hw) / T);
      const r0 = Math.floor((y - hd) / T), r1 = Math.floor((y + hd) / T);
      for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) if (solido(c, r)) return true;
      return false;
    }

    // Mueve por ejes separados: así se desliza a lo largo de las paredes en vez de quedarse pegado
    function mover(p, dt) {
      const hw = CONFIG.colision.mitadAncho, hd = CONFIG.colision.mitadFondo, eps = 0.01;

      let nx = p.x + p.vx * dt;
      if (chocaCaja(nx, p.y)) {
        nx = p.vx > 0 ? Math.floor((nx + hw) / T) * T - hw - eps : (Math.floor((nx - hw) / T) + 1) * T + hw + eps;
        p.vx = 0;
      }
      p.x = nx;

      let ny = p.y + p.vy * dt;
      if (chocaCaja(p.x, ny)) {
        ny = p.vy > 0 ? Math.floor((ny + hd) / T) * T - hd - eps : (Math.floor((ny - hd) / T) + 1) * T + hd + eps;
        p.vy = 0;
      }
      p.y = ny;
    }

    let medioCiclo = 0;                                           // en qué mitad del ciclo de caminata va (para los pasos)
    let velCam = 0;                                               // rapidez con que se anima la caminata (px/s): la real, o la de mentira en la pantalla de inicio
    function actualizarPersonaje(dt) {
      const p = personaje;
      let ix, iy;
      if (portada || transicion || fin || panelEstado.abierto || (piscina && piscina.fase !== 'libre')) {   // durante un fundido, un final, el panel o la piscina (armándose o deshaciéndolo) no se maneja
        ix = 0; iy = 0;
      } else if (joy.id !== null) {                                // dedo: entrada analógica con zona muerta
        const m = Math.hypot(joy.x, joy.y);
        const f = m < 0.15 ? 0 : (m - 0.15) / 0.85 / m;
        ix = joy.x * f; iy = joy.y * f;
      } else {                                                     // teclado
        ix = (activas.has('der') ? 1 : 0) - (activas.has('izq') ? 1 : 0);
        iy = (activas.has('abajo') ? 1 : 0) - (activas.has('arriba') ? 1 : 0);
        if (ix && iy) { ix *= Math.SQRT1_2; iy *= Math.SQRT1_2; }   // la diagonal no va más rápido
      }

      // velocidad con aceleración suave
      const a = suavizado(CONFIG.acel, dt);
      p.vx += (ix * CONFIG.velMax - p.vx) * a;
      p.vy += (iy * CONFIG.velMax - p.vy) * a;

      mover(p, dt);

      const vel = Math.hypot(p.vx, p.vy);

      // dirección de caminata suavizada (no se normaliza: al invertir el sentido pasa por cero y la zancada se acorta sola)
      if (vel > 20) {
        const d = suavizado(12, dt);
        p.dirX += (p.vx / vel - p.dirX) * d;
        p.dirY += (p.vy / vel - p.dirY) * d;

        // hacia dónde mira: gira por el camino más corto (al dar la vuelta pasa por el perfil)
        let dif = Math.atan2(p.vx, p.vy) - p.giro;
        dif = Math.atan2(Math.sin(dif), Math.cos(dif));
        p.giro += dif * suavizado(CONFIG.giro.rapidez, dt);
      }

      // en la pantalla de inicio el personaje se luce en el selector: camina en el lugar a ratos y gira un poco a los lados
      // (al empezar, vuelve a mirar de frente y se queda quieto)
      let velAnim = vel;
      if (portada) {
        const vivo = portada.fase === 'espera' ? 1 : 0;
        velAnim = vivo * CONFIG.velMax * 0.7 * Math.max(0, Math.sin(tiempo * 0.8));
        p.giro += (vivo * 0.55 * Math.sin(tiempo * 0.5) - p.giro) * suavizado(3, dt);
        p.dirX = Math.sin(p.giro); p.dirY = Math.cos(p.giro);
      }

      velCam = velAnim;
      // intensidad de la caminata y avance de la fase según lo recorrido
      p.amp += (Math.min(1, velAnim / CONFIG.velMax) - p.amp) * suavizado(CONFIG.mezcla, dt);
      p.fase = (p.fase + velAnim * CONFIG.cadencia * dt) % (Math.PI * 2);
      // un paso cada medio ciclo de la caminata (cuando un pie toca el suelo)
      const medio = Math.floor(p.fase / Math.PI);
      if (medio !== medioCiclo) { medioCiclo = medio; if (p.amp > 0.25 && !transicion && !portada) SND.paso(p.amp); }
    }

    // Cámara que sigue al personaje con suavizado y un poco de adelanto hacia donde camina
    function actualizarCamara(dt) {
      const p = personaje;
      const W = CONFIG.logico.w, Hh = CONFIG.logico.h;
      const mirarX = p.x + p.vx * CONFIG.camara.adelanto;
      const mirarY = p.y - CONFIG.alturaPersonaje * 0.5 + p.vy * CONFIG.camara.adelanto;

      // límites del mundo: si es más chico que la pantalla, se centra
      const ajustarEje = (obj, tamPantalla, minMundo, tamMundo) => {
        const objetivo = obj - tamPantalla / 2;
        if (tamMundo <= tamPantalla) return minMundo - (tamPantalla - tamMundo) / 2;
        return limitar(objetivo, minMundo, minMundo + tamMundo - tamPantalla);
      };
      const tx = ajustarEje(mirarX, W, 0, COLS * T);
      const ty = ajustarEje(mirarY, Hh, 0, FILAS * T);

      if (!cam.iniciada) { cam.x = tx; cam.y = ty; cam.iniciada = true; }
      else {
        const a = suavizado(CONFIG.camara.suavizado, dt);
        cam.x += (tx - cam.x) * a;
        cam.y += (ty - cam.y) * a;
      }
      // en píxeles reales enteros: el escenario no tiembla ni se emborrona al moverse
      cam.px = Math.round(cam.x * k);
      cam.py = Math.round(cam.y * k);
    }

    // Calcula la pose del esqueleto (PX, PY) a partir de la caminata procedural
    function calcularPose() {
      const p = personaje;
      const H = CONFIG.alturaPersonaje;
      const amp = p.amp;
      const rebote = CONFIG.rebote * H * amp * (1 + Math.cos(2 * p.fase)) / 2;

      // giro del cuerpo: lo lateral se proyecta con el coseno, lo que está adelante con el seno
      const cs = Math.cos(p.giro), sn = Math.sin(p.giro);
      vista.cs = cs; vista.sn = sn;
      vista.torso = Math.hypot(cs, CONFIG.giro.perfilTorso * sn);       // 1 de frente/espalda, ~0.42 de perfil
      vista.frente = suavizar(0.15, 0.6, cs);
      vista.espalda = suavizar(0.15, 0.6, -cs);
      vista.ojos = suavizar(-0.45, 0.25, cs);
      vista.perfil = suavizar(0.35, 0.9, Math.abs(sn));
      vista.ancho = suavizar(0.1, 0.7, Math.abs(cs));

      for (let i = 0; i < N_PUNTOS; i++) {
        const w = PESO_INCLINACION[i] * CONFIG.inclinacion * H * amp;
        const lx = REPOSO[i][0];
        PX[i] = p.x + (lx * cs + Math.sign(lx) * ESCALON[i] * sn) * H + p.dirX * w;
        PY[i] = p.y + REPOSO[i][1] * H + p.dirY * w;
        if (i <= HUESO.caderaD) PY[i] -= rebote;               // el cuerpo rebota; las piernas no
      }

      // piernas en contrafase y brazos opuestos a la pierna del mismo lado
      for (let lado = 0; lado < 2; lado++) {
        const fase = p.fase + lado * Math.PI;
        const vaiven = Math.sin(fase);                         // adelante / atrás
        const alzado = Math.max(0, Math.cos(fase));            // el pie solo se levanta al ir adelante

        const rodilla = HUESO.rodillaI + lado, pie = HUESO.pieI + lado;
        const codo = HUESO.codoI + lado, mano = HUESO.manoI + lado;

        const z = CONFIG.zancada * H * vaiven * amp;
        PX[rodilla] += p.dirX * z * 0.5;
        PY[rodilla] += p.dirY * z * 0.5 - alzado * CONFIG.levante * H * 0.8 * amp;
        PX[pie] += p.dirX * z;
        PY[pie] += p.dirY * z - alzado * CONFIG.levante * H * amp;

        const b = -CONFIG.brazos * H * vaiven * amp;
        PX[codo] += p.dirX * b * 0.5;
        PY[codo] += p.dirY * b * 0.5;
        PX[mano] += p.dirX * b;
        PY[mano] += p.dirY * b;
      }
    }

    // Objetivo de un cerebrito sobre el esqueleto. Devuelve [x, y] en px lógicos.
    const objetivo = [0, 0];
    function calcularObjetivo(c) {
      const H = CONFIG.alturaPersonaje;
      if (c.tipo === 1) {                                      // anillo (cabeza)
        objetivo[0] = PX[c.a] + Math.cos(c.ang) * c.radio * H;
        objetivo[1] = PY[c.a] + Math.sin(c.ang) * c.radio * H * 1.1;
        return;
      }
      if (c.tipo === 2) {                                      // racimo (manos)
        objetivo[0] = PX[c.a] + c.ox * H;
        objetivo[1] = PY[c.a] + c.oy * H;
        return;
      }
      if (c.tipo === 3) {                                      // rasgo 3D: lateral con cos, adelante con sen
        objetivo[0] = PX[c.a] + (c.lx * vista.cs + c.lz * vista.sn) * H;
        objetivo[1] = PY[c.a] + (c.ly + c.lz * vista.cs * CONFIG.giro.profundidad) * H;
        return;
      }
      const ax = PX[c.a], ay = PY[c.a];
      const dx = PX[c.b] - ax, dy = PY[c.b] - ay;
      const len = Math.hypot(dx, dy) || 1;
      const desp = c.signo * c.w * H * (c.esc ? vista.torso : 1);   // desplazamiento perpendicular al hueso
      objetivo[0] = ax + dx * c.t - (dy / len) * desp;
      objetivo[1] = ay + dy * c.t + (dx / len) * desp;
    }

    // Los personajes generados (encapuchado, cerebro...): prepara el contexto de este cuadro y calcula el sitio de todos sus cerebritos (capaX, capaY, capaSet)
    function generarCapa(dt) {
      const p = personaje, c = capaCtx;
      if (!enjambreIniciado) { capaHist.length = 0; capaFase = p.fase; capaYaw = p.giro; capaYawVel = 0; }   // tras un salto (reinicio, nivel nuevo) no hay rastro
      capaHist.push({ t: tiempo, x: p.x, y: p.y });
      while (capaHist.length > 2 && tiempo - capaHist[0].t > 2) capaHist.shift();
      capaFase += velCam * CONFIG.cadencia * dt;
      // giro: resorte críticamente amortiguado hacia hacia dónde mira el cuerpo. Arranca despacio, acelera y frena suave,
      // así la cara se desliza por la capucha en ~0.3 s en vez de saltar al borde en un cuadro (por el camino más corto)
      const w = CONFIG.capa.giro, hh = Math.min(dt, 0.05);
      const dif = Math.atan2(Math.sin(p.giro - capaYaw), Math.cos(p.giro - capaYaw));
      capaYawVel += (w * w * dif - 2 * w * capaYawVel) * hh;
      capaYaw += capaYawVel * hh;
      c.t = tiempo; c.mov = p.amp; c.fase = capaFase; c.yaw = capaYaw; c.dx = p.dirX; c.dy = p.dirY;
      capaN = 0;
      PERSONAJES[sel].gen(capaP, c);
    }

    function actualizarEnjambre(dt) {
      calcularPose();
      const capa = !!PERSONAJES[sel].gen;
      if (capa) generarCapa(dt);
      const lento = tiempo < morfHasta ? 0.18 : 1;             // tras cambiar de personaje, los cerebritos vuelan más despacio a su sitio
      // en la derrota, tras un instante los cerebritos del personaje dejan su sitio y se los traga el cerebro malvado
      const comido = fin && fin.tipo === 'derrota' && fin.tc !== null && tiempo - fin.tc > 0.9;
      const fuerza = comido ? suavizar(0.9, 2.8, tiempo - fin.tc) : 0;
      const desintegra = piscina && (piscina.fase === 'desintegra' || piscina.fase === 'fin');
      for (let i = 0; i < enjambre.length; i++) {
        const c = enjambre[i];
        if (capa) { objetivo[0] = capaX[i]; objetivo[1] = capaY[i]; c.set = capaSet[i]; c.alfa = capaAlfa[i]; }
        else calcularObjetivo(c);
        if (desintegra) {                                      // en la piscina: los cerebritos salen despedidos hacia arriba como ceniza
          c.x += c.dvx * dt; c.y += c.dvy * dt;
          c.dvx *= Math.exp(-0.6 * dt);
          c.tx = objetivo[0]; c.ty = objetivo[1];
          continue;
        }
        if (comido) {                                          // giran y se encogen hacia el centro de la boca
          const ang = fuerza * 2.4 * dt, co = Math.cos(ang), si = Math.sin(ang);
          const dx = c.x - fin.cx, dy = c.y - fin.cy, enc = Math.exp(-fuerza * 2.8 * dt);
          c.x = fin.cx + (dx * co - dy * si) * enc;
          c.y = fin.cy + (dx * si + dy * co) * enc;
          c.tx = objetivo[0]; c.ty = objetivo[1];
          continue;
        }
        if (c.morf) { c.tx = objetivo[0]; c.ty = objetivo[1]; c.morf = false; }   // sin esto el anticipo lanzaría al cerebrito mucho más allá
        if (!enjambreIniciado) {                               // primer cuadro: nacen en su sitio
          c.x = objetivo[0];
          c.y = objetivo[1];
        } else {
          // Anticipo: se apunta un poco por delante del objetivo según su velocidad, así el retraso
          // no crece al caminar y la silueta no se deforma (solo queda un retraso leve)
          const f = dt > 1e-4 ? CONFIG.anticipo / (c.k * lento * dt) : 0;
          const ox = objetivo[0] + (objetivo[0] - c.tx) * f;
          const oy = objetivo[1] + (objetivo[1] - c.ty) * f;
          const a = suavizado(c.k * lento, dt);                // cada uno persigue a su ritmo
          c.x += (ox - c.x) * a;
          c.y += (oy - c.y) * a;
        }
        c.tx = objetivo[0];
        c.ty = objetivo[1];
      }
      enjambreIniciado = true;
    }

    // ===== Dibujo =====
    // Los cerebritos del personaje. cx, cy = esquina de la cámara en píxeles reales (en la pantalla de inicio se corre
    // para mostrar al personaje en el selector); desvanece = transparencia general
    function dibujarEnjambre(t, desvanece, cx, cy) {
      for (const c of enjambre) {
        const alfa = vista[c.vis] * desvanece * (c.alfa === undefined ? 1 : c.alfa);   // rasgos que aparecen según hacia dónde mira (c.alfa: el encapuchado)
        if (alfa < 0.03) continue;
        const va = c.va === undefined ? CONFIG.vibAmp : c.va, ro = c.ro === undefined ? CONFIG.rotOnda : c.ro;   // el encapuchado trae los suyos
        const vx = Math.sin(t * CONFIG.vibVel * c.f1 + c.p1) * va;   // vibración suave (sin(t))
        const vy = Math.sin(t * CONFIG.vibVel * c.f2 + c.p2) * va;
        const ang = c.rot0 + Math.sin(t * 0.9 * c.f3 + c.p3) * ro;
        const s = (c.set === 'pers' ? spritesPers : juegoK[c.set])[c.variante];
        const cos = Math.cos(ang) * k, sin = Math.sin(ang) * k;
        ctx.globalAlpha = alfa;
        ctx.setTransform(cos, sin, -sin, cos, (c.x + vx) * k - cx, (c.y + vy) * k - cy);
        ctx.drawImage(s.canvas, -s.w / 2, -s.h / 2, s.w, s.h);
      }
      ctx.globalAlpha = 1;
      ctx.setTransform(1, 0, 0, 1, 0, 0);
    }

    // Pega en pantalla la parte visible de un caché del escenario
    function pegar(cache) {
      const r = mundo.kc / k;                                  // px de caché por px de pantalla
      const sx = cam.px * r, sy = cam.py * r;
      const x0 = Math.max(sx, 0), y0 = Math.max(sy, 0);
      const x1 = Math.min(sx + canvas.width * r, cache.width);
      const y1 = Math.min(sy + canvas.height * r, cache.height);
      if (x1 <= x0 || y1 <= y0) return;
      ctx.drawImage(cache, x0, y0, x1 - x0, y1 - y0,
        (x0 - sx) / r, (y0 - sy) / r, (x1 - x0) / r, (y1 - y0) / r);
    }

    // Estampa un cerebrito del juego de sprites en una posición del mundo (px lógicos)
    function estamparMundo(spr, x, y, ang, alfa) {
      const cos = Math.cos(ang) * k, sin = Math.sin(ang) * k;
      ctx.globalAlpha = alfa;
      ctx.setTransform(cos, sin, -sin, cos, x * k - cam.px, y * k - cam.py);
      ctx.drawImage(spr.canvas, -spr.w / 2, -spr.h / 2, spr.w, spr.h);
    }
    // ¿Está dentro de la pantalla (con margen)? Coordenadas del mundo
    const visible = (x, y, m) => x > cam.px / k - m && x < cam.px / k + CONFIG.logico.w + m &&
      y > cam.py / k - m && y < cam.py / k + CONFIG.logico.h + m;

    // La llave: cerebritos que forman su silueta. escala/alfa/dispersion sirven para el brillo y el efecto de recogerla
    function dibujarLlave(x, y, t, escala, alfa, dispersion, pantalla) {
      const co = Math.cos(-0.35), si = Math.sin(-0.35);
      for (let i = 0; i < FORMA_LLAVE.length; i++) {
        const [lx, ly] = FORMA_LLAVE[i];
        const px = (lx * co - ly * si) * escala, py = (lx * si + ly * co) * escala;
        const vib = Math.sin(t * 3 + i * 1.7) * 0.5;
        const spr = juegoK.llave[i % CONFIG.variaciones];
        const a = alfa * (0.8 + 0.2 * Math.sin(t * 2.4 + i * 0.9));
        const ex = px * (1 + dispersion) + vib, ey = py * (1 + dispersion) - dispersion * 26;
        if (pantalla) {                                       // en la esquina de la pantalla (HUD)
          const cos = Math.cos(i) * k, sin = Math.sin(i) * k;
          ctx.globalAlpha = a;
          ctx.setTransform(cos, sin, -sin, cos, (x + ex) * k, (y + ey) * k);
          ctx.drawImage(spr.canvas, -spr.w / 2, -spr.h / 2, spr.w, spr.h);
        } else {
          estamparMundo(spr, x + ex, y + ey, i, a);
        }
      }
    }

    // Las puertas: cerradas, un bloque cacheado (fachada + disfraz del cuarto); al abrirse, se deshacen en un enjambre
    function dibujarPuertas(t) {
      for (const pu of PUERTAS) {
        const b = pu.bloque;
        if (!b || !visible(b.x + b.w / 2, b.y + b.h / 2, Math.max(b.w, b.h) / 2 + 60)) continue;
        if (!pu.abierta) {
          const temblor = t < pu.sacudirHasta ? Math.sin(t * 75) * 2.4 * ((pu.sacudirHasta - t) / CONFIG.puertaTembloroTiempo) : 0;
          ctx.globalAlpha = 1;
          ctx.setTransform(1, 0, 0, 1, 0, 0);
          ctx.drawImage(b.canvas, (b.x + temblor) * k - cam.px, b.y * k - cam.py, b.w * k, b.h * k);
          // la cerradura dorada: titila despacio, como un brillo que recorre el metal
          for (const br of pu.brains) {
            if (!br.dinamica) continue;
            const brillo = 0.72 + 0.28 * Math.sin(t * 2.1 + br.fase) * Math.sin(t * 0.7 + br.fase * 0.5);
            estamparMundo(juegoK[br.set][br.v], br.x + temblor, br.y, br.ang, limitar(br.alfa * brillo, 0, 1));
          }
          continue;
        }
        const prog = (t - pu.tAbrir) / CONFIG.puertaAbrir;
        if (prog >= 1) continue;
        for (const br of pu.brains) {
          const e = limitar((prog - br.demora) / (1 - br.demora), 0, 1);
          if (e >= 1) continue;
          const a = br.alfa * (1 - e);
          if (a < 0.02) continue;
          estamparMundo(juegoK[br.set][br.v], br.x + br.dx * e * e, br.y + br.dy * e * e, br.ang + e * 2, a);
        }
      }
    }

    // El cerebro malvado en su cuadro: lo dibujado respira en rojo y la punta del trazo parpadea
    function dibujarCuadros(t) {
      for (const q of CUADROS) {
        if (!visible(q.cx, q.cy, 140)) continue;
        const extra = q.pulso;
        for (let i = 0; i < q.reveladas; i++) {
          const [px, py] = CEREBRO_MALO[i];
          const punta = i >= q.reveladas - 3;                  // el trazo que se está dibujando ahora
          const onda = 0.68 + 0.32 * Math.sin(t * 1.8 - i * 0.3);
          const jx = punta ? Math.sin(t * 9 + i) * 0.9 : 0, jy = punta ? Math.cos(t * 8 + i) * 0.9 : 0;
          estamparMundo(juegoK.mal[i % CONFIG.variaciones], q.cx + px * q.rx + jx, q.cy + py * q.rx + jy,
            i * 0.7, limitar(onda * (1 + extra * 0.6) + (punta ? 0.25 : 0), 0, 1));
        }
      }
    }

    // El texto que el cerebro escribe en el suelo. Mientras se escribe, cada cerebrito vuela desde el cuadro hasta su
    // sitio; cuando termina, se guarda como una sola imagen (barato) que respira en rojo.
    function dibujarTextoObj(s, t, vivo) {
      const tt = t - s.t0, tam = CONFIG.texto.tamano;
      const ox = s.pantalla ? 0 : cam.px, oy = s.pantalla ? 0 : cam.py;               // los textos de pantalla no siguen a la cámara
      if (!s.pantalla && !visible(s.centroX, s.centroY, Math.max(s.w, s.h) / 2 + 80) && !visible(s.origenX, s.origenY, 120)) return;
      const juego = juegoK[s.set];

      if (tt >= s.total) {
        if (!s.bake || s.bakeK !== k) {                       // se (re)hace la imagen si cambió el tamaño de pantalla
          const cv = document.createElement('canvas');
          cv.width = Math.ceil(s.w * k); cv.height = Math.ceil(s.h * k);
          const g = cv.getContext('2d');
          g.globalAlpha = 0.92;
          for (const b of s.brains) {
            const spr = juego[b.v], co = Math.cos(b.ang) * k, si = Math.sin(b.ang) * k;
            g.setTransform(co, si, -si, co, (b.x - s.x0) * k, (b.y - s.y0) * k);
            g.drawImage(spr.canvas, -spr.w * tam / 2, -spr.h * tam / 2, spr.w * tam, spr.h * tam);
          }
          s.bake = cv; s.bakeK = k;
        }
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.globalAlpha = s.alfa * (vivo === false ? 1 : 0.74 + 0.18 * Math.sin(t * 1.3 + s.x0 * 0.01));
        ctx.drawImage(s.bake, s.x0 * k - ox, s.y0 * k - oy, s.w * k, s.h * k);
        ctx.globalAlpha = 1;
        return;
      }

      for (const b of s.brains) {
        let u = (tt - b.demora) / (CONFIG.texto.vuelo * b.vuelo);
        if (u <= 0) continue;
        if (u > 1) u = 1;
        const e = 1 - (1 - u) * (1 - u) * (1 - u);               // sale rápido y se asienta
        const x = s.origenX + (b.x - s.origenX) * e, y = s.origenY + (b.y - s.origenY) * e - Math.sin(Math.PI * u) * 46;
        const spr = juego[b.v], sc = tam * (0.55 + 0.45 * e);
        const co = Math.cos(b.ang + (1 - e) * 3) * k, si = Math.sin(b.ang + (1 - e) * 3) * k;
        ctx.globalAlpha = Math.min(1, u * 4) * 0.92 * s.alfa;
        ctx.setTransform(co, si, -si, co, x * k - ox, y * k - oy);
        ctx.drawImage(spr.canvas, -spr.w * sc / 2, -spr.h * sc / 2, spr.w * sc, spr.h * sc);
      }
      ctx.globalAlpha = 1;
      ctx.setTransform(1, 0, 0, 1, 0, 0);
    }
    // ===== El pasto (nivel 3) =====
    // Cada sala de número está cubierta de pasto de cerebritos. Al caminar, el pasto se abre bajo los pies y el sendero
    // queda abierto; los números están escondidos debajo, y solo se ven donde ya se abrió.
    // El pincel es una elipse (más ancha que alta, como la huella de los pies en la vista 3/4) con el borde suave
    // El pasto se dibuja a una resolución algo menor que la pantalla (kp): es una textura orgánica y así pesa mucho menos
    const kPasto = () => Math.min(k, CONFIG.pasto.resolucionMax);
    function crearPincel() {
      const kp = kPasto();
      const RX = CONFIG.pasto.pincelX * kp, RY = CONFIG.pasto.pincelY * kp;
      const W = Math.ceil(RX * 2), Hh = Math.ceil(RY * 2);
      const cv = document.createElement('canvas');
      cv.width = W; cv.height = Hh;
      const g = cv.getContext('2d');
      g.translate(W / 2, Hh / 2); g.scale(1, RY / RX);                                // el degradado circular se aplasta en vertical
      const grad = g.createRadialGradient(0, 0, 0, 0, 0, RX);
      grad.addColorStop(0, 'rgba(0,0,0,1)'); grad.addColorStop(0.55, 'rgba(0,0,0,1)'); grad.addColorStop(1, 'rgba(0,0,0,0)');   // borde suave
      g.fillStyle = grad; g.fillRect(-RX, -RX, RX * 2, RX * 2);
      return { canvas: cv, rx: W / 2, ry: Hh / 2 };
    }
    // Dibuja todo el pasto de una sala en un canvas (una sola vez). Debajo de las matas va una tierra oscura opaca,
    // que tapa el número hasta que el pasto se abre. "vista" es la copia que se muestra, con el sendero ya abierto.
    function hornearPasto(p) {
      const kp = kPasto();
      const cv = document.createElement('canvas');
      cv.width = Math.ceil(p.w * kp); cv.height = Math.ceil(p.h * kp);
      const g = cv.getContext('2d');
      g.fillStyle = '#000'; g.fillRect(0, 0, cv.width, cv.height);
      const rng = crearRng(CONFIG.semilla + 401 + p.x0 * 3 + p.y0);
      const paso = CONFIG.pasto.paso, V = CONFIG.variaciones, set = juegoK.pasto;
      g.globalAlpha = 0.8;
      for (let fila = 0, y = paso / 2; y < p.h; fila++, y += paso * 0.85) {
        for (let x = paso / 2 + (fila % 2) * paso / 2; x < p.w; x += paso) {
          const bx = x + (rng() - 0.5) * paso * 0.7, by = y + (rng() - 0.5) * paso * 0.7;
          for (let i = 0; i < 3; i++) {                              // una mata: tres cerebritos en abanico, el del medio más alto
            const ang = (i - 1) * 0.5 + (rng() - 0.5) * 0.4, spr = set[Math.floor(rng() * V)];
            const co = Math.cos(ang) * kp, si = Math.sin(ang) * kp;
            g.setTransform(co, si, -si, co, (bx + (i - 1) * 2.6) * kp, (by + (i === 1 ? -2.4 : 0)) * kp);
            g.drawImage(spr.canvas, -spr.w / 2, -spr.h / 2, spr.w, spr.h);
          }
        }
      }
      g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1;
      p.base = cv;
      p.vista = document.createElement('canvas');                // la copia que se muestra: empieza igual que el pasto entero
      p.vista.width = cv.width; p.vista.height = cv.height;
      p.vista.getContext('2d').drawImage(cv, 0, 0);
      p.kBake = k; p.kp = kp; p.sucio = false; p.tRehacer = 0;
      // si ya había un sendero abierto (p. ej. al cambiar el tamaño de la ventana), se vuelve a abrir
      if (p.pasos.length) rehacerVistaPasto(p);
    }
    // Abre un trozo de sendero en la copia que se muestra (barato: una sola huella)
    function abrirHuella(p, x, y) {
      const g = p.vista.getContext('2d');
      g.globalCompositeOperation = 'destination-out'; g.globalAlpha = 1;
      g.drawImage(pincel.canvas, (x - p.x0) * p.kp - pincel.rx, (y - p.y0 - CONFIG.pasto.pincelDesplaza) * p.kp - pincel.ry);
      g.globalCompositeOperation = 'source-over';
    }
    // Qué tan abierto está un tramo del sendero según lo lejos que está el personaje: 1 = abierto, 0 = ya se cerró
    const aperturaPasto = (x, y) => 1 - suavizar(CONFIG.pasto.abierto, CONFIG.pasto.cierra, Math.hypot(x - personaje.x, y - personaje.y));
    // Rehace la copia que se muestra: todo el pasto, menos los tramos del sendero que siguen abiertos cerca del personaje
    function rehacerVistaPasto(p) {
      const g = p.vista.getContext('2d');
      g.globalCompositeOperation = 'source-over'; g.globalAlpha = 1;
      g.clearRect(0, 0, p.vista.width, p.vista.height);
      g.drawImage(p.base, 0, 0);
      g.globalCompositeOperation = 'destination-out';
      for (const [x, y, a] of p.pasos) {                           // cada tramo con su propio nivel de apertura (a)
        if (a < 0.01) continue;
        g.globalAlpha = a;                                         // los tramos más lejanos se borran menos: el pasto se va cerrando
        g.drawImage(pincel.canvas, (x - p.x0) * p.kp - pincel.rx, (y - p.y0 - CONFIG.pasto.pincelDesplaza) * p.kp - pincel.ry);
      }
      g.globalCompositeOperation = 'source-over'; g.globalAlpha = 1;
      p.vx0 = personaje.x; p.vy0 = personaje.y; p.sucio = false;
    }
    // Al caminar dentro de una sala se abre un nuevo trozo de sendero (cada ~8 px) y saltan unas hojitas;
    // los tramos que quedan lejos del personaje se van cerrando y, pasado cierto radio, el pasto vuelve a estar entero
    function actualizarPastos() {
      if (!PASTOS.length) return;
      const px = personaje.x, py = personaje.y, sep = CONFIG.pasto.huella;
      for (const p of PASTOS) {
        if (!p.vista || p.kBake !== k) continue;                   // todavía no está dibujado: se hace en dibujarPastos
        const dentro = px > p.x0 - 10 && px < p.x0 + p.w + 10 && py > p.y0 - 10 && py < p.y0 + p.h + 10;
        if (dentro) {
          // Las huellas se ponen cada "huella" px a lo largo del recorrido, también entre cuadros: así el sendero es continuo
          // aunque el juego vaya a pocos fps (un salto grande, como entrar a la sala, deja una sola huella)
          const u = p.ultimo;
          const d = u ? Math.hypot(px - u[0], py - u[1]) : Infinity;
          if (d >= sep) {
            const n = d === Infinity || d > 70 ? 1 : Math.floor(d / sep);
            for (let i = 1; i <= n; i++) {
              const f = n === 1 && (d === Infinity || d > 70) ? 1 : (i * sep) / d;
              const hx = u ? u[0] + (px - u[0]) * f : px, hy = u ? u[1] + (py - u[1]) * f : py;
              p.ultimo = [hx, hy]; p.pasos.push([hx, hy, 1]);       // una huella nueva: abierta del todo
              abrirHuella(p, hx, hy);
              if (Math.random() < 0.5) for (let j = 0; j < CONFIG.pasto.hojas && hojas.length < 220; j++) {
                const a = Math.random() * 6.2832, v = 30 + Math.random() * 70;
                hojas.push({ x: hx + Math.cos(a) * 30, y: hy + Math.sin(a) * 14, vx: Math.cos(a) * v, vy: Math.sin(a) * v * 0.5 - 40 - Math.random() * 40, t0: tiempo, v: j % CONFIG.variaciones });
              }
            }
          }
        }
        if (p.pasos.length) {
          // Cada tramo se va cerrando según lo lejos que quede del personaje, pero el cierre NO se deshace: su apertura
          // solo puede bajar. Así, volver cerca de un sendero ya cerrado no lo reabre; hay que pisarlo de nuevo.
          let cerrandose = false;
          for (const s of p.pasos) {
            const a = aperturaPasto(s[0], s[1]);
            if (a < s[2]) { s[2] = a; cerrandose = true; }
          }
          const quedan = p.pasos.filter((s) => s[2] > 0.01);       // los ya cerrados del todo, se olvidan
          if (quedan.length !== p.pasos.length) {
            p.pasos = quedan; p.sucio = true;
            if (!quedan.length) { p.ultimo = null; rehacerVistaPasto(p); }   // sin sendero: vuelve a ser el pasto entero
          }
          // el cierre es gradual y lento: basta rehacer la copia unas ~11 veces por segundo (lo de abrir ya se hizo huella a huella)
          if (cerrandose && tiempo >= p.tRehacer) { p.sucio = true; p.tRehacer = tiempo + 0.09; }
        }
      }
      if (hojas.length) hojas = hojas.filter((h) => tiempo - h.t0 < 0.7);
    }
    function dibujarPastos(t) {
      for (const p of PASTOS) {
        if (!visible(p.x0 + p.w / 2, p.y0 + p.h / 2, Math.max(p.w, p.h) / 2 + 60)) continue;
        if (!p.base || p.kBake !== k) hornearPasto(p);
        if (p.sucio && p.pasos.length) rehacerVistaPasto(p);
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.globalAlpha = 1;
        ctx.drawImage(p.vista, p.x0 * k - cam.px, p.y0 * k - cam.py, p.w * k, p.h * k);   // (a menor resolución, se estira al tamaño real)
      }
      for (const h of hojas) {                                                          // las hojitas que saltan al pisar
        const u = (t - h.t0) / 0.7;
        if (u < 0 || u >= 1) continue;
        estamparEsc(juegoK.pasto[h.v], h.x + h.vx * u, h.y + h.vy * u + 110 * u * u, u * 5 + h.v, (1 - u) * 0.9, 1.3, false);
      }
      ctx.globalAlpha = 1;
      ctx.setTransform(1, 0, 0, 1, 0, 0);
    }

    // ===== Criaturas decorativas (nivel 3) =====
    // Se amontonan sobre su número; cuando el personaje se acerca se asustan: saltan y salen corriendo (en zigzag, cada vez
    // más rápido cuanto más cerca está), rebotan en las paredes de su sala y, ya en calma, vuelven despacio a su sitio.
    function actualizarBichos(dt) {
      if (!BICHOS.length) return;
      const px = personaje.x, py = personaje.y - 30, R = CONFIG.bichos.susto;
      for (const b of BICHOS) {
        const dx = b.x - px, dy = b.y - py, d = Math.hypot(dx, dy) || 1;
        b.mira[0] = -dx / d; b.mira[1] = -dy / d;                      // hacia el personaje (lo miran los ojos)
        if (!b.huye && d < R) {                                       // se asustan: un salto y a correr
          b.huye = true; b.salto = tiempo + Math.random() * 0.25;
          b.vx = (dx / d) * 260; b.vy = (dy / d) * 260;
        } else if (b.huye && d > R * 1.6) b.huye = false;
        if (b.huye) {
          const u = 1 - Math.min(1, d / R), vel = 60 + 250 * u;
          const giro = Math.sin(tiempo * 2.6 + b.fase) * 0.7, co = Math.cos(giro), si = Math.sin(giro);
          const nx = dx / d, ny = dy / d, a = suavizado(7, dt);
          b.vx += ((nx * co - ny * si) * vel - b.vx) * a;
          b.vy += ((nx * si + ny * co) * vel - b.vy) * a;
        } else {                                                       // en calma, vuelven a amontonarse sobre el número
          const hx = b.hx - b.x, hy = b.hy - b.y, dh = Math.hypot(hx, hy), vel = Math.min(55, dh * 1.4), a = suavizado(2.5, dt);
          const tx = dh > 1 ? hx / dh * vel : 0, ty = dh > 1 ? hy / dh * vel : 0;
          b.vx += (tx + Math.sin(tiempo * 1.7 + b.fase) * 5 - b.vx) * a;     // nunca están del todo quietos
          b.vy += (ty + Math.cos(tiempo * 1.5 + b.fase) * 5 - b.vy) * a;
        }
        b.x += b.vx * dt; b.y += b.vy * dt;
        const L = b.limites;                                           // rebotan contra las paredes de su sala
        if (b.x < L.x0) { b.x = L.x0; b.vx = Math.abs(b.vx) * 0.5; } else if (b.x > L.x1) { b.x = L.x1; b.vx = -Math.abs(b.vx) * 0.5; }
        if (b.y < L.y0) { b.y = L.y0; b.vy = Math.abs(b.vy) * 0.5; } else if (b.y > L.y1) { b.y = L.y1; b.vy = -Math.abs(b.vy) * 0.5; }
        if (b.seg) {                                                   // larva: cada segmento sigue al anterior
          b.seg[0][0] = b.x; b.seg[0][1] = b.y;
          for (let i = 1; i < b.seg.length; i++) {
            const p = b.seg[i - 1], s = b.seg[i];
            const sx = s[0] - p[0], sy = s[1] - p[1], sd = Math.hypot(sx, sy) || 1;
            s[0] = p[0] + (sx / sd) * 4.8; s[1] = p[1] + (sy / sd) * 4.8;
          }
        }
      }
    }
    function dibujarBichos(t) {
      const V = CONFIG.variaciones;
      for (const b of BICHOS) {
        if (!visible(b.x, b.y, 50)) continue;
        const vel = Math.hypot(b.vx, b.vy), sT = t - b.salto;
        const hop = sT >= 0 && sT < 0.4 ? Math.sin(Math.PI * sT / 0.4) * 14 : 0;                 // el saltito del susto
        const y = b.y - hop - (b.huye ? Math.abs(Math.sin(t * 15 + b.fase)) * 3 : Math.sin(t * 2 + b.fase) * 1.2);

        if (b.tipo === 'ojo') {
          // un globo de cerebritos con la pupila roja siguiendo al personaje; parpadea cada tanto
          const ciclo = (t + b.parpadeo) % 4.2, cierre = ciclo > 4.05 ? Math.max(0, 1 - Math.abs((ciclo - 4.125) / 0.075)) : 0;
          const abierto = 1 - 0.85 * cierre;
          for (let i = 0; i < 8; i++) {
            const a = (i / 8) * 6.2832;
            estamparEsc(juegoK.rasgo[i % V], b.x + Math.cos(a) * 6.4, y + Math.sin(a) * 6.4 * abierto, a, 0.92, 1.2, false);
          }
          estamparEsc(juegoK.mal[Math.floor(b.fase) % V], b.x + b.mira[0] * 2.8, y + b.mira[1] * 2.8 * abierto, b.fase, 0.3 + 0.7 * abierto, 0.85, false);
        } else if (b.tipo === 'larva') {
          // una cadena de cerebritos que se retuerce; más cuanto más rápido corre
          const retorcer = 1.2 + Math.min(1, vel / 140) * 2.2;
          for (let i = 0; i < b.seg.length; i++) {
            const s = b.seg[i], p = b.seg[Math.max(0, i - 1)], q = b.seg[Math.min(b.seg.length - 1, i + 1)];
            let dx = p[0] - q[0], dy = p[1] - q[1]; const dd = Math.hypot(dx, dy) || 1; dx /= dd; dy /= dd;
            const o = Math.sin(t * 11 - i * 1.2 + b.fase) * retorcer;
            estamparEsc(juegoK.rasgo[(i + Math.floor(b.fase)) % V], s[0] - dy * o, s[1] + dx * o - hop, i, 0.92, i === 0 ? 1.6 : 1.3 - i * 0.05, false);
          }
        } else {
          // arañita: cuerpo de tres cerebritos y ocho patas que se mueven; corre a ráfagas al asustarse
          for (let i = 0; i < 3; i++) estamparEsc(juegoK.rasgo[i % V], b.x + (i - 1) * 2.4, y + (i === 1 ? 0 : 1.2), i, 0.95, 1.35, false);
          const marcha = b.huye ? 22 : 3;
          for (let j = 0; j < 8; j++) {
            const lado = j < 4 ? -1 : 1, k4 = j % 4;
            const ax = b.x + lado * 2.6, ay = y + (k4 - 1.5) * 2.3;
            const ph = t * marcha + k4 * 1.7 + (lado > 0 ? Math.PI : 0) + b.fase;
            const alcance = 9 + 2.2 * Math.sin(ph);
            const fx = ax + lado * alcance, fy = ay + (k4 - 1.5) * 3.8 + 2.4 * Math.cos(ph);
            estamparEsc(juegoK.rasgo[(j + 1) % V], ax + (fx - ax) * 0.5, ay + (fy - ay) * 0.5 - 3, j, 0.85, 0.95, false);
            estamparEsc(juegoK.rasgo[(j + 2) % V], fx, fy, j + 1, 0.85, 1.05, false);
          }
        }
      }
      ctx.globalAlpha = 1;
      ctx.setTransform(1, 0, 0, 1, 0, 0);
    }

    // Todos los textos del mundo: el que escribe el cuadro, las pistas del código y las etiquetas de las puertas finales
    function dibujarTexto(t) {
      if (textoSuelo) dibujarTextoObj(textoSuelo, t);
      for (const p of PISTAS) dibujarTextoObj(p.texto, t, false);       // los números del código: a plena luz, sin respirar
      for (const e of ETIQUETAS) if (e.cuando()) dibujarTextoObj(e.texto, t, false);
      dibujarBichos(t);                                                  // las criaturas (apagadas por ahora)
      dibujarPastos(t);                                                  // el pasto, que esconde los números hasta que se abre
    }

    // Las palancas: un cerebro de su tamaño arriba (blanco; dorado si ya se tiró bien; rojo si hubo un error)
    // y debajo un eje con la manija, que baja al tirarla
    function dibujarPalancas(t) {
      for (const p of PALANCAS) {
        if (!visible(p.x, p.y + T / 2, 120)) continue;
        const ya = p.estado === 'abajo';
        const error = t < palancasError && (Math.floor(t * 10) % 2 === 0);          // parpadeo rojo
        const color = error ? 'mal' : (ya || puzzleResuelto) ? 'oro' : 'blanco';
        const pulso = 0.78 + 0.22 * Math.sin(t * 2.2 + p.indice * 1.3);
        // el cerebro que marca la palanca
        estamparMundo(juegoK.glifos[color][p.tam][p.indice % CONFIG.variaciones], p.x, p.y + 28, Math.sin(t * 0.6 + p.indice) * 0.1,
          color === 'blanco' ? pulso * 0.9 : 1);
        // la placa del eje
        const px = p.x, py = p.y + 66;
        for (let i = 0; i < 9; i++) {
          const a = (i / 9) * 6.2832;
          estamparMundo(juegoK.techo[i % CONFIG.variaciones], px + Math.cos(a) * 11, py + Math.sin(a) * 11, a, 0.85);
        }
        // la manija: de apuntar arriba (valor 0) a apuntar abajo (valor 1)
        const ang = (-1.35 + p.valor * 2.7) + (p.valor > 0.05 && p.valor < 0.95 ? Math.sin(t * 40) * 0.03 : 0);
        for (let i = 1; i <= 5; i++) {
          estamparMundo(juegoK.muro[i % CONFIG.variaciones], px + Math.cos(ang) * i * 6.2, py + Math.sin(ang) * i * 6.2, ang + i, 1);
        }
        estamparMundo(juegoK[ya || puzzleResuelto ? 'oro' : 'techo'][0], px + Math.cos(ang) * 37, py + Math.sin(ang) * 37, ang, 1);   // la empuñadura
      }
    }

    // El portal a la salida: anillos de cerebritos que giran en sentidos opuestos alrededor de un cerebro tallado
    function dibujarPortal(t) {
      if (!salidaActiva() || !visible(salida.x, salida.y, 120)) return;
      const aparece = suavizar(0, 1, t - (salida.puerta ? salida.puerta.tAbrir : 0));   // aparece con la puerta abierta
      const anillos = [[14, 8, 1.1], [27, 14, -0.8], [41, 20, 0.6]];                    // radio, cantidad, velocidad
      anillos.forEach(([r, n, vel], a) => {
        for (let i = 0; i < n; i++) {
          const ang = (i / n) * 6.2832 + t * vel;
          const resp = 1 + 0.06 * Math.sin(t * 2 + a + i);
          estamparMundo(juegoK.llave[(i + a) % CONFIG.variaciones], salida.x + Math.cos(ang) * r * resp,
            salida.y + Math.sin(ang) * r * 0.8 * resp, ang + 1.5, aparece * (0.55 + 0.35 * Math.sin(t * 2.6 + i + a * 2)));
        }
      });
      estamparMundo(juegoK.relieve[0], salida.x, salida.y, t * 0.3, aparece * (0.7 + 0.2 * Math.sin(t * 3)));
    }

    // Pista de interacción: una "E" dentro de un marcador fino, sobre lo que se puede usar.
    // Se desvanece al alejarse (aparece al acercarse). En la salida, además, el aviso del siguiente nivel.
    function dibujarPista(foco, t) {
      const fuerza = 1 - suavizar(foco.radio * 0.7, foco.radio, foco.d);
      if (fuerza < 0.02) return;
      dibujarMarcaE(foco.hx, foco.hy, fuerza, t);
      if (foco.tipo === 'salida') {
        ctx.globalAlpha = fuerza;
        ctx.font = Math.round(20 * k) + 'px ui-monospace, Consolas, monospace';
        ctx.fillText('NIVEL ' + (foco.ref.destino + 1), foco.hx * k - cam.px, foco.hy * k - cam.py + Math.sin(t * 3) * 3 * k - 34 * k);
      }
      ctx.globalAlpha = 1;
    }
    // La E del cerebro rojo flota siempre, desde lejos, hasta que se usa por primera vez (para que lo primero sea ir a leerlo)
    function dibujarPistaCuadros(t) {
      for (const q of CUADROS) {
        if (q.usado || !visible(q.cx, q.y0 - 26, 60)) continue;
        dibujarMarcaE(q.cx, q.y0 - 26, 1, t);
      }
      ctx.globalAlpha = 1;
    }
    // El marcador con la E (en coordenadas del mundo); fuerza = opacidad
    function dibujarMarcaE(hx, hy, fuerza, t) {
      const x = hx * k - cam.px, y = hy * k - cam.py + Math.sin(t * 3) * 3 * k;
      const s = 21 * k;                                       // medio lado del marcador
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      // fondo oscuro para que se lea sobre cualquier cosa, y un marcador bien visible
      ctx.globalAlpha = fuerza * 0.7;
      ctx.fillStyle = '#000';
      ctx.fillRect(x - s, y - s, s * 2, s * 2);
      ctx.strokeStyle = '#ececec';
      ctx.fillStyle = '#ffffff';
      ctx.lineWidth = Math.max(1.5, 1.5 * k);
      ctx.globalAlpha = fuerza * (0.85 + 0.15 * Math.sin(t * 4));
      ctx.strokeRect(x - s, y - s, s * 2, s * 2);
      ctx.font = 'bold ' + Math.round(28 * k) + 'px ui-monospace, Consolas, monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('E', x, y + 2 * k);
      ctx.globalAlpha = 1;
    }

    // Estampa un cerebrito con escala: en el mundo (px lógicos) o pegado a la pantalla (px lógicos de 1280x720)
    function estamparEsc(spr, x, y, ang, alfa, sc, pantalla) {
      const cos = Math.cos(ang) * k, sin = Math.sin(ang) * k;
      ctx.globalAlpha = alfa;
      ctx.setTransform(cos, sin, -sin, cos, x * k - (pantalla ? 0 : cam.px), y * k - (pantalla ? 0 : cam.py));
      ctx.drawImage(spr.canvas, -spr.w * sc / 2, -spr.h * sc / 2, spr.w * sc, spr.h * sc);
    }
    // Los dígitos del 0 al 9 hechos de cerebritos (grandes para el panel, chicos para la pared); se calculan una vez
    const cacheDigitos = {};
    // tam: true = grande (pantalla de ingreso), 'm' = mediano (panel de la pared), false = chico
    function digitoBrains(d, tam) {
      const t = tam === 'm' ? 'm' : tam ? 'g' : 'p';
      const dim = { g: [78, 104, 5.8, 120], m: [28, 40, 4.2, 48], p: [18, 24, 3.3, 30] }[t];
      const clave = t + d;
      if (!cacheDigitos[clave]) {
        cacheDigitos[clave] = crearTextoEnRegion(String(d), 0, 0, dim[0], dim[1],
          { estatico: true, paso: dim[2], margen: 2, tamMax: dim[3], max: 1200 }).brains;
      }
      return cacheDigitos[clave];
    }
    // Perímetro de una caja hecho de cerebritos (para los casilleros del código)
    function cajaDeCerebritos(set, x0, y0, x1, y1, paso, sc, alfa, pantalla) {
      for (let x = x0, i = 0; x <= x1 + 0.1; x += paso, i++) {
        estamparEsc(set[i % CONFIG.variaciones], x, y0, i, alfa, sc, pantalla);
        estamparEsc(set[(i + 1) % CONFIG.variaciones], x, y1, i + 2, alfa, sc, pantalla);
      }
      for (let y = y0 + paso, i = 0; y < y1; y += paso, i++) {
        estamparEsc(set[(i + 2) % CONFIG.variaciones], x0, y, i + 1, alfa, sc, pantalla);
        estamparEsc(set[(i + 3) % CONFIG.variaciones], x1, y, i + 3, alfa, sc, pantalla);
      }
    }

    // El panel del código en la fachada: tres casilleros; al resolverlo se muestran los números en dorado
    function dibujarPanelFachada(t) {
      if (!PANEL || !visible(PANEL.x, PANEL.y + T / 2, 120)) return;
      const error = t < panelEstado.error && Math.floor(t * 12) % 2 === 0;
      for (let s = 0; s < 3; s++) {
        const set = juegoK[error ? 'mal' : 'slot' + s];                          // cada casillero, de su color
        const cx = PANEL.x + (s - 1) * 52, cy = PANEL.y + 46;
        cajaDeCerebritos(set, cx - 20, cy - 28, cx + 20, cy + 28, 6.5, 0.75, puzzleResuelto ? 1 : 0.85, false);
        // los números que ya pusiste quedan a la vista en la pared (aunque cierres el panel); al resolverlo, todos
        if (puzzleResuelto || panelEstado.escrito[s]) {
          const valor = puzzleResuelto ? codigo[s] : panelEstado.d[s];
          for (const b of digitoBrains(valor, 'm')) estamparEsc(set[b.v], cx - 14 + b.x, cy - 20 + b.y, b.ang, 1, 0.8, false);
        }
      }
    }

    // La pantalla de ingreso del código (se abre con E en el panel)
    function dibujarPanelModal(t) {
      if (!panelEstado.abierto) return;
      const p = panelEstado;
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.globalAlpha = 0.78; ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      const error = t < p.error && Math.floor(t * 12) % 2 === 0;
      for (let s = 0; s < 3; s++) {
        const cx = 640 + (s - 1) * 140, cy = 300, sel = s === p.slot;
        const set = juegoK[error ? 'mal' : 'slot' + s];                  // cada casillero lleva su color; el activo late y tiene flechitas
        cajaDeCerebritos(set, cx - 49, cy - 64, cx + 49, cy + 64, 7, 1, sel ? 0.8 + 0.2 * Math.sin(t * 4) : 0.45, true);
        const escrito = p.escrito[s];                                       // un casillero vacío muestra un 0 muy tenue
        for (const b of digitoBrains(p.d[s], true)) estamparEsc(set[b.v], cx - 39 + b.x, cy - 52 + b.y, b.ang, escrito ? (sel ? 0.98 : 0.8) : (sel ? 0.4 : 0.22), 1.15, true);
        if (sel) {                                                    // flechitas ︿ y ﹀ arriba y abajo del casillero activo
          for (let i = 0; i < 3; i++) {
            const dx = (i - 1) * 11, dy = Math.abs(i - 1) * 7;
            estamparEsc(juegoK.oro[i % CONFIG.variaciones], cx + dx, cy - 86 + dy, i, 0.9, 0.8, true);
            estamparEsc(juegoK.oro[(i + 1) % CONFIG.variaciones], cx + dx, cy + 86 - dy, i, 0.9, 0.8, true);
          }
        }
      }
