      // pliegues alrededor del cuerpo: barren de un lado al otro al girar (los de atrás no se ven)
      [-0.95, -0.3, 0.3, 0.95, Math.PI - 0.6, Math.PI + 0.6].forEach((th, k) => {
        for (let i = 0; i < 3; i++) {
          const u = 0.46 + (i / 2) * 0.45, [x, z] = sup(u, th);
          P(x + sen(t * 1.1 + k + u * 4) * 0.006 * H, Y(u), 'xs', 1, 0.9 * mira(z, -0.2, 0.5));
        }
      });

      // mangas: una a cada lado del cuerpo; al girar pasan por delante. La derecha del personaje (a la izquierda de la
      // pantalla de frente) lleva el farol, con el brazo adelantado y levantado.
      const proj = (lx, lz) => [lx * co + lz * si, lz * co - lx * si];
      for (const br of [-1, 1]) {
        const lleva = br < 0;
        const sa = sen(ph + (br < 0 ? 0 : Math.PI));
        const [sx0, sz0] = proj(br * 0.12 * H, 0);
        const [cx0, cz0] = proj(br * 0.20 * H, lleva ? K.alcance * H : 0);
        const sx = cen(0.39) + sx0, sy = Y(0.39) + sz0 * prof * 0.5;
        const cx_ = cen(0.67) + cx0 + sa * 0.06 * H * c.dx * m * (lleva ? 0.4 : 1);
        const cy_ = Y(0.67) - (lleva ? 0.07 * H : 0) + cz0 * prof + sa * 0.02 * H * c.dy * m;
        const al = lleva ? 1 : 0.3 + 0.7 * suavizar(-0.35, 0.35, cz0 / (0.2 * H));   // la manga de atrás se atenúa, no desaparece
        const ex = (sx + cx_) / 2 + 0.02 * H * br * co, ey = (sy + cy_) / 2;
        capaCarriles(P, sx, sy, ex, ey, 3, 0.03 * H, 0.04 * H, 's', 0, al);
        capaCarriles(P, ex, ey, cx_, cy_, 3, 0.04 * H, 0.05 * H, 's', 0, al);
        for (let k = 0; k < 3; k++) {                          // la mano: tres huesitos (en la del farol, el puño que agarra la cuerda)
          P(cx_ + (k - 1) * 0.014 * H, cy_ + 0.03 * H + (k === 1 ? 0.014 * H : 0) + (lleva ? 0 : sen(t * 2 + k + br) * 0.003 * H), 'xs', 2, al);
        }
        if (lleva) {
          // la cuerda cuelga del puño y el farol cuelga de la cuerda: se balancea con el paso y se queda un poco atrás
          const bal = sen(ph) * 0.03 * H * m + sen(t * 1.7) * 0.004 * H + c.rastro(K.arrastre * 0.65)[0] * 0.35;
          const px = cx_, py = cy_ + 0.05 * H;                 // dónde termina el puño
          const fx = cx_ + bal, fy = py + 0.09 * H + sen(t * 2.3) * 0.003 * H;   // la cuerda mide 0.05 H y el farol, 0.04 H de radio
          for (let i = 1; i <= 3; i++) {
            const u = i / 4;
            P(px + (fx - px) * u, py + (fy - 0.04 * H - py) * u, 'xs', 0);
          }
          P(fx, fy, 'xl', 2);                                  // el farol: un solo cerebrito grande y brillante
          capaLuz.x = personaje.x + fx; capaLuz.y = personaje.y + fy;
        }
      }

      // dobladillo deshilachado y goteos
      const largo = (j) => H * (0.012 + 0.02 * (0.5 + 0.5 * sen(t * 1.7 + j * 1.9)))
        + ((j % 4 === 1) ? 0.035 * H * (0.5 + 0.5 * sen(t * 1.1 + j)) : 0);
      for (let j = 0; j < 14; j++) P(Xq(1, -1 + (2 * (j + 0.5)) / 14), Y(1) + largo(j), 'm', 0);
      [1, 5, 9, 12].forEach((j) => {
        const x = Xq(1, -1 + (2 * (j + 0.5)) / 14), y = Y(1) + largo(j);
        P(x, y + 0.026 * H, 'xs', 1); P(x, y + 0.052 * H, 'xs', 1);
      });

      // neblina bajo la túnica: no tiene pies, flota
      for (let i = 0; i < K.bruma; i++) {
        const q = (t * 0.2 + i * 0.17) % 1;
        P(cen(1) + (-0.2 + 0.08 * i) * H + sen(t * 0.9 + i * 1.7) * 0.02 * H, Y(1) + 0.06 * H + (0.5 - 0.5 * cos(q * TAU)) * 0.05 * H, 'xs', 1);
      }
    }

    // ===== El cerebro con patas (PERSONAJES: gen = genCerebro) =====
    // Generador: recibe P y el contexto c (el mismo que el del juego):
    //   t tiempo · mov 0..1 (cuánto camina) · fase (ciclo de la caminata)
    //   yaw = hacia dónde mira el cuerpo, suave: 0 = de frente (hacia abajo en pantalla), ±π/2 = de lado, π = de espaldas
    //   dx, dy rumbo unitario · rastro(lag) = dónde estaba hace "lag" s
    // P(x, y, tam, tono, alfa): tam 'm' | 's' | 'xs'; tono 0 normal, 1 tenue, 2 brillo. Solo se usan m0, s0, s2, xs0, xs1, xs2.
    // Coordenadas locales: (0,0) = suelo bajo el personaje, y negativo = arriba. Siempre pone la misma cantidad de cerebritos.
    // El cerebro es un elipsoide (ancho, alto, fondo) que gira con yaw. Todo lo que lleva (ojo, pliegues, fisura, patas, médula)
    // está pegado a él en coordenadas locales (lx derecha, ly arriba negativo, lz adelante); al girar cada punto se desliza por
    // la superficie y se desvanece al quedar atrás (alfa continua): nada salta ni cambia de tamaño.
    function genCerebro(P, c) {
      const H = CONFIG.alturaPersonaje, K = CONFIG.cerebro, KP = K.patas, KM = K.medula, m = c.mov, t = c.t, ph = c.fase;
      const sen = Math.sin, cos = Math.cos, TAU = Math.PI * 2;
      const co = cos(c.yaw), si = sen(c.yaw), prof = K.profundidad;
      const sq = 1 + sen(ph * 2) * 0.03 * m;                           // se estira y se aplasta un poco al caminar
      const A = K.ancho * H * sq, B = K.alto * H / sq, D = K.fondo * H;
      const cx = c.dx * K.inclina * H * m;                             // se inclina hacia donde va
      const cy = -K.altura * H - Math.abs(cos(ph)) * H * K.rebote * m + sen(t * 1.7) * H * 0.004;
      const vis = (f) => suavizar(-0.08, 0.3, f);                      // 0..1: cuánto da a la cámara (f = coseno con la vista)
      // punto del cuerpo (local) a pantalla: [x, y, z hacia la cámara]
      const proj = (lx, ly, lz) => { const z = lz * co - lx * si; return [cx + lx * co + lz * si, cy + ly + z * prof, z]; };
      // punto de la superficie en (lon, lat): lon 0 = el frente del cerebro, lat > 0 = hacia arriba; devuelve [x, y, f]
      // (sale: cuánto sobresale de la superficie, como un globo ocular; 0 = pegado)
      const sup = (lon, lat, sale = 0) => {
        const p = proj(A * (1 + sale) * cos(lat) * sen(lon), -B * (1 + sale * 0.5) * sen(lat), D * (1 + sale) * cos(lat) * cos(lon));
        return [p[0], p[1], cos(lat) * cos(lon + c.yaw) * 0.97 + sen(lat) * 0.25];
      };

      // silueta: la elipse que ve la cámara (más ancha de frente que de lado) con los bultos del cerebro
      const rx = Math.hypot(A * co, D * si), ry = B + 0.03 * H;
      for (let i = 0; i < 30; i++) {
        const a = (i / 30) * TAU, r = 1 + 0.07 * cos(a * 9) + 0.012 * sen(t * 1.7 + a * 3);
        P(cx + cos(a) * rx * r, cy + sen(a) * ry * r, 'm', 0);
      }

      // fisura entre los dos hemisferios: un arco por la parte de arriba, de adelante hacia atrás
      for (let i = 0; i < 7; i++) {
        const e = 0.45 + (i / 6) * (Math.PI - 0.9), p = proj(0, -B * sen(e), D * cos(e));
        P(p[0], p[1], 'xs', 1, vis(cos(e) * co * 0.97 + sen(e) * 0.25));
      }

      // circunvoluciones: cuatro anillos de pliegues muy ondulados alrededor del cerebro (se esconden donde está el ojo)
      const EY = -0.1, RE = 0.30;                                      // el ojo: latitud de su centro y radio (en radianes de la superficie)
      [[0.70, 11, 0, 4], [0.32, 18, 0, 5], [-0.12, 18, 1, 4], [-0.55, 14, 1, 5]].forEach(([lat0, n, tono, olas], j) => {
        for (let i = 0; i < n; i++) {
          const lon = ((i + 0.5 * j) / n) * TAU, lat = lat0 + 0.17 * sen(lon * olas + j * 2);
          const [x, y, f] = sup(lon, lat);
          const dl = Math.atan2(sen(lon), cos(lon)), libre = suavizar(0.34, 0.6, Math.hypot(dl * cos(lat), lat - EY));
          P(x, y, 'xs', tono, 0.9 * vis(f) * libre);
        }
      });

      // el ojo (en el frente del cerebro): un globo que sobresale (así de lado se ve asomar hacia donde mira), con párpado,
      // iris que divaga, pupila brillante y parpadeo
      const ciclo = t % 4.3, abre = ciclo > 4.1 ? 1 - sen(((ciclo - 4.1) / 0.2) * Math.PI) * 0.92 : 1;
      const wl = 0.05 * sen(t * 0.6), wt = 0.04 * sen(t * 0.9 + 1);
      const veo = (f) => suavizar(-0.5, 0.15, f);                     // el globo se sigue viendo casi de canto y se va solo por atrás
      for (let i = 0; i < 10; i++) {
        const a = (i / 10) * TAU, [x, y, f] = sup(RE * cos(a) / cos(EY), EY + RE * sen(a) * abre, 0.12);
        P(x, y, 'xs', 2, veo(f));
      }
      for (let i = 0; i < 6; i++) {
        const a = (i / 6) * TAU, [x, y, f] = sup(wl + 0.14 * cos(a) / cos(EY), EY + wt + 0.14 * sen(a) * abre, 0.2);
        P(x, y, 'xs', 0, veo(f));
      }
      { const [x, y, f] = sup(wl, EY + wt, 0.26); P(x, y, 'xs', 2, veo(f)); }

      // cuatro patitas en diagonal. Pisan en las esquinas de una elipse en el suelo que gira con el cuerpo; las de atrás se atenúan
      [[-1, 1], [1, 1], [-1, -1], [1, -1]].forEach(([sx, sz]) => {
        const fi = ph + (sx * sz > 0 ? 0 : Math.PI), sw = sen(fi), lev = Math.max(0, cos(fi));
        const lx = sx * KP.x * H, lz = sz * KP.z * H, zf = lz * co - lx * si;
        const fx_ = lx * co + lz * si + sw * KP.paso * H * c.dx * m;
        const fy_ = zf * prof + sw * KP.paso * H * c.dy * 0.5 * m - lev * KP.levante * H * m;
        const hip = proj(lx * 0.75, B * 0.7, lz * 0.8);
        const al = 0.35 + 0.65 * suavizar(-0.4, 0.4, zf / (KP.z * H));
        const kx = (hip[0] + fx_) / 2 + limitar((fx_ - cx) / (KP.x * H), -1, 1) * 0.03 * H, ky = (hip[1] + fy_) / 2 - 0.01 * H;
        for (let i = 0; i < 3; i++) {
          const u = (i + 0.5) / 3;
          P(hip[0] + (kx - hip[0]) * u, hip[1] + (ky - hip[1]) * u, 'xs', 0, al);
          P(kx + (fx_ - kx) * u, ky + (fy_ - ky) * u, 'xs', 0, al);
        }
        P(fx_, fy_, 's', 0, al);
      });

      // la médula: cuelga de atrás del cerebro y, al caminar, se queda rezagada siguiendo el rastro
      const [bx, by, bz] = proj(0, B * 0.45, -D * 0.9), atras = 0.3 + 0.7 * suavizar(-0.3, 0.3, bz / D);
      for (let i = 1; i <= KM.n; i++) {
        const rest = [bx + sen(t * 2.2 - i * 0.7) * H * 0.012 * i * 0.5, by + i * KM.largo * H];
        const r = c.rastro(i * KM.arrastre);
        const tr = [bx + r[0], by + i * 0.012 * H + r[1] + sen(ph - i * 0.5) * H * 0.006 * i * 0.3];
        P(rest[0] + (tr[0] - rest[0]) * m, rest[1] + (tr[1] - rest[1]) * m, 'xs', 1, i <= 3 ? atras : 1);
      }
    }

    // ===== El ojo (PERSONAJES: gen = genOjo) =====
    // Generador: recibe P y el contexto c (el mismo que el del juego):
    //   t tiempo · mov 0..1 (cuánto camina) · fase (ciclo de la caminata)
    //   yaw = hacia dónde mira el cuerpo, suave: 0 = de frente (hacia abajo en pantalla), ±π/2 = de lado, π = de espaldas
    //   dx, dy rumbo unitario · rastro(lag) = dónde estaba hace "lag" s
    // P(x, y, tam, tono, alfa): tam 'm' | 's' | 'xs'; tono 0 normal, 1 tenue, 2 brillo. Solo se usan m0, s0, xs0, xs1, xs2.
    // Coordenadas locales: (0,0) = suelo bajo el personaje, y negativo = arriba. Siempre pone la misma cantidad de cerebritos.
    // Un globo ocular que flota. Lo que lleva (iris, pupila, venas, párpados, tallo del nervio) está pegado a su superficie:
    // al girar cada punto se desliza por ella y se desvanece al quedar atrás (alfa continua): nada salta ni cambia de tamaño.
    function genOjo(P, c) {
      const H = CONFIG.alturaPersonaje, K = CONFIG.ojo, KN = K.nervio, m = c.mov, t = c.t, ph = c.fase;
      const sen = Math.sin, cos = Math.cos, TAU = Math.PI * 2;
      const co = cos(c.yaw), si = sen(c.yaw), prof = K.profundidad;
      const sq = 1 + sen(ph * 2) * 0.025 * m;                          // se estira y se aplasta un poco al caminar
      const R = K.radio * H;
      const cx = c.dx * K.inclina * H * m;                             // se inclina hacia donde va
      const cy = -K.altura * H - Math.abs(cos(ph)) * H * K.rebote * m + sen(t * 1.9) * H * 0.014;
      const vis = (f) => suavizar(-0.08, 0.3, f);                      // 0..1: cuánto da a la cámara (f = coseno con la vista)
      const veo = (f) => suavizar(-0.5, 0.15, f);                      // lo que sobresale se sigue viendo casi de canto
      // dirección unitaria sobre el globo (nx derecha, ny arriba negativo, nz adelante) a pantalla: [x, y, f]; sale = cuánto sobresale
      const dir = (nx, ny, nz, sale = 0) => {
        const k = 1 + sale, z = nz * R * k * co - nx * R * k * si;
        return [cx + nx * R * sq * k * co + nz * R * k * si, cy + ny * R / sq * k + z * prof, (nz * co - nx * si) * 0.97 - ny * 0.25];
      };
      const sup = (lon, lat, sale = 0) => dir(cos(lat) * sen(lon), -sen(lat), cos(lat) * cos(lon), sale);

      // silueta: el círculo del globo
      for (let i = 0; i < 34; i++) {
        const a = (i / 34) * TAU, r = 1 + 0.012 * sen(t * 2.4 + a * 3);
        P(cx + cos(a) * R * sq * r, cy + sen(a) * R / sq * r, 'm', 0);
      }

      // venas: siete ramas torcidas que salen del iris hacia los lados y hacia atrás del globo
      for (let k = 0; k < 7; k++) {
        for (let j = 0; j < 5; j++) {
          const th = 0.8 + j * 0.28, a = (k / 7) * TAU + 0.4 + 0.3 * sen(j * 1.7 + k * 2.1);
          const [x, y, f] = dir(sen(th) * cos(a), -sen(th) * sen(a), cos(th));
          P(x, y, 'xs', 1, 0.6 * vis(f));
        }
      }

      // párpados: dos arcos por delante del globo. Abiertos enmarcan el iris; al parpadear se juntan y lo tapan
      const ciclo = t % 4.3, abre = ciclo > 4.1 ? 1 - sen(((ciclo - 4.1) / 0.2) * Math.PI) * 0.92 : 1;
      for (const lado of [-1, 1]) {
        for (let i = 0; i < 10; i++) {                                 // los extremos se juntan en las comisuras: queda un ojo almendrado
          const lon = (-1 + (2 * (i + 0.5)) / 10) * 1.35, [x, y, f] = sup(lon, lado * 0.66 * abre * (1 - (lon / 1.4) * (lon / 1.4)), 0.04);
          P(x, y, 'xs', 0, 0.95 * veo(f));
        }
      }

      // el iris (sobresale como una córnea), la pupila brillante y la mirada que divaga
      const wl = 0.12 * sen(t * 0.6), wt = 0.08 * sen(t * 0.9 + 1), ab = Math.min(1, abre * 1.15);
      for (let i = 0; i < 16; i++) {
        const a = (i / 16) * TAU, [x, y, f] = sup(wl + 0.62 * cos(a) / cos(wt), wt + 0.62 * sen(a) * ab, 0.05);
        P(x, y, 's', 0, veo(f));
      }
      for (let i = 0; i < 9; i++) {
        const a = (i / 9) * TAU, [x, y, f] = sup(wl + 0.3 * cos(a) / cos(wt), wt + 0.3 * sen(a) * ab, 0.1);
        P(x, y, 'xs', 2, veo(f));
      }
      { const [x, y, f] = sup(wl, wt, 0.14); P(x, y, 'xs', 2, veo(f)); }

      // el nervio óptico: un tallo en la parte de atrás del globo y una cola que cuelga y, al caminar, se queda rezagada
      for (let i = 0; i < 6; i++) {
        const a = (i / 6) * TAU, [x, y, f] = sup(Math.PI + 0.24 * cos(a) / cos(0.2), -0.2 + 0.24 * sen(a), 0.03);
        P(x, y, 'xs', 0, vis(f));
      }
      const [bx, by, bf] = sup(Math.PI, -0.2, 0.05), atras = 0.3 + 0.7 * suavizar(-0.3, 0.3, bf);
      for (let i = 1; i <= KN.n; i++) {
        const rest = [bx + sen(t * 2.4 - i * 0.7) * H * 0.008 * i, by + i * KN.largo * H];
        const r = c.rastro(i * KN.arrastre);
        const tr = [bx + r[0], by + i * 0.012 * H + r[1]];
        P(rest[0] + (tr[0] - rest[0]) * m, rest[1] + (tr[1] - rest[1]) * m, 'xs', 1, i <= 3 ? atras : 1);
      }
    }

    // ===== El gusano (PERSONAJES: gen = genGusano) =====
    // Generador: recibe P y el contexto c (el mismo que el del juego):
    //   t tiempo · mov 0..1 (cuánto camina) · fase (ciclo de la caminata)
    //   yaw = hacia dónde mira el cuerpo, suave: 0 = de frente (hacia abajo en pantalla), ±π/2 = de lado, π = de espaldas
    //   dx, dy rumbo unitario · rastro(lag) = dónde estaba hace "lag" s
    // P(x, y, tam, tono, alfa): tam 'm' | 's' | 'xs'; tono 0 normal, 1 tenue, 2 brillo. Solo se usan m0, s0, xs0, xs1, xs2.
    // Coordenadas locales: (0,0) = suelo bajo el personaje, y negativo = arriba. Siempre pone la misma cantidad de cerebritos.
    // Dos poses que se mezclan con la caminata (mm): PARADO como cobra (curva en 3D que gira con yaw: la cabeza arriba y la cola
    // hacia atrás) y REPTANDO (el cuerpo sigue el rastro de la cabeza, pegado al suelo y ondulando). La cara está pegada a la cabeza.
    function genGusano(P, c) {
      const H = CONFIG.alturaPersonaje, K = CONFIG.gusano, m = c.mov, t = c.t, ph = c.fase, N = K.n;
      const sen = Math.sin, cos = Math.cos, TAU = Math.PI * 2;
      const co = cos(c.yaw), si = sen(c.yaw), prof = K.profundidad;
      const mm = m * m * (3 - 2 * m);
      // punto local (lx derecha, ly arriba negativo, lz adelante) a pantalla
      const proj = (lx, ly, lz) => [lx * co + lz * si, ly + (lz * co - lx * si) * prof];
      const cab = [0, -K.alto * H + sen(t * 1.7) * H * 0.008, 0.05 * H], ctl = [0, -0.03 * H, 0.12 * H], cola = [0, -0.04 * H, -K.largo * H];
      const sx = [], sy = [];
      for (let i = 0; i < N; i++) {
        const u = i / (N - 1), a = (1 - u) * (1 - u), b = 2 * (1 - u) * u, d = u * u;
        const lx = sen(t * 1.2 - u * 3) * H * 0.02 * (1 - u), ly = a * cab[1] + b * ctl[1] + d * cola[1], lz = a * cab[2] + b * ctl[2] + d * cola[2];
        const [px, py] = proj(lx, ly, lz);                              // pose parada
        const rs = c.rastro(i * K.rastro);                              // pose reptando: donde estuvo la cabeza hace i·rastro segundos
        const rx = rs[0], ry = -0.14 * H + rs[1] + sen(ph * 1.3 - i * 0.65) * H * 0.018 * m;
        sx.push(px + (rx - px) * mm); sy.push(py + (ry - py) * mm);
      }

      // cabeza: el círculo de la silueta y la cara pegada a la superficie (se desliza al girar y se esconde de espaldas)
      const hr = K.cabeza * H, hx = sx[0], hy = sy[0];
      for (let i = 0; i < 12; i++) { const a = (i / 12) * TAU; P(hx + cos(a) * hr, hy + sen(a) * hr, 'm', 0); }
      const cara = (lon, lat) => {
        const l = lon + c.yaw;
        return [hx + hr * 1.08 * cos(lat) * sen(l), hy - hr * 1.08 * sen(lat) + hr * cos(lat) * cos(l) * prof, cos(lat) * cos(l) * 0.97 + sen(lat) * 0.25];
      };
      const veo = (f) => suavizar(-0.1, 0.3, f);
      for (const lado of [-1, 1]) { const [x, y, f] = cara(lado * 0.55, 0.12); P(x, y, 'xs', 2, veo(f)); }   // ojos
      const boca = 0.45 + 0.2 * m;                                      // la boca se abre al reptar
      [[-0.35, -0.45], [0, -boca], [0.35, -0.45]].forEach(([lon, lat]) => { const [x, y, f] = cara(lon, lat); P(x, y, 'xs', 2, veo(f)); });

      // cuerpo: dos bordes por segmento (se afina hacia la cola) y una línea tenue por el lomo
      for (let i = 1; i < N; i++) {
        const a = Math.max(i - 1, 0), b = Math.min(i + 1, N - 1);
        const tx = sx[a] - sx[b], ty = sy[a] - sy[b], l = Math.hypot(tx, ty) || 1;
        const u = i / (N - 1), w = H * (K.ancho - 0.040 * u), tam = i < N * 0.4 ? 'm' : 's';
        P(sx[i] - (ty / l) * w, sy[i] + (tx / l) * w, tam, 0);
        P(sx[i] + (ty / l) * w, sy[i] - (tx / l) * w, tam, 0);
        if (i % 2 === 1) P(sx[i], sy[i], 'xs', 1);
      }
    }

    // ===== La araña, la mano (PERSONAJES: gen = genArana) =====
    // Generador: recibe P y el contexto c (el mismo que el del juego):
    //   t tiempo · mov 0..1 (cuánto camina) · fase (ciclo de la caminata)
    //   yaw = hacia dónde mira el cuerpo, suave: 0 = de frente (hacia abajo en pantalla), ±π/2 = de lado, π = de espaldas
    //   dx, dy rumbo unitario · rastro(lag) = dónde estaba hace "lag" s
    // P(x, y, tam, tono, alfa): tam 'm' | 's' | 'xs'; tono 0 normal, 1 tenue, 2 brillo. Solo se usan m0, s2, xs0, xs1, xs2.
    // Coordenadas locales: (0,0) = suelo bajo el personaje, y negativo = arriba. Siempre pone la misma cantidad de cerebritos.
    // La palma es un elipsoide que gira con yaw. Lo que lleva (ojo, líneas de la palma, muñón) está pegado a su superficie en
    // (lon, lat): al girar cada punto se desliza y se desvanece al quedar atrás (alfa continua): nada salta ni cambia de tamaño.
    function genArana(P, c) {
      const H = CONFIG.alturaPersonaje, K = CONFIG.arana, KP = K.patas, m = c.mov, t = c.t, ph = c.fase;
      const sen = Math.sin, cos = Math.cos, TAU = Math.PI * 2;
      const co = cos(c.yaw), si = sen(c.yaw), prof = K.profundidad;
      const A = K.ancho * H, B = K.alto * H, D = K.fondo * H;
      const cx = c.dx * K.inclina * H * m;                             // se inclina hacia donde va
      const cy = -K.altura * H - Math.abs(cos(ph)) * H * K.rebote * m + sen(t * 2) * H * 0.004;
      const vis = (f) => suavizar(-0.08, 0.3, f);                      // 0..1: cuánto da a la cámara (f = coseno con la vista)
      const veo = (f) => suavizar(-0.5, 0.15, f);                      // lo que sobresale se sigue viendo casi de canto
      // punto del cuerpo (local) a pantalla: [x, y, z hacia la cámara]
      const proj = (lx, ly, lz) => { const z = lz * co - lx * si; return [cx + lx * co + lz * si, cy + ly + z * prof, z]; };
      // punto de la superficie en (lon, lat) (lon 0 = el frente, lat > 0 = arriba); sale = cuánto sobresale; devuelve [x, y, f]
      const sup = (lon, lat, sale = 0) => {
        const p = proj(A * (1 + sale) * cos(lat) * sen(lon), -B * (1 + sale * 0.5) * sen(lat), D * (1 + sale) * cos(lat) * cos(lon));
        return [p[0], p[1], cos(lat) * cos(lon + c.yaw) * 0.97 + sen(lat) * 0.25];
      };

      // silueta de la palma: la elipse que ve la cámara
      const rx = Math.hypot(A * co, D * si), ry = B + 0.02 * H;
      for (let i = 0; i < 18; i++) {
        const a = (i / 18) * TAU, r = 1 + 0.035 * cos(a * 6) + 0.01 * sen(t * 1.7 + a * 3);
        P(cx + cos(a) * rx * r, cy + sen(a) * ry * r, 'm', 0);
      }

      // líneas de la palma: dos anillos ondulados (se esconden donde está el ojo)
      const RE = 0.42;                                                 // radio del ojo (radianes de la superficie)
      [[0.62, 9], [-0.55, 9]].forEach(([lat0, n], j) => {
        for (let i = 0; i < n; i++) {
          const lon = ((i + 0.5 * j) / n) * TAU, lat = lat0 + 0.14 * sen(lon * 3 + j * 2);
          const [x, y, f] = sup(lon, lat);
          const dl = Math.atan2(sen(lon), cos(lon)), libre = suavizar(RE - 0.02, RE + 0.25, Math.hypot(dl * cos(lat), lat));
          P(x, y, 'xs', 1, 0.9 * vis(f) * libre);
        }
      });

      // el ojo de la palma: un globo que sobresale por el frente, con iris que divaga, pupila brillante y parpadeo
      const ciclo = t % 4.3, abre = ciclo > 4.1 ? 1 - sen(((ciclo - 4.1) / 0.2) * Math.PI) * 0.92 : 1;
      const wl = 0.1 * sen(t * 0.6), wt = 0.07 * sen(t * 0.9 + 1);
      for (let i = 0; i < 9; i++) {
        const a = (i / 9) * TAU, [x, y, f] = sup(RE * cos(a), RE * sen(a) * abre, 0.14);
        P(x, y, 'xs', 2, veo(f));
      }
      for (let i = 0; i < 5; i++) {
        const a = (i / 5) * TAU, [x, y, f] = sup(wl + 0.2 * cos(a), wt + 0.2 * sen(a) * abre, 0.2);
        P(x, y, 'xs', 0, veo(f));
      }
      { const [x, y, f] = sup(wl, wt, 0.26); P(x, y, 'xs', 2, veo(f)); }

      // el muñón desgarrado de la muñeca: sobresale por detrás (así de lado se ve cuál es el frente)
      for (let k = 0; k < 5; k++) {
        const [x, y, f] = sup(Math.PI + (k - 2) * 0.15, 0.1 + (k % 2 ? 0.14 : 0) + sen(t * 2 + k) * 0.02, 0.28);
        P(x, y, 'xs', 1, veo(f));
      }

      // seis dedos como patas, con la marcha de trípode: tres en el suelo, tres en el aire. Pisan a los lados de la palma;
      // los de atrás se atenúan al girar
      for (const lado of [-1, 1]) {
        for (let k = 0; k < 3; k++) {
          const fi = ph + ((k + (lado < 0 ? 0 : 1)) % 2 ? Math.PI : 0), sw = sen(fi), lev = Math.max(0, cos(fi));
          const lx = lado * (KP.x + (k === 1 ? 0.02 : 0)) * H, lz = [1, 0, -1][k] * KP.z * H, zf = lz * co - lx * si;
          const fx_ = lx * co + lz * si + sw * KP.paso * H * c.dx * m;
          const fy_ = zf * prof + sw * KP.paso * H * c.dy * 0.5 * m - lev * KP.levante * H * m;
          const hip = proj(lado * A * 0.9, B * 0.1, lz * 0.7);
          const al = 0.35 + 0.65 * suavizar(-0.4, 0.4, zf / (KP.z * H));
          const kx = (hip[0] + fx_) / 2 + limitar((fx_ - cx) / (KP.x * H), -1, 1) * 0.045 * H, ky = (hip[1] + fy_) / 2 - 0.06 * H - lev * 0.03 * H * m;   // la rodilla sube: patas en arco
          for (let i = 0; i < 5; i++) {
            const u = (i + 0.5) / 5;
            P(hip[0] + (kx - hip[0]) * u, hip[1] + (ky - hip[1]) * u, 'xs', 0, al);
            P(kx + (fx_ - kx) * u, ky + (fy_ - ky) * u, 'xs', 0, al);
          }
          P(fx_, fy_, 's', 2, al);                                     // la uña
        }
      }
    }

    // El enjambre de un personaje generado (encapuchado, cerebro, ojo, gusano, araña...): cada cerebrito con sus rasgos propios (fijos por semilla: no parpadean)
    // gen(P, c) = su generador; solo se llama para contar cuántos cerebritos hacen falta
    function crearEnjambreGen(gen) {
      const rng = crearRng(CONFIG.semilla + 7);
      capaN = 0;
      gen(capaP, capaCtx);                                     // solo para contar cuántos hacen falta
      const lista = [];
      for (let i = 0; i < capaN; i++) {
        lista.push({
          tipo: -1, vis: 'siempre', set: 'pers',
          variante: Math.floor(rng() * CONFIG.variaciones),
          rot0: (rng() * 2 - 1) * 0.25,                            // enjambre calmado: casi sin giro al azar,
          k: 42 + rng() * 12,                                      // con un ritmo de seguimiento parejo,
          f1: 0.7 + rng() * 0.6, p1: rng() * 6.283,
          f2: 0.7 + rng() * 0.6, p2: rng() * 6.283,
          f3: 0.7 + rng() * 0.6, p3: rng() * 6.283,
          va: 0.12, ro: 0.04,                                      // y casi sin vibración ni vaivén (el resto del juego usa CONFIG.vibAmp / rotOnda)
          x: 0, y: 0, tx: 0, ty: 0
        });
      }
      return lista;
    }

    // ===== Estado del nivel (se rearma en cada nivel) =====
    const T = CONFIG.celda;
    let nivelActual = 0;
    let TILES = [], FILAS = 0, COLS = 0;
    let PUERTAS = [];                                       // puertas del mapa (cuartitos y puerta final)
    let puertaEnCelda = new Map();                          // "c,r" -> puerta
    let cubiertas = new Set();                              // "c,r" de los cuartos cerrados: se disfrazan de muro
    let CUADROS = [];                                       // cuadros del cerebro malvado
    let polvo = [];                                         // polvo flotante
    let inicio = { c: 1, r: 1 };
    // Llaves sueltas por el nivel: una real y el resto falsas (idénticas a la vista). Se agarran al pasar por encima.
    // estado: 'quieta' | 'recogida' (la real) | 'explotada' (una falsa)
    let llaves = [];
    let salida = null;                                      // portal al siguiente nivel
    let textoDef = null;                                    // lo que el cerebro puede escribir en este nivel
    let textoSuelo = null;                                  // el texto ya escrito (o escribiéndose) en el suelo
    let textoListo = null;                                  // el texto preparado, esperando a que el cuadro lo escriba
    // Puzzle de palancas (nivel 2): cada palanca lleva un cerebro de un tamaño; se tiran de menor a mayor
    let PALANCAS = [];                                      // { c, r, x, y, indice, tam, estado: 'arriba' | 'abajo', valor: 0..1 }
    let palancasOrden = [];                                 // índices de las palancas en el orden correcto
    let palancasProgreso = 0;                               // cuántas van bien tiradas
    let palancasReinicio = 0;                               // si > 0: cuándo se sueltan todas tras un error
    let palancasError = -9;                                 // hasta cuándo parpadean en rojo los cerebros
    let puzzleTipo = null;                                  // 'palancas' (nivel 2) o 'codigo' (nivel 3)
    let puzzleResuelto = false;
    // Puzzle del código (nivel 3): tres números escritos en el suelo de tres salas y un panel en una pared donde se ingresan
    let codigo = [0, 0, 0];                                 // el código verdadero (cambia en cada partida)
    let PISTAS = [];                                        // { c, r, indice, digito, texto } los números del suelo
    let BICHOS = [];                                        // criaturas decorativas amontonadas sobre cada número (apagadas por ahora)
    let PASTOS = [];                                        // el pasto de cada sala de número: { x0, y0, w, h, pasos, canvas }
    let hojas = [];                                         // hojitas de pasto que saltan al caminar
    let pincel = null;                                      // el "cepillo" con que el personaje abre el pasto
    let PANEL = null;                                       // { c, r, x, y } el panel en la fachada de un muro ('N')
    // d = los dígitos puestos; escrito[i] = si ese casillero ya tiene un número puesto (los escritos quedan a la vista en la pared)
    const panelEstado = { abierto: false, slot: 0, d: [0, 0, 0], escrito: [false, false, false], error: -9, tError: 0 };
    let ETIQUETAS = [];                                     // { texto, cuando } rótulos en el suelo (las puertas finales)
    // Final del juego: 'victoria' (SALVACIÓN) o 'derrota' (ESPERANZA: el cerebro malvado se come al personaje)
    let fin = null;                                         // { tipo, t0, cx, cy, texto }
    // La piscina del cuarto de SALVACIÓN: { fase: 'forma' | 'libre' | 'desintegra' | 'fin', t0, tForma, tDes, cx, cy, celdas }
    let piscina = null;
    // La pantalla de inicio (antes del nivel 1): { fase: 'espera' | 'sale', t0, tSalida, down, letras, hint, suelo }
    let portada = null;
    let tieneLlave = false;
    let tiempo = 0;                                         // reloj del juego (s)
    let transicion = null;                                  // fundido entre niveles { t0, destino, cargado, t1 }

    const car = (c, r) => (c >= 0 && r >= 0 && c < COLS && r < FILAS) ? TILES[r][c] : ' ';
    const esMuro = (c, r) => '#LN'.includes(car(c, r)) && car(c, r) !== ' ';   // 'L' = muro con palanca, 'N' = muro con el panel del código
    const claveCelda = (c, r) => c + ',' + r;
    // Para dibujar, un cuarto cerrado cuenta como muro (así se ve un bloque macizo)
    const muroVisual = (c, r) => esMuro(c, r) || cubiertas.has(claveCelda(c, r));
    // Piso que se decora: no las puertas ni los cuartos cerrados
    const PISO = '.@123';                                   // '1' '2' '3' son piso con un número del código en el suelo
    const decorable = (c, r) => PISO.includes(car(c, r)) && car(c, r) !== ' ' && !cubiertas.has(claveCelda(c, r));
    const ES_PUERTA = 'PDSX';                               // P cuartito, D puerta final, S salvación, X esperanza
    // Lo que se puede pisar: piso, inicio y puertas ya abiertas
    const esPiso = (c, r) => {
      const ch = car(c, r);
      if (ch !== ' ' && PISO.includes(ch)) return true;
      if (ch !== ' ' && ES_PUERTA.includes(ch)) return puertaEnCelda.get(claveCelda(c, r)).abierta;
      return false;
    };
    const solido = (c, r) => !esPiso(c, r);                 // lo que no es piso bloquea (incluye fuera del mapa)

    // --- La llave: unos 20 cerebritos que forman su silueta (coordenadas locales, px lógicos)
    const FORMA_LLAVE = [];
    for (let i = 0; i < 8; i++) FORMA_LLAVE.push([-12 + Math.cos(i / 8 * 6.2832) * 6.5, Math.sin(i / 8 * 6.2832) * 6.5]);   // aro
    for (let i = 0; i < 6; i++) FORMA_LLAVE.push([-5 + i * 4.4, 0]);                                                         // eje
    FORMA_LLAVE.push([13, 4.5], [13, 8.5], [17.5, 4.5], [17.5, 8.5]);                                                        // dientes

    // La puerta final lleva un candado dorado para distinguirla, salvo en el nivel del código: ahí el panel de la pared ya es la cerradura
    const tieneCandado = (p) => p.tipo === 'D' && puzzleTipo !== 'codigo';

    // --- Cerebritos de una puerta: fachada con tablones y cerradura, más el disfraz de muro del cuarto que cierra.
    // Cada uno guarda su posición en el mundo; sirven para el bloque cacheado y para la animación al abrirse.
    function crearCerebritosPuerta(p) {
      const rng = rngCelda(p.c, p.r, 71);
      const V = CONFIG.variaciones, lista = [];
      const cx = (p.c + 0.5) * T, cy = (p.r + 0.5) * T;
      // dinamica = true: no va en la imagen cacheada del bloque; se dibuja cada cuadro (para que titile)
      const agregar = (x, y, set, alfa, dinamica = false) => {
        const dist = Math.hypot(x - cx, y - cy);
        lista.push({
          x: x + (rng() - 0.5) * 1.2, y: y + (rng() - 0.5) * 1.2, set, v: Math.floor(rng() * V),
          ang: (rng() - 0.5) * 1.8, alfa, dinamica, fase: rng() * 6.283,
          dx: (x - cx) * (0.4 + rng() * 0.8), dy: (y - cy) * (0.4 + rng() * 0.8) - (20 + rng() * 60),
          demora: Math.min(0.7, dist / T * 0.16 + rng() * 0.12)
        });
      };
      // fachada de la puerta: tablones verticales; el marco y las divisiones brillan más
      const filas = 10, columnas = 10, pf = T / filas, pc = T / columnas;
      for (let j = 0; j < filas; j++) {
        for (let i = 0; i < columnas; i++) {
          const marco = i === 0 || i === columnas - 1 || j === 0 || j === filas - 1;
          const division = i === 3 || i === 6;
          if (!marco && !division && rng() < 0.1) continue;
          const px = p.c * T + (i + 0.5) * pc, py = p.r * T + (j + 0.5) * pf;
          if (tieneCandado(p) && Math.abs(px - cx) < 22 && py > cy - 24 && py < cy + 26) continue;   // hueco para la cerradura dorada
          agregar(px, py, 'muro', marco ? 0.92 : division ? 0.7 : 0.4 + rng() * 0.12);
        }
      }
      if (tieneCandado(p)) {
        // La puerta que hay que abrir: una cerradura dorada (candado con grillete y ojo de cerradura) hecha de cerebritos
        const L = (x, y, a) => agregar(x, y, 'oro', a, true);
        const bw = 30, bh = 24, bx = cx - bw / 2, by = cy + 7 - bh / 2;
        for (let x = bx; x <= bx + bw + 0.1; x += 6) { L(x, by, 0.95); L(x, by + bh, 0.95); }            // cuerpo del candado
        for (let y = by + 6; y < by + bh - 0.1; y += 6) { L(bx, y, 0.95); L(bx + bw, y, 0.95); }
        for (let i = 0; i <= 6; i++) { const a = Math.PI + (i / 6) * Math.PI; L(cx + Math.cos(a) * 10, by + Math.sin(a) * 12, 0.95); }   // grillete
        for (let i = 0; i < 6; i++) { const a = (i / 6) * 6.2832; L(cx + Math.cos(a) * 4.2, cy + 3 + Math.sin(a) * 4.2, 1); }            // ojo de la cerradura
        L(cx, cy + 11, 1); L(cx, cy + 16, 1);
      } else {
        // cuartitos: un cerebro grande tallado y un agujero debajo
        agregar(cx, cy - 6, 'relieve', 0.95);
        agregar(cx, cy + 22, 'muro', 0.95);
      }
      // disfraz del cuarto: techo de muro en cada celda que cierra
      const paso = T / 9;
      for (const [c, r] of p.cubre) {
        const g = rngCelda(c, r, 83);
        for (let j = 0; j < 9; j++) {
          for (let i = 0; i < 9; i++) {
            const bordeC = (i === 0 && !cubiertas.has(claveCelda(c - 1, r)) && !esMuro(c - 1, r)) ||
              (i === 8 && !cubiertas.has(claveCelda(c + 1, r)) && !esMuro(c + 1, r)) ||
              (j === 0 && !cubiertas.has(claveCelda(c, r - 1)) && !esMuro(c, r - 1));
            if (!bordeC && g() < 0.45) continue;
            agregar(c * T + (i + 0.5) * paso, r * T + (j + 0.5) * paso, 'techo', bordeC ? 0.9 : 0.3 + g() * 0.12);
          }
        }
      }
      return lista;
    }

    // --- El cuadro del cerebro malvado: se va dibujando (más o menos según el nivel)
    // Puntos en coordenadas unitarias (ancho 1 = radio), en el orden en que se "dibujan":
    // primero el contorno, luego la grieta central y al final las circunvoluciones.
    function puntosCerebroMalo() {
      const pts = [];
      const N = 54, PI = Math.PI;
      for (let i = 0; i < N; i++) {
        const th = -PI / 2 + (i / N) * PI * 2;                     // empieza arriba y gira en sentido horario
        const hundido = 1 - 0.16 * Math.exp(-Math.pow((th + PI / 2) / 0.18, 2)) - 0.16 * Math.exp(-Math.pow((th - 1.5 * PI) / 0.18, 2));
        const r = (1 + 0.07 * Math.sin(9 * th + 0.6)) * hundido;
        pts.push([Math.cos(th) * r, Math.sin(th) * r * 0.62]);
      }
      for (let i = 0; i < 12; i++) {                               // grieta central, de arriba a abajo
        const t = i / 11;
        pts.push([0.025 * Math.sin(t * 9), -0.38 + t * 0.88]);
      }
      // pliegues de un hemisferio: [centro x, centro y, radio, ángulo inicial, ángulo final] (en grados)
      const pliegues = [[0.46, -0.2, 0.22, 190, 350], [0.4, 0.2, 0.2, 10, 170], [0.7, 0.0, 0.13, 100, 260]];
      for (const lado of [-1, 1]) {                                // se espejan en los dos hemisferios
        for (const [cx, cy, r, a0, a1] of pliegues) {
          for (let i = 0; i < 6; i++) {
            const a = (a0 + (a1 - a0) * (i / 5)) * PI / 180;
            pts.push([lado * (cx + Math.cos(a) * r), (cy + Math.sin(a) * r) * 0.62]);
          }
        }
      }
      return pts;
    }
    const CEREBRO_MALO = puntosCerebroMalo();

    function crearCuadro(d) {
      const x0 = d.c * T + 12, x1 = (d.c + d.w) * T - 12;
      const y0 = d.r * T + 8, y1 = (d.r + 1) * T - 8;               // marco sobre la fachada del muro
      const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
      const rx = Math.min((x1 - x0) * 0.34, (y1 - y0) * 0.5 / 0.62 * 0.86);
      return {
        ...d, x0, x1, y0, y1, cx, cy, rx,
        reveladas: Math.round(d.progreso * CEREBRO_MALO.length),
        pulso: 0                                                     // sube al examinarlo y se apaga solo
      };
    }
    // Zonas de la fachada que quedan libres de ladrillos: el interior de un cuadro y el panel de cada palanca
    const paneles = () => PANEL ? PALANCAS.concat([PANEL]) : PALANCAS;       // palancas y panel del código: ambos llevan marco en la fachada
    const dentroDeCuadro = (x, y) => CUADROS.some((q) => x > q.x0 - 4 && x < q.x1 + 4 && y > q.y0 - 4 && y < q.y1 + 4) ||
      paneles().some((p) => x > p.c * T + 10 && x < (p.c + (p.w || 1)) * T - 10 && y > p.r * T + 4 && y < (p.r + 1) * T - 4);

    // Arma el nivel idx: mapa, puertas, cuartos, llave al azar, cuadros, polvo y posición inicial
    function iniciarNivel(idx) {
      nivelActual = idx;
      SND.nivel(idx);
      const def = NIVELES[idx];
      const gen = def.generar ? def.generar() : { mapa: def.mapa, puntosLlave: [] };   // algunos niveles se generan al azar
      COLS = Math.max(...gen.mapa.map((f) => f.length));
      TILES = gen.mapa.map((f) => f.padEnd(COLS, ' '));
      FILAS = TILES.length;

      PUERTAS = []; puertaEnCelda = new Map(); cubiertas = new Set(); inicio = { c: 1, r: 1 };
      PALANCAS = []; palancasOrden = []; palancasProgreso = 0; palancasReinicio = 0; palancasError = -9;
      puzzleTipo = def.puzzle || null; puzzleResuelto = false;
      PISTAS = []; PANEL = null; ETIQUETAS = []; fin = null; piscina = null; BICHOS = [];
      panelEstado.abierto = false; panelEstado.slot = 0; panelEstado.d = [0, 0, 0]; panelEstado.escrito = [false, false, false]; panelEstado.error = -9;
      ocultarTeclado(); flechasEl.style.display = 'none'; btnFin.style.display = 'none'; btnFinSitio.style.display = 'none';
      codigo = puzzleTipo === 'codigo' ? [0, 0, 0].map(() => Math.floor(Math.random() * 10)) : [0, 0, 0];   // el código cambia en cada partida
      for (let r = 0; r < FILAS; r++) {
        for (let c = 0; c < COLS; c++) {
          const ch = TILES[r][c];
          if (ch === '@') inicio = { c, r };
          if (ch === 'L') PALANCAS.push({ c, r, x: (c + 0.5) * T, y: r * T, indice: PALANCAS.length, tam: 0, estado: 'arriba', valor: 0 });
          if (ch === 'N') {                                  // las 'N' seguidas forman un solo panel, tan ancho como ellas
            if (PANEL && PANEL.r === r && PANEL.c + PANEL.w === c) { PANEL.w++; PANEL.x = (PANEL.c + PANEL.w / 2) * T; }
            else PANEL = { c, r, w: 1, x: (c + 0.5) * T, y: r * T };
          }
          if (ch === '1' || ch === '2' || ch === '3') PISTAS.push({ c, r, indice: Number(ch) - 1, digito: 0, texto: null });
          if (ch !== ' ' && ES_PUERTA.includes(ch)) {
            const p = { c, r, tipo: ch, abierta: false, tAbrir: 0, sacudirHasta: 0, cubre: [], brains: [], bloque: null };
            PUERTAS.push(p);
            puertaEnCelda.set(claveCelda(c, r), p);
          }
        }
      }
      // el cerebro de cada palanca tiene un tamaño distinto, repartido al azar: el orden correcto es de menor a mayor
      if (PALANCAS.length) {
        const tamanos = PALANCAS.map((_, i) => i);
        for (let n = tamanos.length - 1; n > 0; n--) { const m = Math.floor(Math.random() * (n + 1)); [tamanos[n], tamanos[m]] = [tamanos[m], tamanos[n]]; }
        PALANCAS.forEach((p, i) => { p.tam = tamanos[i]; });
        palancasOrden = PALANCAS.slice().sort((a, b) => a.tam - b.tam).map((p) => p.indice);
      }
      // el cuarto de cada puerta: el piso conectado que hay al norte de ella
      for (const p of PUERTAS) {
        const pila = [[p.c, p.r - 1]], vistas = new Set();
        while (pila.length) {
          const [c, r] = pila.pop();
          const k = claveCelda(c, r);
          if (vistas.has(k) || car(c, r) !== '.') continue;
          vistas.add(k); p.cubre.push([c, r]); cubiertas.add(k);
          pila.push([c + 1, r], [c - 1, r], [c, r + 1], [c, r - 1]);
        }
      }
      for (const p of PUERTAS) p.brains = crearCerebritosPuerta(p);

      // las pistas del código: un número gigante escondido en un lugar al azar de su sala (lejos de la entrada), del color
      // de su casillero del panel (1.º morado, 2.º celeste, 3.º rosa)
      PASTOS = []; hojas = [];
      for (const pi of PISTAS) {
        pi.digito = codigo[pi.indice];
        const sala = gen.salas && gen.salas[pi.indice];
        let cx = (pi.c + 0.5) * T, cy = (pi.r + 0.5) * T;                       // si el mapa no define la sala, queda donde está marcado
        if (sala) {
          const rx0 = sala.c0 * T + 70, rx1 = (sala.c1 + 1) * T - 70, ry0 = sala.r0 * T + 80, ry1 = (sala.r1 + 1) * T - 70;
          do {
            cx = rx0 + Math.random() * (rx1 - rx0); cy = ry0 + Math.random() * (ry1 - ry0);
          } while (Math.hypot(cx - sala.entrada.x, cy - sala.entrada.y) < 280);
          // el pasto que cubre todo el piso de la sala
          PASTOS.push({ x0: sala.c0 * T, y0: sala.r0 * T, w: (sala.c1 - sala.c0 + 1) * T, h: (sala.r1 - sala.r0 + 1) * T, pasos: [], ultimo: null, base: null, vista: null, kBake: 0, sucio: true });
        }
        const ancho = 100, alto = 120;
        pi.x = cx; pi.y = cy;
        pi.texto = crearTextoEnRegion(String(pi.digito), cx - ancho / 2, cy - alto / 2, ancho, alto,
          { set: 'slot' + pi.indice, estatico: true, paso: 6, margen: 4, tamMax: 130, max: 900 });
      }
      if (juegoK && pincel) for (const p of PASTOS) hornearPasto(p);                  // se dibuja ya, durante la carga (no al entrar a la sala)
      // las criaturas: amontonadas sobre cada número, una especie distinta en cada sala (ojos, larvas y arañas)
      if (gen.salas && CONFIG.bichos.activo) {
        const rb = crearRng(CONFIG.semilla + 313);
        for (const pi of PISTAS) {
          const sala = gen.salas[pi.indice];
          const tipo = ['ojo', 'larva', 'arana'][pi.indice];
          const n = CONFIG.bichos[['ojos', 'larvas', 'aranas'][pi.indice]];
          const limites = { x0: sala.c0 * T + 20, x1: (sala.c1 + 1) * T - 20, y0: sala.r0 * T + 20, y1: (sala.r1 + 1) * T - 20 };
          const cx = (pi.c + 0.5) * T, cy = (pi.r + 0.5) * T + 18;
          for (let i = 0; i < n; i++) {
            const hx = cx + (rb() - 0.5) * 82, hy = cy + (rb() - 0.5) * 100;
            BICHOS.push({
              tipo, x: hx, y: hy, hx, hy, vx: 0, vy: 0, fase: rb() * 6.283, huye: false, salto: -9, limites,
              seg: tipo === 'larva' ? Array.from({ length: 5 }, () => [hx, hy]) : null,
              mira: [0, 0], parpadeo: rb() * 6                                      // hacia dónde mira (ojos) y cuándo parpadea
            });
          }
        }
      }
      // rótulos de las dos puertas finales, en el suelo delante de cada una (solo se ven cuando se abre la puerta que los esconde)
      const puertaD = PUERTAS.find((p) => p.tipo === 'D');
      for (const p of PUERTAS) {
        if (p.tipo !== 'S' && p.tipo !== 'X') continue;
        const texto = crearTextoEnRegion(p.tipo === 'S' ? 'SALVACIÓN' : 'ESPERANZA', (p.c - 1) * T, (p.r + 1) * T, 3 * T, T,
          { set: 'llave', estatico: true, paso: 4.6, margen: 8, tamMax: 60, max: 1500 });
        ETIQUETAS.push({ texto, cuando: () => !puertaD || puertaD.abierta });
      }

      // las llaves: se reparten al azar entre los sitios posibles; una es la verdadera y el resto son falsas
      tieneLlave = false;
      llaves = [];
      explosiones = [];
      const mezclar = (a) => { for (let n = a.length - 1; n > 0; n--) { const m = Math.floor(Math.random() * (n + 1)); [a[n], a[m]] = [a[m], a[n]]; } return a; };
      // primero los sitios buenos (callejones y cuartitos); si no alcanzan, se completa con celdas cualquiera
      const sitios = mezclar(gen.puntosLlave.slice()).concat(mezclar((gen.puntosRelleno || []).slice()));
      const elegidos = sitios.slice(0, CONFIG.llaves.cantidad);
      const verdadera = Math.floor(Math.random() * elegidos.length);
      elegidos.forEach((s, i) => {
        // si el sitio está dentro de un cuartito, la llave queda escondida hasta que se abra su puerta
        const puerta = PUERTAS.find((p) => p.cubre.some(([c, r]) => c === s.c && r === s.r)) || null;
        llaves.push({
          x: (s.c + 0.5) * T, y: (s.r + 0.5) * T + 18, real: i === verdadera,
          estado: 'quieta', tFin: -9, puerta, fase: Math.random() * 6.283
        });
      });

      CUADROS = (def.cuadros || []).map(crearCuadro);
      textoDef = def.texto || null;
      textoSuelo = null;
      // el texto se prepara ya (cuesta ~100 ms) para que al darle E al cuadro empiece a escribirse sin tirones
      textoListo = (textoDef && CUADROS[0]) ? crearTextoSuelo(textoDef, CUADROS[0]) : null;
      salida = def.salida ? {
        x: (def.salida.c + 0.5) * T, y: (def.salida.r + 0.5) * T, destino: def.salida.destino,
        puerta: PUERTAS.find((p) => p.tipo === 'D') || null
      } : null;

      // polvo: solo en el piso a la vista
      const rng = crearRng(CONFIG.semilla + 99);
      const pisos = [];
      for (let r = 0; r < FILAS; r++) for (let c = 0; c < COLS; c++) if (decorable(c, r)) pisos.push([c, r]);
      polvo = [];
      for (let i = 0; i < CONFIG.polvo.cantidad && pisos.length; i++) {
        const [c, r] = pisos[Math.floor(rng() * pisos.length)];
        polvo.push({
          bx: (c + rng()) * T, by: (r + rng()) * T - rng() * 60,
          ax: 8 + rng() * 16, ay: 6 + rng() * 14,
          fx: 0.12 + rng() * 0.25, fy: 0.1 + rng() * 0.22, px: rng() * 6.283, py: rng() * 6.283,
          a: 0.35 + rng() * 0.65, v: Math.floor(rng() * CONFIG.variaciones)
        });
      }

      // el personaje vuelve a empezar y la cámara salta a su sitio sin deslizarse
      personaje.x = (inicio.c + 0.5) * T; personaje.y = (inicio.r + 0.5) * T;
      personaje.vx = personaje.vy = 0; personaje.amp = 0; personaje.giro = 0; personaje.dirX = 0; personaje.dirY = 1;
      enjambreIniciado = false;
      cam.iniciada = false;
      mundo = null;
      if (juegoK) reconstruirMundo();                        // si todavía no hay tamaño de pantalla, lo hará ajustar()
    }

    // ===== Estado =====
    const canvas = document.getElementById('juego');
    const ctx = canvas.getContext('2d', { alpha: false });
    const panelFps = document.getElementById('fps');
    const elJoy = document.getElementById('joy');
    const btnE = document.getElementById('btnE');
    const tecladoEl = document.getElementById('teclado');
    const btnFin = document.getElementById('btnFin');
    const btnFinSitio = document.getElementById('btnFinSitio');
    const flechasEl = document.getElementById('flechas');

    const personaje = {
      x: 0, y: 0,                                // pies
      vx: 0, vy: 0,
      dirX: 0, dirY: 1,                          // hacia dónde camina (suavizado, para la zancada)
      giro: 0,                                   // hacia dónde mira: 0 = de frente (abajo), π = de espaldas, ±π/2 = de perfil
      amp: 0,                                    // 0 = quieto, 1 = caminando a tope
      fase: 0                                    // fase del ciclo de caminata
    };
    // Personajes elegibles en la pantalla de inicio (solo estético: misma caja, velocidad y sonido para todos).
    //  gen(P, c): su generador (sin esqueleto): cada cuadro dice dónde va cada cerebrito (ver capaGenerar y genCerebro);
    //             null = el humano, que usa el esqueleto (calcularPose / calcularObjetivo)
    //  farol: la luz del personaje sale de su farol (capaLuz), no del torso · crear(): arma su lista de cerebritos
    //  Para sumar uno nuevo: escribir su gen(P, c) (se prueba antes en su página de prueba) y agregarlo acá.
    const PERSONAJES = [
      { id: 'encapuchado', nombre: 'Encapuchado', gen: capaGenerar, farol: true, crear: () => crearEnjambreGen(capaGenerar) },
      { id: 'humano', nombre: 'Humano', gen: null, farol: false, crear: crearEnjambre },
      { id: 'cerebro', nombre: 'Cerebro con patas', gen: genCerebro, farol: false, crear: () => crearEnjambreGen(genCerebro) },
      { id: 'ojo', nombre: 'Ojo', gen: genOjo, farol: false, crear: () => crearEnjambreGen(genOjo) },
      { id: 'gusano', nombre: 'Gusano', gen: genGusano, farol: false, crear: () => crearEnjambreGen(genGusano) },
      { id: 'arana', nombre: 'Araña', gen: genArana, farol: false, crear: () => crearEnjambreGen(genArana) }
    ];
    let sel = Math.max(0, PERSONAJES.findIndex((p) => p.id === CONFIG.personaje));   // el elegido (vive solo en memoria: no se guarda)
    let enjambre = PERSONAJES[sel].crear();
    let morfHasta = 0;                           // hasta cuándo los cerebritos se acomodan despacio tras cambiar de personaje
    // Cambia de personaje: los cerebritos del anterior no desaparecen, parten de donde estaban y se reacomodan en el nuevo
    function elegirPersonaje(dir) {
      if (PERSONAJES.length < 2) return;
      const viejo = enjambre;
      sel = (sel + dir + PERSONAJES.length) % PERSONAJES.length;
      enjambre = PERSONAJES[sel].crear();
      enjambre.forEach((c, j) => { const o = viejo[j % viejo.length]; c.x = o.x; c.y = o.y; c.morf = true; });
      morfHasta = tiempo + CONFIG.inicio.selector.morf;
    }
    const PX = new Float32Array(N_PUNTOS);       // pose actual (px lógicos, mundo)
    const PY = new Float32Array(N_PUNTOS);
    // Del giro del cuerpo: coseno, seno, ancho relativo del torso y cuándo se ve cada tipo de rasgo (0..1)
    const vista = { cs: 1, sn: 0, torso: 1, siempre: 1, frente: 1, espalda: 0, ojos: 1, perfil: 0, ancho: 1 };
    let enjambreIniciado = false;
    let k = 1;                                   // píxeles reales por píxel lógico
    let spritesPers = [];                        // cerebritos del personaje a escala k
    let juegoK = null;                           // sprites del escenario a escala k
    let mundo = null;                            // cachés del escenario { kc, suelo, muros }
    let luces = null;                            // máscaras de luz pre-renderizadas
    let capaOscura = null;                       // canvas fuera de pantalla donde se hace la oscuridad
    let msMundo = 0;                             // lo que tardó en construirse el escenario (para F3)
    let tactil = false;                          // se vio un dedo: se muestra el botón de interactuar

    // Cámara (px lógicos; cam* en píxeles reales ya redondeados para que el fondo no vibre)
    const cam = { x: 0, y: 0, px: 0, py: 0, iniciada: false };

    // ===== Entrada =====
    const MAPA_TECLAS = {
      KeyW: 'arriba', ArrowUp: 'arriba',
      KeyS: 'abajo', ArrowDown: 'abajo',
      KeyA: 'izq', ArrowLeft: 'izq',
      KeyD: 'der', ArrowRight: 'der'
    };
    const activas = new Set();
    let mostrarFps = false;

    window.addEventListener('keydown', (e) => {
      if (e.code === 'F3') {                      // contador de fps oculto (solo para medir)
        e.preventDefault();
        if (!e.repeat) {
          mostrarFps = !mostrarFps;
          panelFps.style.display = mostrarFps ? 'block' : 'none';
        }
        return;
      }
      if (e.code === 'KeyM') {                    // silenciar / activar el sonido
        if (!e.repeat) SND.alternar();
        return;
      }
      if (pausado) {                              // en pausa solo P o Esc reanudan (Tab y Enter manejan los botones)
        if (!e.repeat && (e.code === 'KeyP' || e.code === 'Escape')) { e.preventDefault(); reanudar(); }
        return;
      }
      if (e.code === 'KeyP' && !portada) { if (!e.repeat) pausar(); e.preventDefault(); return; }
      if (portada) {                               // en la pantalla de inicio: Enter o Espacio empiezan (el equivalente del clic en EMPEZAR); ← → o A D cambian de personaje
        if (!e.repeat && (e.code === 'Enter' || e.code === 'NumpadEnter' || e.code === 'Space')) { e.preventDefault(); empezarJuego(); }
        else if (!e.repeat && portadaLista() && MAPA_TECLAS[e.code] === 'izq') { e.preventDefault(); elegirPersonaje(-1); }
        else if (!e.repeat && portadaLista() && MAPA_TECLAS[e.code] === 'der') { e.preventDefault(); elegirPersonaje(1); }
        return;
      }
      if (panelEstado.abierto) {                  // con el panel del código abierto, las teclas son del panel
        if (teclaDelPanel(e)) e.preventDefault();
        return;
      }
      if (fin) {                                  // en un final solo cuenta el botón (con Enter o E también)
        if (fin.tipo === 'derrota' && fin.fase === 'amenaza') {            // la prueba de ESPERANZA: flechas o W A S D
          const d = TECLA_DIR[e.code];
          if (d) { e.preventDefault(); if (!e.repeat) teclaCombo(d); }
          return;
        }
        if (fin.listo && (e.code === 'Enter' || e.code === 'KeyE')) { e.preventDefault(); accionFin(); }
        return;
      }
      if (MAPA_TECLAS[e.code] || e.code === 'KeyE') e.preventDefault();   // la página no hace scroll
      if (MAPA_TECLAS[e.code]) activas.add(MAPA_TECLAS[e.code]);
      if (e.code === 'KeyE' && !e.repeat) interactuar();
    });
    window.addEventListener('keyup', (e) => {
      if (MAPA_TECLAS[e.code]) activas.delete(MAPA_TECLAS[e.code]);
    });
    window.addEventListener('blur', () => { activas.clear(); soltarJoystick(); });   // si pierde el foco, suelta todo

    // Botón de interactuar (solo táctil)
    btnE.addEventListener('pointerdown', (e) => { e.preventDefault(); interactuar(); });

    // Joystick virtual flotante: nace donde se toca (solo con dedo, no con mouse)
    const JOY_RADIO = 56;                          // px de pantalla
    const joy = { id: null, ox: 0, oy: 0, x: 0, y: 0 };
    const perilla = elJoy.firstElementChild;

    function soltarJoystick() {
      joy.id = null; joy.x = 0; joy.y = 0;
      elJoy.style.display = 'none';
    }
    canvas.addEventListener('pointerdown', (e) => {
      canvas.focus();
      if (portada) return;                         // en la pantalla de inicio no hay joystick
      if (e.pointerType !== 'touch') return;
      tactil = true;
      if (joy.id !== null) return;
      joy.id = e.pointerId; joy.ox = e.clientX; joy.oy = e.clientY; joy.x = 0; joy.y = 0;
      elJoy.style.left = joy.ox + 'px';
      elJoy.style.top = joy.oy + 'px';
      elJoy.style.display = 'block';
      perilla.style.transform = 'translate(0, 0)';
      canvas.setPointerCapture(e.pointerId);
    });
    canvas.addEventListener('pointermove', (e) => {
      if (e.pointerId !== joy.id) return;
      const dx = e.clientX - joy.ox, dy = e.clientY - joy.oy;
      const len = Math.hypot(dx, dy) || 1;
      const f = Math.min(1, len / JOY_RADIO);
      joy.x = (dx / len) * f;
      joy.y = (dy / len) * f;
      perilla.style.transform = 'translate(' + (joy.x * JOY_RADIO) + 'px, ' + (joy.y * JOY_RADIO) + 'px)';
    });
    const finToque = (e) => { if (e.pointerId === joy.id) soltarJoystick(); };
    canvas.addEventListener('pointerup', finToque);
    canvas.addEventListener('pointercancel', finToque);

    // ===== Interacción =====
    // Una llave se puede ver y agarrar si sigue quieta y, si está en un cuartito, ya se abrió su puerta (y se deshizo un poco)
    const llaveAlAlcance = (l) => l.estado === 'quieta' && (!l.puerta || (l.puerta.abierta && tiempo - l.puerta.tAbrir > 0.5));

    // Mini explosión de una llave falsa: cerebritos rojos que salen disparados y se apagan
    let explosiones = [];
    function explosionEn(x, y, sinSonido) {
      if (!sinSonido) SND.explosion();
      const n = CONFIG.explosion.cerebritos;
      const brains = [];
      for (let i = 0; i < n; i++) {
        const ang = (i / n) * 6.2832 + Math.random() * 0.4;
        const vel = 50 + Math.random() * 110;
        brains.push({ dx: Math.cos(ang) * vel, dy: Math.sin(ang) * vel * 0.8 - 10, v: i % CONFIG.variaciones, giro: (Math.random() - 0.5) * 8 });
      }
      explosiones.push({ x, y, t0: tiempo, brains });
    }
    const explotarLlave = (l) => explosionEn(l.x, l.y - 30);

    // ===== Puzzle de las palancas =====
    // Tirar la palanca que toca (la del cerebro más pequeño que falta) la deja abajo; una equivocada estalla y lo reinicia todo
    function tirarPalanca(p) {
      if (p.estado === 'abajo' || palancasReinicio > 0 || puzzleResuelto) return;
      p.estado = 'abajo';
      if (p.indice === palancasOrden[palancasProgreso]) {
        SND.palanca();
        palancasProgreso++;
        if (palancasProgreso >= palancasOrden.length) resolverPuzzle();
        else SND.palancaOk(palancasProgreso);
      } else {
        SND.error();
        explosionEn(p.x, p.y + 50, true);                   // mini explosión roja (el sonido es el de error) y todos los cerebros parpadean
        palancasError = tiempo + 1;
        palancasReinicio = tiempo + 0.55;                   // tras un instante, todas las palancas se sueltan
      }
    }
    function resolverPuzzle() {
      puzzleResuelto = true;
      SND.panelOk();
      const pu = PUERTAS.find((q) => q.tipo === 'D');       // la puerta final se deshace sola
      if (pu && !pu.abierta) { pu.abierta = true; pu.tAbrir = tiempo + 0.9; SND.puertaAbre(0.9); }
    }
    function actualizarPalancas(dt) {
      if (palancasReinicio > 0 && tiempo >= palancasReinicio) {
        palancasReinicio = 0; palancasProgreso = 0;
        for (const p of PALANCAS) p.estado = 'arriba';
      }
      for (const p of PALANCAS) p.valor += ((p.estado === 'abajo' ? 1 : 0) - p.valor) * suavizado(CONFIG.palancas.velocidad, dt);
    }
    // La puerta final se abre con la llave (nivel 1) o resolviendo el puzzle (niveles 2 y 3)
    const puertaFinalAbre = () => puzzleTipo ? puzzleResuelto : tieneLlave;

    // ===== Panel del código (nivel 3) =====
    function construirTeclado() {
      for (const t of ['1', '2', '3', '4', '5', '6', '7', '8', '9', '⌫', '0', '✓']) {
        const b = document.createElement('button');
        b.type = 'button'; b.textContent = t;
        b.addEventListener('pointerdown', (ev) => { ev.preventDefault(); teclaPanel(t); });
        tecladoEl.appendChild(b);
      }
      const x = document.createElement('button');
      x.type = 'button'; x.textContent = '✕'; x.className = 'cerrar';
      x.addEventListener('pointerdown', (ev) => { ev.preventDefault(); cerrarPanel(); });
      tecladoEl.appendChild(x);
    }
    // La cruz de flechas para pantallas táctiles (solo se ve durante la prueba de ESPERANZA)
    function construirFlechas() {
      const botones = [['u', '▲', '2'], ['l', '◀', '1'], ['d', '▼', '2'], ['r', '▶', '3']];     // ▲ arriba al centro; ◀ ▼ ▶ abajo
      for (const [d, simbolo] of botones) {
        const b = document.createElement('button');
        b.type = 'button'; b.textContent = simbolo;
        b.style.gridColumn = d === 'l' ? '1' : d === 'r' ? '3' : '2';
        b.style.gridRow = d === 'u' ? '1' : '2';
        b.addEventListener('pointerdown', (ev) => { ev.preventDefault(); teclaCombo(d); });
        flechasEl.appendChild(b);
      }
    }
    function ocultarTeclado() { tecladoEl.style.display = 'none'; }
    function abrirPanel() {
      panelEstado.abierto = true; panelEstado.slot = 0;
      SND.clic();
      activas.clear();
      if (tactil) tecladoEl.style.display = 'grid';          // el teclado de botones solo aparece con pantalla táctil (con teclado no hace falta)
    }
    function cerrarPanel() { panelEstado.abierto = false; ocultarTeclado(); canvas.focus({ preventScroll: true }); }
    // Una tecla del panel: un dígito, borrar (⌫) o confirmar (✓)
    function teclaPanel(t) {
      const p = panelEstado;
      if (t === '✓') confirmarPanel();
      else if (t === '⌫') {
        SND.clic();
        if (p.escrito[p.slot]) { p.d[p.slot] = 0; p.escrito[p.slot] = false; }
        else if (p.slot > 0) { p.slot--; p.d[p.slot] = 0; p.escrito[p.slot] = false; }
      } else { p.d[p.slot] = Number(t); p.escrito[p.slot] = true; p.slot = Math.min(2, p.slot + 1); SND.tecla(Number(t)); }
    }
    function confirmarPanel() {
      const p = panelEstado;
      if (p.d.every((v, i) => v === codigo[i])) {            // código correcto: el panel se cierra y la puerta final se abre
        cerrarPanel();
        resolverPuzzle();
      } else {                                               // incorrecto: estalla un poco y vuelve a pedir
        p.error = tiempo + 0.8;
        SND.error();
        if (PANEL) explosionEn(PANEL.x, PANEL.y + 55, true);
      }
    }
    // Teclado dentro del panel: devuelve true si la tecla se usó
    function teclaDelPanel(e) {
      const p = panelEstado;
      if (e.code === 'Escape') { cerrarPanel(); return true; }
      const num = /^(Digit|Numpad)([0-9])$/.exec(e.code);
      if (num) { teclaPanel(num[2]); return true; }
      if (e.code === 'Backspace') { teclaPanel('⌫'); return true; }
      if (e.code === 'Enter' || e.code === 'NumpadEnter' || (e.code === 'KeyE' && !e.repeat)) { confirmarPanel(); return true; }
      if (e.code === 'ArrowUp' || e.code === 'KeyW') { p.d[p.slot] = (p.d[p.slot] + 1) % 10; p.escrito[p.slot] = true; SND.tecla(p.d[p.slot]); return true; }
      if (e.code === 'ArrowDown' || e.code === 'KeyS') { p.d[p.slot] = (p.d[p.slot] + 9) % 10; p.escrito[p.slot] = true; SND.tecla(p.d[p.slot]); return true; }
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') { p.slot = Math.max(0, p.slot - 1); SND.clic(); return true; }
      if (e.code === 'ArrowRight' || e.code === 'KeyD') { p.slot = Math.min(2, p.slot + 1); SND.clic(); return true; }
      return false;
    }

    // ===== Los dos finales =====
    // Entrar a SALVACIÓN gana; entrar a ESPERANZA es la trampa: el cerebro malvado, ya completo, se come al personaje.
    // Puntos de una flecha que apunta en la dirección (dx, dy): un eje con una cabeza de dos rayas. Centrada en (0,0).
    function puntosFlecha(dx, dy) {
      const pts = [], L = 30, paso = 7;                           // medio largo del eje y separación de los cerebritos
      const n = Math.round((2 * L) / paso);
      for (let i = 0; i <= n; i++) { const s = -L + (2 * L * i) / n; pts.push([dx * s, dy * s]); }
      for (const giro of [0.75, -0.75]) {                        // las dos rayas de la cabeza, hacia atrás desde la punta
        const co = Math.cos(giro), si = Math.sin(giro);
        const bx = -dx * co + dy * si, by = -dx * si - dy * co;
        for (let s = paso; s <= paso * 3 + 0.1; s += paso) pts.push([dx * L + bx * s, dy * L + by * s]);
      }
      return pts;
    }
    const DIRS = { u: [0, -1], d: [0, 1], l: [-1, 0], r: [1, 0] };
    const TECLA_DIR = { ArrowUp: 'u', KeyW: 'u', ArrowDown: 'd', KeyS: 'd', ArrowLeft: 'l', KeyA: 'l', ArrowRight: 'r', KeyD: 'r' };

    // El portal-trampa de ESPERANZA: un arco que parece la salida, al fondo del cuarto (centro, dónde apoya, alto y ancho)
    const portalDe = (p) => ({ x: (p.c + 0.5) * T, base: (p.r - 3) * T + 70, alto: 120, ancho: 90 });

    function iniciarFin(tipo, puerta) {
      fin = { tipo, t0: tiempo, cx: personaje.x, cy: personaje.y - 90, listo: false, texto: null, puerta: puerta || null };
      activas.clear(); soltarJoystick();
      if (tipo === 'victoria') SND.victoria();
      if (tipo === 'derrota') {
        SND.monstruo();
        // La trampa: el monstruo aparece sobre el personaje y hay que repetir una combinación de flechas (distinta cada vez)
        // antes de que acabe la cuenta 3-2-1. Fases: 'amenaza' → 'comido' (fallaste) o 'salvado' (lo lograste).
        const combo = [];
        for (let i = 0; i < CONFIG.final.flechas; i++) {
          let d; do { d = 'udlr'[Math.floor(Math.random() * 4)]; } while (d === combo[i - 1]);   // nunca dos iguales seguidas
          combo.push(d);
        }
        // tCombo: empieza la cuenta 3-2-1 (la banda de arriba está vacía) · tFlechas: termina la cuenta y aparecen las flechas ·
        // tLimite: se acaba el tiempo de la combinación
        const tCombo = tiempo + CONFIG.final.aparece, tFlechas = tCombo + CONFIG.final.segundosPorNumero * 3;
        // el monstruo aparece justo donde estaba el portal (que se transforma en él)
        const po = puerta ? portalDe(puerta) : { x: personaje.x, base: personaje.y - 70, alto: 120 };
        Object.assign(fin, {
          fase: 'amenaza', combo, progreso: 0, tc: null, tS: null, sndCuenta: -1, sndFlechas: false,
          tCombo, tFlechas, tLimite: tFlechas + CONFIG.final.segundosCombo, bx: po.x, by: Math.max(po.base - po.alto / 2, 190), desdeY: 0
        });
        if (tactil) flechasEl.style.display = 'grid';
      }
    }
    // Una flecha pulsada durante la prueba (solo cuenta cuando ya aparecieron las flechas): la correcta avanza la combinación;
    // una equivocada, una sola, y el cerebro te devora
    function teclaCombo(d) {
      if (!fin || fin.tipo !== 'derrota' || fin.fase !== 'amenaza' || tiempo < fin.tFlechas) return;
      if (d === fin.combo[fin.progreso]) {
        fin.progreso++;
        if (fin.progreso >= fin.combo.length) superarAmenaza();
        else SND.flecha(fin.progreso);
      } else {
        devorar();
      }
    }
    // Falló (una flecha mal o se acabó el tiempo): el cerebro se abalanza y se come al personaje
    function devorar() {
      SND.devorar();
      fin.fase = 'comido'; fin.tc = tiempo; fin.desdeY = estadoMonstruo(tiempo).y;
      flechasEl.style.display = 'none';
      const m = estadoMonstruo(tiempo);
      fin.cx = m.x; fin.cy = m.y + 70;                                   // hacia la boca se arremolinan los cerebritos del personaje
    }
    // ¡Lo lograste! El cerebro estalla en cerebritos, esa puerta ya no ataca más, y SALVACIÓN (que estaba cerrada) se abre
    function superarAmenaza() {
      fin.fase = 'salvado'; fin.tS = tiempo;
      SND.estallido(); SND.calmar();
      flechasEl.style.display = 'none';
      const m = estadoMonstruo(tiempo);
      for (let i = 0; i < 6; i++) explosionEn(m.x + (Math.random() - 0.5) * 300, m.y + (Math.random() - 0.3) * 190);
      const X = PUERTAS.find((p) => p.tipo === 'X');
      if (X) X.superada = true;
      const S = PUERTAS.find((p) => p.tipo === 'S');
      if (S && !S.abierta) { S.abierta = true; S.tAbrir = tiempo + 1.2; SND.puertaAbre(1.2); SND.salvacion(1); }   // se deshace unos instantes después del estallido
    }
    // Se mira si el personaje entró a uno de los dos cuartos finales (la primera celda al norte de cada puerta ya abierta)
    function comprobarFinal() {
      if (fin || transicion || piscina) return;
      const pc = Math.floor(personaje.x / T), pr = Math.floor(personaje.y / T);
      for (const p of PUERTAS) {
        if (!p.abierta || p.superada) continue;
        if (p.tipo === 'S' && pc === p.c && pr === p.r && tiempo > p.tAbrir + 0.4) { iniciarPiscina(p); return; }   // llegar a la puerta de SALVACIÓN (ya deshecha)
        if (p.tipo === 'X') {                                                                       // acercarse al portal-trampa de ESPERANZA
          const po = portalDe(p);
          if (Math.hypot(personaje.x - po.x, personaje.y - po.base) < CONFIG.final.portalDisparo) { iniciarFin('derrota', p); return; }
        }
      }
    }
    // La piscina de SALVACIÓN: en el borde el personaje frena y el cuarto se llena, fila por fila desde la puerta, con una cuadrícula
    // perfecta de cerebritos de colores (anillos concéntricos morado, celeste y rosa, y un borde blanco). Cuando vuelve el control hay
    // que caminar hasta el centro: ahí el personaje se desintegra y se pasa a la pantalla final de siempre.
    function iniciarPiscina(p) {
      const P = CONFIG.piscina;
      const cs = p.cubre.map((q) => q[0]), rs = p.cubre.map((q) => q[1]);
      const x0 = Math.min(...cs) * T + P.margen, x1 = (Math.max(...cs) + 1) * T - P.margen;
      const y0 = Math.min(...rs) * T + P.margen, y1 = (Math.max(...rs) + 1) * T - P.margen;
      const cols = Math.floor((x1 - x0) / P.paso) + 1, filas = Math.floor((y1 - y0) / P.paso) + 1;
      const ox = x0 + ((x1 - x0) - (cols - 1) * P.paso) / 2, oy = y0 + ((y1 - y0) - (filas - 1) * P.paso) / 2;
      const mc = (cols - 1) / 2, mf = (filas - 1) / 2, cx = ox + mc * P.paso, cy = oy + mf * P.paso;
      const maxAnillo = Math.round(Math.max(mc, mf));
      const celdas = [];
      for (let j = 0; j < filas; j++) {
        for (let i = 0; i < cols; i++) {
          const anillo = Math.round(Math.max(Math.abs(i - mc), Math.abs(j - mf)));
          const x = ox + i * P.paso, y = oy + j * P.paso;
          celdas.push({
            x, y, v: (i + j) % CONFIG.variaciones,
            set: anillo === maxAnillo ? 'llave' : 'slot' + (anillo % 3),         // borde blanco y, hacia adentro, morado, celeste, rosa...
            orden: (filas - 1 - j) * P.filaCada + Math.abs(i - mc) * 0.004,      // se arma desde la puerta hacia el fondo
            dist: Math.hypot(x - cx, y - cy)
          });
        }
      }
      piscina = { fase: 'forma', t0: tiempo, tForma: filas * P.filaCada + P.aparece, tDes: 0, cx, cy, celdas };
      activas.clear(); soltarJoystick();
      SND.piscina();
    }
    function actualizarPiscina(t) {
      if (!piscina) return;
      const P = CONFIG.piscina;
      if (piscina.fase === 'forma') {
        if (t - piscina.t0 > piscina.tForma) piscina.fase = 'libre';           // la piscina ya está armada: vuelve el control
      } else if (piscina.fase === 'libre') {
        if (Math.hypot(personaje.x - piscina.cx, personaje.y - piscina.cy) < P.mitad) {   // llegó a la mitad: se desintegra
          piscina.fase = 'desintegra'; piscina.tDes = t;
          for (const c of enjambre) { c.dvx = (c.x - piscina.cx) * 0.9 + (Math.random() - 0.5) * 120; c.dvy = -(30 + Math.random() * 130); }
          SND.disolver();
        }
      } else if (piscina.fase === 'desintegra' && t - piscina.tDes > P.desintegra) {
        piscina.fase = 'fin';
        iniciarFin('victoria');                                               // la pantalla final de SALVACIÓN
      }
    }
    // La piscina se dibuja por encima de la oscuridad (así conserva sus colores) y por debajo del personaje no: el personaje queda "sumergido"
    function dibujarPiscina(t) {
      if (!piscina) return;
      const P = CONFIG.piscina, tt = t - piscina.t0;
      const desint = piscina.fase === 'desintegra' || piscina.fase === 'fin';
      const apaga = desint ? 1 - suavizar(P.desintegra * 0.55, P.desintegra, t - piscina.tDes) : 1;
      if (apaga <= 0) return;
      for (const b of piscina.celdas) {
        const u = limitar((tt - b.orden) / P.aparece, 0, 1);
        if (u <= 0 || !visible(b.x, b.y, 12)) continue;
        const ola = 0.5 + 0.5 * Math.sin(t * P.ola - b.dist * 0.05);           // una ola de brillo que sale del centro
        const bore = b.set === 'llave' ? 0.9 : 0.5 + 0.45 * ola;
        estamparMundo(juegoK[b.set][b.v], b.x, b.y + Math.sin(t * 1.6 + b.dist * 0.04) * 0.8, 0, u * bore * apaga);
      }
      ctx.globalAlpha = 1;
      ctx.setTransform(1, 0, 0, 1, 0, 0);
    }

    // ===== La pantalla de inicio =====
    // Trazos de cada letra del título (x, y de 0 a 1 dentro de la caja de la letra): rectos, angulosos y gruesos
    const GLIFOS = {
      B: [[[0.1, 0], [0.1, 1]], [[0.1, 0.08], [0.68, 0.08], [0.92, 0.28], [0.68, 0.48], [0.1, 0.48]], [[0.1, 0.52], [0.76, 0.52], [0.96, 0.76], [0.76, 0.94], [0.1, 0.94]]],
      R: [[[0.1, 1], [0.1, 0.08], [0.72, 0.08], [0.94, 0.3], [0.72, 0.52], [0.1, 0.52]], [[0.5, 0.52], [0.96, 1]]],
      4: [[[0.74, 1], [0.74, 0.02], [0.03, 0.7], [1, 0.7]]],
      1: [[[0.12, 0.3], [0.62, 0.02], [0.62, 1]], [[0.12, 1], [0.98, 1]]],
      N: [[[0.1, 1], [0.1, 0.02], [0.9, 0.98], [0.9, 0]]],
      D: [[[0.1, 0], [0.1, 1]], [[0.1, 0.08], [0.58, 0.08], [0.94, 0.38], [0.94, 0.62], [0.58, 0.92], [0.1, 0.92]]],
      M: [[[0.07, 1], [0.07, 0.02], [0.5, 0.66], [0.93, 0.02], [0.93, 1]]],
      G: [[[0.96, 0.22], [0.7, 0.07], [0.3, 0.07], [0.07, 0.3], [0.07, 0.7], [0.3, 0.93], [0.7, 0.93], [0.96, 0.76], [0.96, 0.5], [0.55, 0.5]]],
      3: [[[0.06, 0.07], [0.94, 0.07], [0.94, 0.93], [0.06, 0.93]], [[0.4, 0.5], [0.94, 0.5]]]
    };
    const ANCHO_GLIFO = { B: 0.6, R: 0.6, 4: 0.66, 1: 0.42, N: 0.66, D: 0.62, M: 0.78, G: 0.64, 3: 0.6 };   // ancho / alto de cada letra
    const FUENTE_INDICACION = 'Arial, sans-serif';
    // Cada letra: [letra, factor de altura]. Las alturas distintas y los cortes dan el aspecto abstracto.
    // La "3" final está caída hacia la derecha: acostada en el suelo, con la boca hacia arriba.
    // Dónde va cada línea sale de CONFIG.inicio.titulo
    const tituloLineas = (S) => [
      { x0: S.titulo.x1, base: S.titulo.base1, glifos: [['B', 1.12], ['R', 0.92], ['4', 1.0], ['1', 1.18], ['N', 0.9]] },
      { x0: S.titulo.x2, base: S.titulo.base2, glifos: [['D', 1.0], ['4', 1.1], ['M', 0.9], ['4', 1.15], ['G', 0.95], ['3', 1.0]] }
    ];

    // Dibuja una letra en un canvas: trazos propios, cortada en dos con la mitad de arriba desplazada
    // (q = tamaño del título respecto al original de 170 px: escala el corte y la rendija)
    function rasterLetra(ch, h, caido, rng, q) {
      const pad = 18, w = Math.round(ANCHO_GLIFO[ch] * h), W = w + pad * 2, H = h + pad * 2, lw = h * 0.17;
      const nuevo = (a, b) => { const c = document.createElement('canvas'); c.width = a; c.height = b; return c; };
      const cerca = nuevo(W, H), g = cerca.getContext('2d');
      g.strokeStyle = '#fff'; g.lineWidth = lw; g.lineJoin = 'miter'; g.miterLimit = 10; g.lineCap = 'butt';
      for (const tr of GLIFOS[ch]) {
        g.beginPath();
        tr.forEach(([x, y], i) => {
          const px = pad + lw / 2 + x * (w - lw), py = pad + lw / 2 + y * (h - lw);
          if (i) g.lineTo(px, py); else g.moveTo(px, py);
        });
        g.stroke();
      }
      // el corte: la mitad de arriba se corre de lado y queda una rendija
      const corte = pad + Math.round(h * (0.35 + rng() * 0.3)), desv = (rng() < 0.5 ? -1 : 1) * (8 + rng() * 8) * q, hueco = Math.max(3, Math.round(5 * q));
      const cortada = nuevo(W, H), gc = cortada.getContext('2d');
      gc.drawImage(cerca, 0, 0, W, corte, desv, 0, W, corte);
      gc.drawImage(cerca, 0, corte + hueco, W, H - corte - hueco, 0, corte + hueco, W, H - corte - hueco);
      if (!caido) return { cv: cortada, pad };
      // caída: el giro de 90° hacia la derecha deja la boca hacia arriba y apoyada en el suelo
      const r = nuevo(H, W), gr = r.getContext('2d');
      gr.translate(H, 0); gr.rotate(Math.PI / 2); gr.drawImage(cortada, 0, 0);
      return { cv: r, pad };
    }
    // Los puntos (escalonados) de un canvas donde hay trazo, ya a su sitio de pantalla
    function muestrearPuntos(cv, x0, y0, paso) {
      const W = cv.width, H = cv.height, d = cv.getContext('2d').getImageData(0, 0, W, H).data, lista = [];
      for (let j = 0, y = paso / 2; y < H; j++, y += paso * 0.88) {
        for (let x = (j % 2) * paso / 2 + paso / 2; x < W; x += paso) {
          if (d[(Math.floor(y) * W + Math.floor(x)) * 4 + 3] < 128) continue;
          lista.push({ x: x0 + x, y: y0 + y });
        }
      }
      return lista;
    }
    // A cada cerebrito: forma, giro, de dónde vuela al armarse y cuándo empieza
    function vestirPuntos(lista, rng, demoraBase) {
      for (const b of lista) {
        b.v = Math.floor(rng() * CONFIG.variaciones);
        b.ang = (rng() - 0.5) * 1.2;
        b.fase = rng() * 6.283;
        b.sx = (rng() - 0.5) * 700; b.sy = (rng() - 0.5) * 500;
        b.demora = demoraBase + (b.x / CONFIG.logico.w) * 0.9 + rng() * 0.15;
      }
      return lista;
    }
    // Las instrucciones de teclas, hechas de cerebritos: un grupo de cuatro teclas en T invertida (arriba; izquierda, abajo, derecha),
    // con letras (tipo 'wasd') o con flechas (tipo 'flechas'). (x0, y0) = esquina de arriba a la izquierda del grupo
    const TECLA = 50, TECLA_GAP = 8, TECLAS_ANCHO = 3 * TECLA + 2 * TECLA_GAP;
    function teclasGrupo(tipo, x0, y0, rng, demora) {
      const K = TECLA, G = TECLA_GAP, W = TECLAS_ANCHO + 8, H = 2 * K + G + 8;
      const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
      const g = cv.getContext('2d');
      g.strokeStyle = '#fff'; g.fillStyle = '#fff'; g.lineWidth = 3.5; g.lineJoin = 'round'; g.lineCap = 'round';
      g.font = '700 33px ' + FUENTE_INDICACION; g.textAlign = 'center'; g.textBaseline = 'middle';
      const posiciones = [[1, 0], [0, 1], [1, 1], [2, 1]];            // arriba, izquierda, abajo, derecha
      const letras = ['W', 'A', 'S', 'D'], dirs = [[0, -1], [-1, 0], [0, 1], [1, 0]];
      posiciones.forEach(([c, r], i) => {
        const x = 4 + c * (K + G), y = 4 + r * (K + G), rad = 8;
        g.beginPath();                                                // el contorno de la tecla (esquinas redondas)
        g.moveTo(x + rad, y); g.arcTo(x + K, y, x + K, y + K, rad); g.arcTo(x + K, y + K, x, y + K, rad);
        g.arcTo(x, y + K, x, y, rad); g.arcTo(x, y, x + K, y, rad); g.closePath(); g.stroke();
        if (tipo === 'wasd') { g.fillText(letras[i], x + K / 2, y + K / 2 + 1); return; }
        const [dx, dy] = dirs[i], cx = x + K / 2, cy = y + K / 2, px = -dy, py = dx;   // la flecha: una punta "^" girada hacia dx, dy
        g.lineWidth = 5; g.beginPath();
        g.moveTo(cx - dx * 7 + px * 10, cy - dy * 7 + py * 10); g.lineTo(cx + dx * 9, cy + dy * 9); g.lineTo(cx - dx * 7 - px * 10, cy - dy * 7 - py * 10);
        g.stroke(); g.lineWidth = 3.5;
      });
      return vestirPuntos(muestrearPuntos(cv, x0 - 4, y0 - 4, 4.2), rng, demora);
    }

    function construirInicio() {
      const S = CONFIG.inicio, rng = crearRng(CONFIG.semilla + 977), letras = [];
      const q = S.altura / 170, gap = Math.round(16 * q);           // el título es q veces el original: el espacio entre letras y el derrame también
      let suelo = [];
      for (const L of tituloLineas(S)) {
        let x = L.x0;
        for (const [ch, e] of L.glifos) {
          const h = Math.round(S.altura * e), caido = ch === '3';
          const r = rasterLetra(ch, h, caido, rng, q);
          const W = r.cv.width, H = r.cv.height, px = x - r.pad, py = L.base + r.pad - H;
          letras.push(vestirPuntos(muestrearPuntos(r.cv, px, py, S.paso), rng, 0));
          x += W - r.pad * 2 + gap;
          if (caido) {                                              // lo que se derramó de la "3" caída
            for (let i = 0; i < 16; i++) suelo.push({ x: x + rng() * 150 * q * (0.3 + rng()), y: L.base - 2 - rng() * rng() * 22 * q });
          }
        }
      }
      vestirPuntos(suelo, rng, 0.6);
      // la indicación "EMPEZAR": centrada bajo el personaje del selector
      const cv = document.createElement('canvas'); cv.width = 420; cv.height = 70;
      const g = cv.getContext('2d');
      g.font = '700 44px ' + FUENTE_INDICACION; g.fillStyle = '#fff';
