<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ideas para el muñeco</title>
  <style>
    html, body {
      margin: 0;
      background: #000;
      color: #8a8a8a;
      font: 13px/1.5 system-ui, sans-serif;
    }
    main { max-width: 1500px; margin: 0 auto; padding: 24px 28px 56px; }
    h1 { margin: 0 0 4px; font-size: 16px; font-weight: 600; color: #bdbdbd; }
    p { margin: 0 0 6px; max-width: 78ch; }
    .barra { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 16px 0 22px; }
    .barra span { color: #6a6a6a; }
    button {
      padding: 6px 14px;
      background: transparent;
      border: 1px solid #6a6a6a;
      color: #c8c8c8;
      font: inherit;
      cursor: pointer;
    }
    button:hover, button:focus-visible { border-color: #e2b84a; color: #e2b84a; outline: none; }
    button[aria-pressed="true"] { border-color: #e2b84a; color: #e2b84a; }
    .rejilla { display: grid; grid-template-columns: repeat(auto-fill, minmax(326px, 1fr)); gap: 18px; }
    .tarjeta { border: 1px solid #1c1c1c; padding: 10px 12px 14px; }
    .tarjeta canvas { display: block; margin: 0 auto; }
    .tarjeta h2 { margin: 8px 0 3px; font-size: 14px; font-weight: 600; color: #d0d0d0; }
    .tarjeta h2 b { margin-right: 8px; color: #e2b84a; font-weight: 600; }
    .tarjeta p { color: #8a8a8a; }
    .tarjeta .nota { color: #5f5f5f; font-size: 12px; }
  </style>
</head>
<body>
  <main>
    <h1>Ideas para el muñeco</h1>
    <p>Todos hechos de cerebritos mini (6 px) con el mismo enjambre del juego: cada cerebrito persigue su sitio y vibra apenas al estar quieto. Cada uno tiene ~70-110 cerebritos. El 0 es el actual, para comparar.</p>
    <div class="barra">
      <button id="bAuto" type="button" aria-pressed="true">Automático (camina solo)</button>
      <button id="bManual" type="button" aria-pressed="false">Manual: WASD / flechas</button>
      <button id="bRearmar" type="button">Rearmar</button>
      <button id="bZoom" type="button" aria-pressed="false">Zoom ×2 (para ver detalles)</button>
      <span>Todos se mueven a la vez, así se comparan.</span>
    </div>
    <div class="rejilla" id="rejilla"></div>
  </main>

  <script>
    // ===== Configuración (editable) =====
    const CONFIG = {
      semilla: 1337,
      dprMax: 2,
      colorTrazo: '#d0d0d0',
      colorTenue: '#7a7a7a',
      colorBrillo: '#ffffff',
      variaciones: 4,
      bultos: 4,
      grosorMin: 0.6,
      grosorRel: 0.13,
      rotacionMax: 0.7,
      celda: { w: 300, h: 330, suelo: 262 },   // canvas de cada idea y altura del suelo
      alturaPersonaje: 180,                    // igual que el juego
      rango: { x: 85, y: 45 },                 // cuánto se puede alejar del centro
      velMax: 110,                             // px/s (más lento que el juego para que quepa en la tarjeta)
      acel: 9,
      cadencia: 0.1,                           // radianes de ciclo por px (más alto que el juego por la velocidad menor)
      mezcla: 10,
      seguirMin: 26,
      seguirMax: 40,
      vibAmp: 0.5,
      vibVel: 2.2,
      rotOnda: 0.12,
      // Recorrido del modo automático: [dirX, dirY, segundos]
      auto: [
        [1, 0, 0.7], [0, 0, 0.9], [-1, 0, 1.4], [0, 0, 0.9], [1, 0, 0.7], [0, 0, 0.9],
        [0, 1, 0.55], [0, 0, 0.7], [0, -1, 1.1], [0, 0, 0.7], [0, 1, 0.55], [0, 0, 0.9]
      ]
    };
    const ALT = CONFIG.alturaPersonaje;
    const TAU = Math.PI * 2;
    const sen = Math.sin, cos = Math.cos;
    const TAM = { xs: 3.6, s: 4.6, m: 6, l: 7.5 };   // tamaños de cerebrito usados
    const limitar = (v, a, b) => Math.min(b, Math.max(a, v));
    const suav = (rapidez, dt) => 1 - Math.exp(-rapidez * dt);
    const frac = (x) => x - Math.floor(x);
    const dpr = Math.min(window.devicePixelRatio || 1, CONFIG.dprMax);
    let zoom = 1;                                    // 1 = tamaño real del juego; 2 = para mirar los detalles
    const escala = () => dpr * zoom;

    // ===== Utilidades =====
    function crearRng(semilla) {
      let a = semilla >>> 0;
      return function () {
        a = (a + 0x6D2B79F5) >>> 0;
        let t = a;
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    // ===== El cerebrito mini (el mismo de la Fase 0) =====
    function crearPathCerebrito(v) {
      const rng = crearRng(CONFIG.semilla + v * 101);
      const j = (a) => (rng() - 0.5) * 2 * a;
      const RX = 0.5, RY = 0.4;
      const p = new Path2D();
      const sobreElipse = (grados, f) => {
        const a = grados * Math.PI / 180;
        return [RX * f * Math.cos(a), RY * f * Math.sin(a)];
      };
      const bultos = CONFIG.bultos;
      const puntoBorde = (signo, i, f) => {
        const [x, y] = sobreElipse(-90 + (180 * i) / bultos, f);
        return [signo * x, y];
      };
      const muesca = puntoBorde(1, 0, 0.72 + j(0.03));
      const lados = [1, -1].map((signo) => {
        const fin = [], ctl = [];
        for (let i = 0; i < bultos; i++) {
          ctl.push(puntoBorde(signo, i + 0.5, 1.2 + j(0.05)));
          fin.push(puntoBorde(signo, i + 1, i + 1 < bultos ? 1 + j(0.04) : 1));
        }
        return { fin, ctl };
      });
      p.moveTo(muesca[0], muesca[1]);
      for (let i = 0; i < bultos; i++) {
        p.quadraticCurveTo(lados[0].ctl[i][0], lados[0].ctl[i][1], lados[0].fin[i][0], lados[0].fin[i][1]);
      }
      for (let i = bultos - 1; i >= 0; i--) {
        const destino = i > 0 ? lados[1].fin[i - 1] : muesca;
        p.quadraticCurveTo(lados[1].ctl[i][0], lados[1].ctl[i][1], destino[0], destino[1]);
      }
      p.moveTo(muesca[0], muesca[1]);
      p.lineTo(j(0.03), RY * 0.95);
      for (const lado of [1, -1]) {
        p.moveTo(lado * (0.05 + j(0.01)), -0.12 + j(0.03));
        p.quadraticCurveTo(lado * (0.26 + j(0.04)), -0.26 + j(0.03), lado * (0.31 + j(0.03)), -0.02 + j(0.03));
        p.moveTo(lado * (0.06 + j(0.01)), 0.14 + j(0.03));
        p.quadraticCurveTo(lado * (0.22 + j(0.04)), 0.08 + j(0.03), lado * (0.32 + j(0.03)), 0.22 + j(0.03));
      }
      return p;
    }

    // Tonos: 0 normal, 1 tenue, 2 brillo
    const TONOS = [CONFIG.colorTrazo, CONFIG.colorTenue, CONFIG.colorBrillo];
    const cacheSprites = new Map();
    function crearSprites(tam, color) {
      const E = escala();
      const lado = Math.ceil(tam + 2);
      const grosor = Math.max(CONFIG.grosorMin, tam * CONFIG.grosorRel);
      const sprites = [];
      for (let v = 0; v < CONFIG.variaciones; v++) {
        const canvas = document.createElement('canvas');
        canvas.width = Math.ceil(lado * E);
        canvas.height = Math.ceil(lado * E);
        const ctx = canvas.getContext('2d');
        ctx.setTransform(E * tam, 0, 0, E * tam, E * lado / 2, E * lado / 2);
        ctx.lineWidth = grosor / tam;
        ctx.lineJoin = 'round';
        ctx.lineCap = 'round';
        ctx.strokeStyle = color;
        ctx.stroke(crearPathCerebrito(v));
        sprites.push({ canvas, lado });
      }
      return sprites;
    }
    function sprite(tam, tono) {
      const clave = tam + '|' + tono;
      let s = cacheSprites.get(clave);
      if (!s) { s = crearSprites(tam, TONOS[tono]); cacheSprites.set(clave, s); }
      return s;
    }

    // ===== Ayudas para armar formas (P = pone un cerebrito objetivo: x, y, tamaño, tono) =====
    function linea(P, ax, ay, bx, by, n, tam, tono = 0) {
      for (let i = 0; i < n; i++) {
        const u = (i + 0.5) / n;
        P(ax + (bx - ax) * u, ay + (by - ay) * u, tam, tono);
      }
    }
    function anillo(P, cx, cy, rx, ry, n, tam, tono = 0, a0 = 0) {
      for (let i = 0; i < n; i++) {
        const a = a0 + (i / n) * TAU;
        P(cx + cos(a) * rx, cy + sen(a) * ry, tam, tono);
      }
    }
    // Dos carriles paralelos a los lados de un segmento; wf(u) = medio ancho en px
    function carriles(P, ax, ay, bx, by, n, wf, tam, tono = 0) {
      const dx = bx - ax, dy = by - ay, l = Math.hypot(dx, dy) || 1;
      const nx = -dy / l, ny = dx / l;
      for (const s of [-1, 1]) {
        for (let i = 0; i < n; i++) {
          const u = (i + 0.5) / n, w = wf(u);
          P(ax + dx * u + nx * w * s, ay + dy * u + ny * w * s, tam, tono);
        }
      }
    }
    const lineal = (a, b) => (u) => a + (b - a) * u;
    function perfil(tabla) {
      return (u) => {
        for (let i = 1; i < tabla.length; i++) {
          if (u <= tabla[i][0]) {
            const [t0, w0] = tabla[i - 1], [t1, w1] = tabla[i];
            const k = (u - t0) / (t1 - t0);
            return w0 + (w1 - w0) * k * k * (3 - 2 * k);
          }
        }
        return tabla[tabla.length - 1][1];
      };
    }
    const bez = (p0, p1, p2, u) => {
      const a = (1 - u) * (1 - u), b = 2 * (1 - u) * u, d = u * u;
      return [a * p0[0] + b * p1[0] + d * p2[0], a * p0[1] + b * p1[1] + d * p2[1]];
    };
    // Carriles a los lados de una curva de Bézier
    function bezCarriles(P, p0, p1, p2, n, wf, tam, tono = 0) {
      for (let i = 0; i < n; i++) {
        const u = (i + 0.5) / n, w = wf(u);
        const [x, y] = bez(p0, p1, p2, u);
        const [xa, ya] = bez(p0, p1, p2, Math.max(0, u - 0.03));
        const [xb, yb] = bez(p0, p1, p2, Math.min(1, u + 0.03));
        const dx = xb - xa, dy = yb - ya, l = Math.hypot(dx, dy) || 1;
        P(x - (dy / l) * w, y + (dx / l) * w, tam, tono);
        P(x + (dy / l) * w, y - (dx / l) * w, tam, tono);
      }
    }

    // ===== Las ideas =====
    // Cada generador recibe P y el contexto c:
    //   t tiempo · mov 0..1 (cuánto camina) · fase (ciclo de la caminata) · fx -1..1 (hacia dónde mira, suave)
    //   dx, dy rumbo unitario · mx, my hacia dónde mira el ojo · abre 0..1 (parpadeo) · rastro(lag) = dónde estaba hace "lag" s
    // Coordenadas locales: (0,0) = suelo entre los pies, y negativo = arriba. Siempre debe poner la misma cantidad de cerebritos.

    // 0. Actual (silueta humana de contornos)
    const PERFIL_TORSO = perfil([[0, 0.035], [0.14, 0.095], [0.32, 0.105], [0.65, 0.078], [1, 0.092]]);
    function genActual(P, c) {
      const H = ALT, m = c.mov, ph = c.fase, dx = c.dx, dy = c.dy * 0.5;
      const reb = -Math.abs(cos(ph)) * H * 0.012 * m;
      const cab = [0, -0.925 * H + reb], cue = [0, -0.84 * H + reb], cad = [0, -0.5 * H + reb];
      anillo(P, cab[0], cab[1], 0.074 * H, 0.074 * H, 14, TAM.m);
      carriles(P, cue[0], cue[1], cad[0], cad[1], 8, (u) => PERFIL_TORSO(u) * H, TAM.m);
      for (const lado of [-1, 1]) linea(P, 0, cue[1], lado * 0.15 * H, -0.79 * H + reb, 3, TAM.m);
      linea(P, -0.07 * H, cad[1], 0.07 * H, cad[1], 3, TAM.m);
      for (const lado of [-1, 1]) {
        const k = lado < 0 ? 0 : 1;
        const fi = ph + (k ? Math.PI : 0), sw = sen(fi), lev = Math.max(0, cos(fi));
        // pierna
        const hx = lado * 0.07 * H, hy = -0.5 * H + reb;
        const fx_ = lado * 0.08 * H + sw * 0.09 * H * dx * m, fy_ = -lev * 0.05 * H * m + sw * 0.09 * H * dy * m;
        const kx = (hx + fx_) / 2, ky = -0.26 * H + reb * 0.5 + fy_ * 0.5 - lev * 0.02 * H * m;
        carriles(P, hx, hy, kx, ky, 4, lineal(0.036 * H, 0.027 * H), TAM.m);
        carriles(P, kx, ky, fx_, fy_, 5, lineal(0.027 * H, 0.016 * H), TAM.m);
        P(fx_ - 0.02 * H, fy_, TAM.xs, 0); P(fx_ + 0.02 * H, fy_, TAM.xs, 0); P(fx_ + c.fx * 0.03 * H, fy_, TAM.xs, 0);
        // brazo (en contrafase con la pierna del mismo lado)
        const sa = -sw;
        const sx = lado * 0.15 * H, sy = -0.79 * H + reb;
        const mx = lado * 0.215 * H + sa * 0.075 * H * dx * m, my = -0.47 * H + reb + sa * 0.075 * H * dy * m;
        const ex = (sx + mx) / 2 + lado * 0.01 * H, ey = (sy + my) / 2;
        carriles(P, sx, sy, ex, ey, 3, lineal(0.026 * H, 0.021 * H), TAM.m);
        carriles(P, ex, ey, mx, my, 3, lineal(0.021 * H, 0.014 * H), TAM.m);
        P(mx, my + 0.022 * H, TAM.s, 0); P(mx, my + 0.042 * H, TAM.s, 0);
      }
      P(cab[0] - 0.03 * H, cab[1] - 0.01 * H, TAM.xs, 2);
      P(cab[0] + 0.03 * H, cab[1] - 0.01 * H, TAM.xs, 2);
      P(cab[0], cab[1] + 0.042 * H, TAM.xs, 2);
    }

    // 1. El encorvado: humano deformado, cabezón colgando, brazos largos que arrastran, lengua afuera
    function genEncorvado(P, c) {
      const H = ALT, m = c.mov, ph = c.fase, t = c.t, f = c.fx, dx = c.dx, dy = c.dy * 0.5;
      const reb = -Math.abs(cos(ph)) * H * 0.01 * m, resp = sen(t * 1.6) * H * 0.006;
      const cad = [-f * 0.02 * H, -0.40 * H + reb];
      const nuca = [f * 0.12 * H, -0.66 * H + reb + resp];
      const cab = [f * 0.20 * H + sen(t * 1.1) * H * 0.006, -0.75 * H + reb + resp * 1.5];
      const ctl = [-f * 0.16 * H, -0.60 * H + reb];
      bezCarriles(P, cad, ctl, nuca, 9, (u) => H * (0.045 + 0.05 * sen(u * Math.PI)), TAM.m);   // joroba
      anillo(P, cab[0], cab[1], 0.13 * H, 0.13 * H, 16, TAM.m);                                // cabezón
      // ojo grande y ojo chico, desiguales
      const ox = f * 0.06 * H;
      anillo(P, cab[0] + ox - 0.05 * H, cab[1] - 0.025 * H, 0.043 * H, 0.043 * H * c.abre, 7, TAM.xs, 2);
      P(cab[0] + ox - 0.05 * H + c.mx * 0.015 * H, cab[1] - 0.025 * H + c.my * 0.012 * H, TAM.xs, 0);
      anillo(P, cab[0] + ox + 0.06 * H, cab[1], 0.026 * H, 0.026 * H * c.abre, 5, TAM.xs, 2);
      P(cab[0] + ox + 0.06 * H + c.mx * 0.01 * H, cab[1] + c.my * 0.008 * H, TAM.xs, 0);
      // lengua colgando
      const bx = cab[0] + f * 0.05 * H, by = cab[1] + 0.075 * H;
      for (let i = 0; i < 5; i++) P(bx + sen(t * 3 - i * 0.8) * H * 0.007 * i * (1 + m), by + i * 0.03 * H, TAM.s, 2);
      for (const lado of [-1, 1]) {
        const k = lado < 0 ? 0 : 1;
        const fi = ph + (k ? Math.PI : 0), sw = sen(fi), lev = Math.max(0, cos(fi));
        // brazo larguísimo que arrastra las manos
        const sa = -sw;
        const sx = nuca[0] + lado * 0.085 * H, sy = nuca[1] + 0.05 * H;
        const hx = sx + f * 0.15 * H + sa * 0.10 * H * dx * m, hy = -0.08 * H + sa * 0.05 * H * dy * m - Math.max(0, sa) * 0.03 * H * m;
        const ex = sx + f * 0.10 * H + sa * 0.04 * H * dx * m * 0.5, ey = (sy + hy) / 2 - 0.02 * H;
        carriles(P, sx, sy, ex, ey, 3, lineal(0.024 * H, 0.02 * H), TAM.m);
        carriles(P, ex, ey, hx, hy, 4, lineal(0.02 * H, 0.012 * H), TAM.m);
        P(hx - 0.014 * H, hy + 0.014 * H, TAM.xs, 0); P(hx, hy + 0.028 * H, TAM.xs, 0); P(hx + 0.014 * H, hy + 0.014 * H, TAM.xs, 0);
        // pierna corta y chueca
        const cx = cad[0] + lado * 0.05 * H, cy = cad[1];
        const px = lado * 0.07 * H + f * 0.02 * H + sw * 0.07 * H * dx * m, py = -lev * 0.04 * H * m + sw * 0.07 * H * dy * m * 0.5;
        const kx = (cx + px) / 2 + f * 0.07 * H, ky = -0.21 * H + py * 0.5 + reb * 0.5;
        carriles(P, cx, cy, kx, ky, 3, lineal(0.03 * H, 0.025 * H), TAM.m);
        carriles(P, kx, ky, px, py, 3, lineal(0.025 * H, 0.014 * H), TAM.m);
        P(px + f * 0.035 * H, py, TAM.xs, 0);
      }
    }

    // 2. Cerebro con patas: un cerebro grande con un ojo, patitas y la médula arrastrando
    function genCerebro(P, c) {
      const H = ALT, m = c.mov, ph = c.fase, t = c.t, dx = c.dx, dy = c.dy * 0.5;
      const reb = -Math.abs(cos(ph)) * H * 0.028 * m;
      const cx = 0, cy = -0.50 * H + reb + sen(t * 1.7) * H * 0.004;
      const sq = 1 + sen(ph * 2) * 0.035 * m;
      const rx = 0.29 * H * sq, ry = 0.20 * H / sq;
      const N = 38;
      for (let i = 0; i < N; i++) {                               // contorno con bultos y la muesca arriba
        const d = ((i + 0.5) / N) * TAU, a = -Math.PI / 2 + d;
        const dd = Math.min(d, TAU - d);
        const r = (1 + 0.08 * cos(a * 9) + 0.012 * sen(t * 1.7 + a * 3)) * (1 - 0.34 * Math.exp(-(dd * dd) / 0.06));
        P(cx + cos(a) * rx * r, cy + sen(a) * ry * r, TAM.m, 0);
      }
      linea(P, cx, cy - ry * 0.8, cx, cy - 0.05 * H, 4, TAM.xs, 1);   // fisura entre los dos hemisferios
      for (const lado of [-1, 1]) {                                   // circunvoluciones: tres pliegues por hemisferio
        for (const [ax, ay, bx, by, qx, qy] of [
          [0.08, -0.12, 0.20, -0.12, 0.14, -0.18], [0.12, 0.00, 0.23, 0.03, 0.19, -0.04], [0.08, 0.13, 0.20, 0.13, 0.14, 0.09]
        ]) {
          for (let i = 0; i < 3; i++) {
            const u = (i + 0.5) / 3, q = [ax, ay], p = [qx, qy], z = [bx, by];
            const bp = bez([q[0] * H, q[1] * H], [p[0] * H, p[1] * H], [z[0] * H, z[1] * H], u);
            P(cx + lado * bp[0], cy + bp[1], TAM.xs, 1);
          }
        }
      }
      const ex = cx + c.mx * 0.02 * H, ey = cy + 0.045 * H + c.my * 0.012 * H;   // el ojo, más chico y abajo
      anillo(P, ex, ey, 0.062 * H, 0.062 * H * c.abre, 10, TAM.xs, 2);
      anillo(P, ex + c.mx * 0.022 * H, ey + c.my * 0.014 * H, 0.034 * H, 0.034 * H * c.abre, 6, TAM.xs, 0);
      P(ex + c.mx * 0.022 * H, ey + c.my * 0.014 * H, TAM.xs, 2);
      for (const lado of [-1, 1]) {                               // patitas
        const k = lado < 0 ? 0 : 1;
        const fi = ph + (k ? Math.PI : 0), sw = sen(fi), lev = Math.max(0, cos(fi));
        const hx = lado * 0.10 * H, hy = cy + 0.18 * H;
        const px = lado * 0.11 * H + sw * 0.08 * H * dx * m, py = -lev * 0.05 * H * m + sw * 0.08 * H * dy * m;
        const kx = (hx + px) / 2 + dx * 0.03 * H * m, ky = (hy + py) / 2 - 0.01 * H;
        linea(P, hx, hy, kx, ky, 3, TAM.xs, 0);
        linea(P, kx, ky, px, py, 3, TAM.xs, 0);
        P(px, py, TAM.s, 0);
      }
      const ax = -c.fx * 0.04 * H, ay = cy + 0.19 * H;           // la médula, colgando y arrastrando
      for (let i = 1; i <= 9; i++) {
        const rest = [ax + sen(t * 2.2 - i * 0.7) * H * 0.012 * i * 0.5, ay + i * 0.026 * H];
        const r = c.rastro(i * 0.05);
        const tr = [ax + r[0], ay + i * 0.012 * H + r[1] + sen(ph - i * 0.5) * H * 0.006 * i * 0.3];
        P(rest[0] + (tr[0] - rest[0]) * m, rest[1] + (tr[1] - rest[1]) * m, TAM.xs, 1);
      }
    }

    // 3. El ojo: un ojo flotante que mira hacia donde vas, con el nervio óptico arrastrando
    const VENAS = [0.4, 1.35, 2.2, 3.55, 4.6];
    function genOjo(P, c) {
      const H = ALT, m = c.mov, t = c.t;
      const cx = 0, cy = -0.46 * H + sen(t * 1.9) * H * 0.014;
      const R = 0.21 * H;
      anillo(P, cx, cy, R, R * (1 + sen(t * 2.4) * 0.012), 34, TAM.m, 0);
      for (const a of VENAS) for (let j = 0; j < 2; j++) {        // venas desde el borde
        const r = R * (0.9 - j * 0.15) * (1 + sen(t * 1.3 + a * 3) * 0.02);
        P(cx + cos(a) * r, cy + sen(a) * r, TAM.xs, 1);
      }
      const ix = cx + c.mx * 0.07 * H, iy = cy + c.my * 0.05 * H, ab = c.abre;
      anillo(P, ix, iy, 0.082 * H, 0.082 * H * ab, 12, TAM.s, 0);
      anillo(P, ix, iy, 0.042 * H, 0.042 * H * ab, 6, TAM.xs, 2);
      P(ix, iy, TAM.xs, 2);
      const ay = cy + R;                                          // nervio óptico
      for (let i = 1; i <= 10; i++) {
        const rest = [sen(t * 2.4 - i * 0.7) * H * 0.008 * i, ay + i * 0.0245 * H];
        const r = c.rastro(i * 0.05);
        const tr = [r[0], ay + i * 0.012 * H + r[1]];
        P(rest[0] + (tr[0] - rest[0]) * m, rest[1] + (tr[1] - rest[1]) * m, TAM.xs, 1);
      }
    }

    // 4. La larva: parada como cobra al estar quieta, reptando al caminar
    function genLarva(P, c) {
      const H = ALT, m = c.mov, t = c.t, f = c.fx, ph = c.fase;
      const N = 24, mm = m * m * (3 - 2 * m);
      const cabR = [f * 0.06 * H + sen(t * 1.2) * H * 0.02, -0.58 * H + sen(t * 1.7) * H * 0.008];
      const ctlR = [f * 0.05 * H, -0.03 * H], colaR = [-f * 0.30 * H, -0.04 * H];
      const sx = [], sy = [];
      for (let i = 0; i < N; i++) {
        const u = i / (N - 1);
        const r = bez(cabR, ctlR, colaR, u);
        const rx = r[0] + sen(t * 1.3 - u * 3) * H * 0.02 * (1 - u), ry = r[1];
        const rs = c.rastro(i * 0.036);
        const cx = rs[0] + sen(ph * 0.5 - i * 0.3) * 0, cy = -0.14 * H + rs[1] + sen(ph * 1.3 - i * 0.65) * H * 0.018 * m;
        sx.push(rx + (cx - rx) * mm); sy.push(ry + (cy - ry) * mm);
      }
      anillo(P, sx[0], sy[0], 0.075 * H, 0.075 * H, 12, TAM.m, 0);                       // cabeza
      P(sx[0] - 0.03 * H + c.mx * 0.012 * H, sy[0] - 0.012 * H + c.my * 0.01 * H, TAM.xs, 2);
      P(sx[0] + 0.03 * H + c.mx * 0.012 * H, sy[0] - 0.012 * H + c.my * 0.01 * H, TAM.xs, 2);
      const boca = 0.012 * H + m * 0.012 * H;
      P(sx[0] - 0.02 * H, sy[0] + 0.035 * H, TAM.xs, 2); P(sx[0], sy[0] + 0.035 * H + boca, TAM.xs, 2); P(sx[0] + 0.02 * H, sy[0] + 0.035 * H, TAM.xs, 2);
      for (let i = 1; i < N; i++) {                                                      // cuerpo: dos bordes por segmento
        const a = Math.max(i - 1, 0), b = Math.min(i + 1, N - 1);
        const tx = sx[a] - sx[b], ty = sy[a] - sy[b], l = Math.hypot(tx, ty) || 1;
        const u = i / (N - 1), w = H * (0.060 - 0.040 * u), tam = i < 11 ? TAM.m : TAM.s;
        P(sx[i] - (ty / l) * w, sy[i] + (tx / l) * w, tam, 0);
        P(sx[i] + (ty / l) * w, sy[i] - (tx / l) * w, tam, 0);
        if (i % 2 === 1) P(sx[i], sy[i], TAM.xs, 1);                                     // anillos del cuerpo
      }
    }

    // 5. La mancha: un charco vivo de cerebritos, se estira al moverse, con dos ojos y goteos
    function genMancha(P, c) {
      const H = ALT, m = c.mov, t = c.t, ph = c.fase;
      const cx = 0, cy = -0.19 * H + sen(t * 1.5) * H * 0.006;
      const rx = 0.25 * H, ry = 0.22 * H;
      const OJOS = [[-0.085 * H + c.mx * 0.015 * H, -0.09 * H], [0.085 * H + c.mx * 0.015 * H, -0.09 * H]];
      const rOjo = 0.05 * H;
      const dl = Math.hypot(c.dx, c.dy * 0.6) || 1, ux = c.dx / dl, uy = c.dy * 0.6 / dl;
      const deforma = (px, py) => {                               // estira a lo largo del rumbo, aprieta de lado
        const a = px * ux + py * uy, b = -px * uy + py * ux;
        const A = a * (1 + 0.22 * m), B = b * (1 - 0.10 * m);
        return [A * ux - B * uy, A * uy + B * ux + sen(ph * 1.4 - px / (0.2 * H)) * H * 0.02 * m];
      };
      const NB = 78;
      for (let i = 0; i < NB; i++) {
        const r = Math.sqrt((i + 0.5) / NB), th = i * 2.39996;
        const rr = r * (1 + (0.07 * sen(3 * th + t * 2.1) + 0.05 * sen(5 * th - t * 2.9)) * r * r);
        let px = cos(th) * rx * rr, py = sen(th) * ry * rr;
        if (py > 0) py *= 0.7;                                     // panza chata: se apoya en el suelo
        for (const [ex, ey] of OJOS) {                             // el cuerpo se aparta de los ojos
          const ddx = px - ex, ddy = py - ey, d = Math.hypot(ddx, ddy);
          if (d < rOjo + 0.012 * H) { const k = (rOjo + 0.012 * H) / (d || 1); px = ex + ddx * k; py = ey + ddy * k; }
        }
        const [x, y] = deforma(px, py);
        const tam = r > 0.8 ? TAM.m : r > 0.45 ? TAM.s : TAM.xs, tono = r > 0.45 ? 0 : 1;
        P(cx + x, cy + y, tam, tono);
      }
      for (const [ex, ey] of OJOS) {                              // ojos
        const [x, y] = deforma(ex, ey);
        anillo(P, cx + x, cy + y, 0.04 * H, 0.04 * H * c.abre, 6, TAM.xs, 2);
        P(cx + x + c.mx * 0.012 * H, cy + y + c.my * 0.01 * H, TAM.xs, 2);
      }
      for (let i = 0; i < 7; i++) {                               // boca (sonrisa)
        const u = (i / 6) * 2 - 1;
        const [x, y] = deforma(u * 0.11 * H, 0.03 * H - u * u * 0.025 * H * (1 + m));
        P(cx + x, cy + y, TAM.xs, 2);
      }
      [-0.14, -0.04, 0.07, 0.15].forEach((gx, j) => {            // goteos que se estiran y se recogen
        const k = frac(t * 0.3 + j * 0.25);
        P(cx + gx * H, cy + 0.12 * H + (0.5 - 0.5 * cos(k * TAU)) * 0.10 * H, TAM.xs, 1);
      });
    }

    // 6. El encapuchado: túnica con la capucha vacía, ojitos adentro, dobladillo goteando; flota
    function genEncapuchado(P, c) {
      const H = ALT, m = c.mov, t = c.t, f = c.fx, ph = c.fase;
      const top = -0.88 * H, hem = -0.12 * H;
      const flota = -Math.abs(sen(ph)) * H * 0.01 * m + sen(t * 1.4) * H * 0.006;
      // capucha redondeada arriba, hombros angostos y túnica que se abre como campana
      const perfilTunica = perfil([[0, 0], [0.04, 0.06], [0.11, 0.10], [0.19, 0.10], [0.25, 0.052], [0.32, 0.12], [0.45, 0.14], [0.7, 0.19], [1, 0.26]]);
      const ancho = (u) => perfilTunica(u) * H;
      const lean = (u) => (1 - u) * c.dx * 0.05 * H * m;
      const sway = (u) => sen(t * 1.3 + u * 2.4) * 0.008 * H * u;
      const X = (u, s) => s * ancho(u) + lean(u) + sway(u);
      const Y = (u) => top + (hem - top) * u + flota;
      for (const s of [-1, 1]) for (let i = 0; i < 12; i++) {      // contorno a los lados
        const u = 0.07 + (i / 11) * 0.93;
        P(X(u, s), Y(u), TAM.m, 0);
      }
      for (let k = 0; k < 5; k++) {                                // remate de la capucha
        P(lean(0) + (k - 2) * 0.026 * H, Y(0.0) + (k - 2) * (k - 2) * 0.006 * H, TAM.m, 0);
      }
      for (let j = 0; j < 12; j++) {                               // dobladillo con goteos
        const ux = -1 + (2 * (j + 0.5)) / 12;
        const L = H * (0.012 + 0.02 * (0.5 + 0.5 * sen(t * 1.7 + j * 1.9))) + ((j % 4 === 1) ? 0.04 * H * (0.5 + 0.5 * sen(t * 1.1 + j)) : 0);
        P(X(1, 1) * ux + (ux > 0 ? 0 : 0), Y(1) + L, TAM.m, 0);
      }
      [1, 5, 9].forEach((j) => {                                   // tres goteos largos
        const ux = -1 + (2 * (j + 0.5)) / 12;
        const L = H * (0.012 + 0.02 * (0.5 + 0.5 * sen(t * 1.7 + j * 1.9))) + 0.04 * H * (0.5 + 0.5 * sen(t * 1.1 + j));
        P(X(1, 1) * ux, Y(1) + L + 0.028 * H, TAM.xs, 1);
        P(X(1, 1) * ux, Y(1) + L + 0.056 * H, TAM.xs, 1);
      });
      const fu = 0.15, fcx = lean(fu) + f * 0.012 * H + c.dx * 0.012 * H * m, fcy = Y(fu);   // cara vacía
      anillo(P, fcx, fcy, 0.06 * H, 0.07 * H, 10, TAM.xs, 1);
      P(fcx - 0.02 * H + c.mx * 0.01 * H, fcy - 0.004 * H + c.my * 0.008 * H, TAM.s, 2);
      P(fcx + 0.02 * H + c.mx * 0.01 * H, fcy - 0.004 * H + c.my * 0.008 * H, TAM.s, 2);
      [-0.45, 0.1, 0.55].forEach((q, k) => {                       // pliegues de la tela
        for (let i = 0; i < 4; i++) {
          const u = 0.34 + (i / 3) * 0.6;
          P(q * ancho(u) + lean(u) + sway(u) + sen(t * 1.1 + k + u * 4) * 0.006 * H, Y(u), TAM.xs, 1);
        }
      });
    }

    // 7. La mano: una mano con un ojo en la palma que camina sobre seis dedos
    function genMano(P, c) {
      const H = ALT, m = c.mov, ph = c.fase, t = c.t, dx = c.dx, dy = c.dy * 0.5;
      const pa = -0.31 * H - Math.abs(cos(ph)) * H * 0.012 * m + sen(t * 2) * H * 0.004;
      anillo(P, 0, pa, 0.14 * H, 0.11 * H, 18, TAM.m, 0);
      anillo(P, 0, pa, 0.062 * H, 0.062 * H * c.abre, 9, TAM.xs, 2);      // el ojo de la palma
      anillo(P, c.mx * 0.025 * H, pa + c.my * 0.02 * H, 0.028 * H, 0.028 * H * c.abre, 5, TAM.xs, 0);
      P(c.mx * 0.025 * H, pa + c.my * 0.02 * H, TAM.xs, 2);
      for (let k = 0; k < 5; k++) {                                       // muñón desgarrado
        P((-0.05 + k * 0.025) * H, pa - 0.10 * H - (k % 2 ? 0.018 * H : 0) + sen(t * 2 + k) * H * 0.004, TAM.xs, 1);
      }
      for (const lado of [-1, 1]) {
        for (let k = 0; k < 3; k++) {
          const ang = [-0.35, 0.25, 0.85][k];
          const ax = lado * cos(ang) * 0.14 * H, ay = pa + sen(ang) * 0.11 * H;
          const fi = ph + (((k + (lado < 0 ? 0 : 1)) % 2) ? Math.PI : 0), sw = sen(fi), lev = Math.max(0, cos(fi));
          const px = lado * (0.19 + 0.085 * k) * H + sw * 0.05 * H * dx * m, py = -lev * 0.05 * H * m + sw * 0.04 * H * dy * m;
          const kx = (ax + px) / 2 + lado * 0.04 * H, ky = ay - (0.03 + 0.03 * (2 - k)) * H - lev * 0.03 * H * m;
          linea(P, ax, ay, kx, ky, 4, TAM.xs, 0);
          linea(P, kx, ky, px, py, 4, TAM.xs, 0);
          P(px, py, TAM.s, 2);                                            // la uña
        }
      }
    }

    // 8. El cabezón: cabeza enorme con ojos desiguales, lengua afuera y patitas (como el monstruo de la home)
    function genCabezon(P, c) {
      const H = ALT, m = c.mov, ph = c.fase, t = c.t, f = c.fx, dx = c.dx, dy = c.dy * 0.5;
      const salto = -Math.abs(sen(ph)) * H * 0.045 * m;
      const cx = 0, cy = -0.47 * H + salto + sen(t * 1.8) * H * 0.005;
      const rx = 0.30 * H, ry = 0.26 * H;
      for (let i = 0; i < 32; i++) {                                      // cráneo un poco deforme
        const a = (i / 32) * TAU, r = 1 + 0.05 * sen(a * 3 + 1) + 0.03 * sen(a * 5 + t * 0.9);
        P(cx + cos(a) * rx * r, cy + sen(a) * ry * r, TAM.m, 0);
      }
      const e1x = cx - 0.10 * H + f * 0.015 * H, e1y = cy - 0.06 * H;     // ojo grande, saltón
      anillo(P, e1x, e1y, 0.078 * H, 0.078 * H * c.abre, 10, TAM.xs, 2);
      anillo(P, e1x + c.mx * 0.03 * H, e1y + c.my * 0.02 * H, 0.035 * H, 0.035 * H * c.abre, 5, TAM.xs, 0);
      P(e1x + c.mx * 0.03 * H, e1y + c.my * 0.02 * H, TAM.xs, 2);
      const e2x = cx + 0.115 * H + f * 0.015 * H, e2y = cy - 0.10 * H;    // ojo chico
      anillo(P, e2x, e2y, 0.045 * H, 0.045 * H * c.abre, 6, TAM.xs, 2);
      P(e2x + c.mx * 0.015 * H, e2y + c.my * 0.01 * H, TAM.xs, 0);
      for (let k = 0; k < 6; k++) {                                       // grieta del cráneo
        P(cx - 0.02 * H + (k % 2 ? 0.03 * H : 0) + k * 0.005 * H, cy - ry + k * 0.03 * H, TAM.xs, 1);
      }
      for (let i = 0; i < 9; i++) {                                       // boca ancha
        const u = (i / 8) * 2 - 1;
        P(cx + u * 0.14 * H, cy + 0.14 * H - u * u * 0.025 * H, TAM.xs, 1);
      }
      for (let i = 1; i <= 7; i++) {                                      // lengua
        P(cx + 0.03 * H + sen(t * 4.2 - i * 0.7) * H * 0.007 * i * (1 + m * 1.5), cy + 0.14 * H + i * 0.027 * H, TAM.s, 2);
      }
      for (const lado of [-1, 1]) {                                       // patitas que saltan
        const k = lado < 0 ? 0 : 1;
        const fi = ph + (k ? Math.PI : 0), sw = sen(fi), lev = Math.max(0, cos(fi));
        const hx = lado * 0.15 * H, hy = cy + ry * 0.9;
        const px = lado * 0.16 * H + sw * 0.07 * H * dx * m, py = -lev * 0.04 * H * m + sw * 0.07 * H * dy * m * 0.5;
        linea(P, hx, hy, px, py, 3, TAM.xs, 0);
        P(px - 0.012 * H, py, TAM.s, 0); P(px + 0.012 * H, py, TAM.s, 0);
      }
      [-0.22, 0.20, -0.06].forEach((gx, j) => {                           // goteo del mentón
        const k = frac(t * 0.25 + j * 0.33);
        P(cx + gx * H, cy + 0.24 * H + (0.5 - 0.5 * cos(k * TAU)) * 0.05 * H, TAM.xs, 1);
      });
    }

    const IDEAS = [
      { nombre: 'Actual (referencia)', gen: genActual,
        desc: 'La silueta humana de siempre, para comparar.',

    // ===== Cada idea con su enjambre =====
    class Figura {
      constructor(def, canvas, idx) {
        this.def = def; this.cv = canvas; this.idx = idx;
        this.ctx = canvas.getContext('2d');
        this.ajustar();
        this.rng = crearRng(CONFIG.semilla + idx * 131 + 5);
        this.ox = CONFIG.celda.w / 2; this.oy = CONFIG.celda.suelo;
        this.x = 0; this.y = 0; this.vx = 0; this.vy = 0;
        this.dx = 1; this.dy = 0; this.fxT = 1; this.fx = 1;
        this.mx = 0; this.my = 0;
        this.fase = 0; this.mov = 0; this.t = 0;
        this.hist = []; this.r = [0, 0];
        this.tx = []; this.ty = []; this.ts = []; this.tt = []; this.cnt = 0;
        this.cer = null;
        this.P = (x, y, tam, tono) => {
          const n = this.cnt++;
          this.tx[n] = x; this.ty[n] = y; this.ts[n] = tam; this.tt[n] = tono;
        };
        this.c = {
          t: 0, mov: 0, fase: 0, fx: 1, dx: 1, dy: 0, mx: 0, my: 0, abre: 1,
          rastro: (lag) => this.rastro(lag)
        };
      }
      ajustar() {                                                          // tamaño del canvas según el zoom
        const { w, h } = CONFIG.celda, E = escala();
        this.cv.width = Math.ceil(w * E); this.cv.height = Math.ceil(h * E);
        this.cv.style.width = w * zoom + 'px'; this.cv.style.height = h * zoom + 'px';
      }
      rearmar() { this.cer = null; }
      rastro(lag) {
        const h = this.hist, tt = this.t - lag;
        let i = h.length - 1;
        while (i > 0 && h[i].t > tt) i--;
        const a = h[i], b = h[Math.min(i + 1, h.length - 1)];
        const k = b.t > a.t ? limitar((tt - a.t) / (b.t - a.t), 0, 1) : 0;
        this.r[0] = a.x + (b.x - a.x) * k - this.x;
        this.r[1] = a.y + (b.y - a.y) * k - this.y;
        return this.r;
      }
      crearEnjambre() {
        const n = this.cnt, rng = this.rng;
        this.cer = {
          X: new Float32Array(n), Y: new Float32Array(n), k: [], f1: [], p1: [], f2: [], p2: [], f3: [], p3: [], v: [], r0: []
        };
        const e = this.cer;
        for (let i = 0; i < n; i++) {
          e.X[i] = this.ox + (rng() - 0.5) * 240;
          e.Y[i] = this.oy - rng() * 220;
          e.k.push(CONFIG.seguirMin + rng() * (CONFIG.seguirMax - CONFIG.seguirMin));
          e.f1.push(0.7 + rng() * 0.6); e.p1.push(rng() * TAU);
          e.f2.push(0.7 + rng() * 0.6); e.p2.push(rng() * TAU);
          e.f3.push(0.7 + rng() * 0.6); e.p3.push(rng() * TAU);
          e.v.push(Math.floor(rng() * CONFIG.variaciones));
          e.r0.push((rng() * 2 - 1) * CONFIG.rotacionMax);
        }
      }
      paso(dt, t, dir) {
        this.t = t;
        const a = suav(CONFIG.acel, dt);
        this.vx += (dir.x * CONFIG.velMax - this.vx) * a;
        this.vy += (dir.y * CONFIG.velMax * 0.8 - this.vy) * a;
        const nx = limitar(this.x + this.vx * dt, -CONFIG.rango.x, CONFIG.rango.x);
        const ny = limitar(this.y + this.vy * dt, -CONFIG.rango.y, CONFIG.rango.y);
        if (nx !== this.x + this.vx * dt) this.vx = 0;
        if (ny !== this.y + this.vy * dt) this.vy = 0;
        this.x = nx; this.y = ny;
        const vel = Math.hypot(this.vx, this.vy);
        this.mov += (limitar(vel / CONFIG.velMax, 0, 1) - this.mov) * suav(CONFIG.mezcla, dt);
        this.fase += vel * dt * CONFIG.cadencia;
        if (vel > 12) {
          this.dx += (this.vx / vel - this.dx) * suav(10, dt);
          this.dy += (this.vy / vel - this.dy) * suav(10, dt);
          const l = Math.hypot(this.dx, this.dy) || 1; this.dx /= l; this.dy /= l;
        }
        if (Math.abs(this.vx) > 14) this.fxT = Math.sign(this.vx);
        this.fx += (this.fxT - this.fx) * suav(9, dt);
        // hacia dónde mira el ojo: al rumbo si camina; si no, vagabundea
        const mxT = this.mov > 0.15 ? this.dx : sen(t * 0.6 + this.idx) * 0.7;
        const myT = this.mov > 0.15 ? this.dy * 0.7 : sen(t * 0.9 + 1 + this.idx) * 0.4;
        this.mx += (mxT - this.mx) * suav(6, dt); this.my += (myT - this.my) * suav(6, dt);
        const ph = (t + this.idx * 0.7) % 4.3;
        const abre = ph > 4.1 ? 1 - sen(((ph - 4.1) / 0.2) * Math.PI) * 0.92 : 1;
        this.hist.push({ t, x: this.x, y: this.y });
        while (this.hist.length > 2 && t - this.hist[0].t > 2) this.hist.shift();

        const c = this.c;
        c.t = t; c.mov = this.mov; c.fase = this.fase; c.fx = this.fx; c.dx = this.dx; c.dy = this.dy;
        c.mx = this.mx; c.my = this.my; c.abre = abre;
        this.cnt = 0;
        this.def.gen(this.P, c);
        if (!this.cer || this.cer.X.length !== this.cnt) this.crearEnjambre();

        const e = this.cer, ox = this.ox + this.x, oy = this.oy + this.y;
        const ctx = this.ctx, E = escala();
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.clearRect(0, 0, this.cv.width, this.cv.height);
        ctx.fillStyle = '#151515';                                         // un hilito de suelo para ver si pisa
        ctx.fillRect(30 * E, Math.round((oy + 1) * E), (CONFIG.celda.w - 60) * E, Math.max(1, Math.round(dpr)));
        for (let i = 0; i < this.cnt; i++) {
          const q = suav(e.k[i], dt);
          e.X[i] += (ox + this.tx[i] - e.X[i]) * q;
          e.Y[i] += (oy + this.ty[i] - e.Y[i]) * q;
          const quieto = 1 - 0.7 * this.mov;
          const vx = sen(t * CONFIG.vibVel * e.f1[i] + e.p1[i]) * CONFIG.vibAmp * quieto;
          const vy = sen(t * CONFIG.vibVel * e.f2[i] + e.p2[i]) * CONFIG.vibAmp * quieto;
          const ang = e.r0[i] + sen(t * 1.3 * e.f3[i] + e.p3[i]) * CONFIG.rotOnda;
          const sp = sprite(this.ts[i], this.tt[i])[e.v[i]];
          const co = cos(ang) * E, si = sen(ang) * E;
          ctx.setTransform(co, si, -si, co, (e.X[i] + vx) * E, (e.Y[i] + vy) * E);
          ctx.drawImage(sp.canvas, -sp.lado / 2, -sp.lado / 2, sp.lado, sp.lado);
        }
      }
    }

    // ===== Página =====
    const figuras = [];
    const rejilla = document.getElementById('rejilla');
    IDEAS.forEach((def, i) => {
      const art = document.createElement('article');
      art.className = 'tarjeta';
      const cv = document.createElement('canvas');
      const h2 = document.createElement('h2');
      const num = document.createElement('b'); num.textContent = String(i);
      h2.append(num, def.nombre);
      const p = document.createElement('p'); p.textContent = def.desc;
      const n = document.createElement('p'); n.className = 'nota'; n.textContent = def.nota;
      art.append(cv, h2, p, n);
      rejilla.appendChild(art);
      figuras.push(new Figura(def, cv, i));
    });

    // Entrada: automática o con el teclado
    let modo = 'auto';
    const teclas = new Set();
    const bAuto = document.getElementById('bAuto'), bManual = document.getElementById('bManual');
    function poner(m) {
      modo = m;
      bAuto.setAttribute('aria-pressed', m === 'auto');
      bManual.setAttribute('aria-pressed', m === 'manual');
    }
    bAuto.addEventListener('click', () => poner('auto'));
    bManual.addEventListener('click', () => poner('manual'));
    document.getElementById('bRearmar').addEventListener('click', () => figuras.forEach((f) => f.rearmar()));
    const bZoom = document.getElementById('bZoom');
    function ponerZoom(z) {
      zoom = z;
      cacheSprites.clear();
      bZoom.setAttribute('aria-pressed', z > 1);
      rejilla.style.gridTemplateColumns = 'repeat(auto-fill, minmax(' + (CONFIG.celda.w * z + 26) + 'px, 1fr))';
      figuras.forEach((f) => f.ajustar());
    }
    bZoom.addEventListener('click', () => ponerZoom(zoom > 1 ? 1 : 2));
    const MAPA = { w: 'u', arrowup: 'u', s: 'd', arrowdown: 'd', a: 'l', arrowleft: 'l', d: 'r', arrowright: 'r' };
    window.addEventListener('keydown', (e) => {
      const k = MAPA[e.key.toLowerCase()];
      if (!k) return;
      e.preventDefault(); teclas.add(k);
      if (modo !== 'manual') poner('manual');
    });
    window.addEventListener('keyup', (e) => { const k = MAPA[e.key.toLowerCase()]; if (k) teclas.delete(k); });
    window.addEventListener('blur', () => teclas.clear());

    const TOTAL_AUTO = CONFIG.auto.reduce((s, a) => s + a[2], 0);
    function direccion(t) {
      let x = 0, y = 0;
      if (modo === 'manual') {
        x = (teclas.has('r') ? 1 : 0) - (teclas.has('l') ? 1 : 0);
        y = (teclas.has('d') ? 1 : 0) - (teclas.has('u') ? 1 : 0);
      } else {
        let s = t % TOTAL_AUTO;
        for (const [ax, ay, d] of CONFIG.auto) { if (s < d) { x = ax; y = ay; break; } s -= d; }
      }
      const l = Math.hypot(x, y) || 1;
      return { x: x / l, y: y / l };
    }

    let ultimo = performance.now();
    let reloj = 0;
    function bucle(ahora) {
      const dt = Math.min(0.05, (ahora - ultimo) / 1000);
      ultimo = ahora; reloj += dt;
      const dir = direccion(reloj);
      for (const f of figuras) f.paso(dt, reloj, dir);
      requestAnimationFrame(bucle);
    }
    requestAnimationFrame((t) => { ultimo = t; bucle(t); });
  </script>
</body>
</html>
